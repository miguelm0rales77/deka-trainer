function fpToggle(){
  if(FP.running){ FP.running=false; fpClear(); fpRender(); return; }
  FP.running=true;
  FP.t=setInterval(()=>{
    FP.elapsed++;
    const f=FP.fmt, countdown=(f==="amrap"||f==="emom");
    const totalSec=FP.mins*60;
    if(f==="emom"){
      const ev=FP.every||60;
      const inMin=ev-(FP.elapsed%ev);
      const im=$("fpinmin"); if(im) im.textContent=inMin;
      if(FP.elapsed%ev===0&&FP.elapsed<totalSec){ beep(990,0.12); setTimeout(()=>beep(990,0.12),160); say(trTxt("Siguiente")); fpRender(); fpResume(); return; }
      if(inMin<=3) beep(440,0.08);
    }
    if(countdown){
      const remain=totalSec-FP.elapsed;
      if(remain<=0){ fpFinish(); return; }
      if(remain<=3) beep(440,0.1);
      const c=$("fpclock"); if(c) c.textContent=String(Math.floor(remain/60)).padStart(2,"0")+":"+String(remain%60).padStart(2,"0");
    } else {
      if(FP.cap&&FP.fmt==="fortime"&&FP.elapsed>=FP.cap*60){ toast("⏱ Time cap"); fpFinish(); return; }
      const c=$("fpclock"); if(c) c.textContent=String(Math.floor(FP.elapsed/60)).padStart(2,"0")+":"+String(FP.elapsed%60).padStart(2,"0");
    }
  },1000);
  FP.timers.push(FP.t);
  beep(660,0.15); fpRender(); fpResume();
}
function fpResume(){ /* tras re-render el interval sigue vivo */ }
function fpRound(){
  FP.done++; beep(880,0.1);
  if((FP.fmt==="fortime"||FP.fmt==="circuit")&&FP.done>=FP.rounds){ fpFinish(); return; }
  if(FP.fmt==="circuit"&&FP.rest){ toast("Descanso "+FP.rest+"s"); }
  fpRender();
}
function fpRung(){
  FP.rung++; beep(880,0.1);
  if(FP.rung>=FP.scheme.length){ fpFinish(); return; }
  fpRender();
}
function fpFinish(){
  if(FP.finished) return; FP.finished=true;
  fpClear(); FP.running=false;
  const mins=Math.max(1,Math.round(FP.elapsed/60));
  const rd=FP.fmt==="ladder"?FP.rung:(FP.done||1);
  const tlabel=String(Math.floor(FP.elapsed/60)).padStart(2,"0")+":"+String(FP.elapsed%60).padStart(2,"0");
  const metric=FP.fmt==="amrap"?{v:FP.done,label:FP.done+" rondas",hi:true}:
    FP.fmt==="emom"?{v:mins,label:mins+" min",hi:true}:
    {v:FP.elapsed,label:tlabel,hi:false};
  st._fb={results:fpResults(FP.fmt,rd,mins),durationMin:mins,mode:"wod",metric,formatName:FORMATS[FP.fmt].name+
    (FP.fmt==="amrap"?" — "+FP.done+" rondas":FP.fmt==="fortime"?" — "+tlabel:"")};
  showFeedback();
}
function fpQuit(){ fpClear(); FP.finished=true; closeOverlay(); }

const VERSION="v16 · 26 ago 2026";
/* El manifest se construye en caliente para que start_url conserve el ?plan=.
   Si iOS lo ignora y usa la URL actual, también es la correcta: por los dos caminos funciona. */
function manifestDinamico(id){
  try{
    // manifest real por persona: Chrome en Android necesita un archivo de verdad
    // (mismo origen) para considerar la app instalable y respetar start_url.
    const href = id ? ("manifest-"+id+".webmanifest") : "manifest.webmanifest";
    const l=document.createElement("link"); l.rel="manifest"; l.href=href;
    document.head.appendChild(l);
    // el nombre que se ve bajo el icono
    const t=document.querySelector('meta[name=apple-mobile-web-app-title]');
    if(t&&PROFILE.appName) t.content=PROFILE.appName;
  }catch(e){}
}
function esStandalone(){
  return window.navigator.standalone===true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}
/* recuerda qué plan usa este dispositivo: al instalar como app, iOS puede
   perder el ?plan= de la URL, así que no podemos depender solo del parámetro */
const KEYPLAN="deka-plan-id";
function planGuardado(){ try{ return localStorage.getItem(KEYPLAN)||""; }catch(e){ return ""; } }
function recordarPlan(id){ try{ id?localStorage.setItem(KEYPLAN,id):localStorage.removeItem(KEYPLAN); }catch(e){} }
async function boot(){
  const enURL=(new URLSearchParams(location.search).get("plan")||"").trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
  if(enURL) recordarPlan(enURL==="miguel"?"":enURL);   // el parámetro manda y se memoriza
  const id = enURL || planGuardado();
  if(id&&id!=="miguel"){
    try{
      const r=await fetch("planes/"+id+".json",{cache:"no-cache"});
      if(!r.ok) throw new Error(r.status);
      applyProfile(await r.json());
    }catch(e){
      /* sin cobertura el plan puede estar simplemente sin descargar todavía:
         decir "no encontrado" ahí sería mentir y mandarte a buscar un enlace
         que está bien */
      document.getElementById("app").innerHTML = navigator.onLine===false
        ? '<div class="card" style="margin:60px 14px"><div class="ctitle">Sin conexión</div><div style="font-size:13px;line-height:1.6">Este plan todavía no está guardado en el móvil. Ábrelo una vez con datos o wifi y a partir de ahí funcionará también sin cobertura.</div><button class="btn" style="margin-top:12px" onclick="location.reload()">REINTENTAR</button></div>'
        : '<div class="card" style="margin:60px 14px"><div class="ctitle">Plan no encontrado</div><div style="font-size:13px;line-height:1.6">No he podido cargar <b>planes/'+esc(id)+'.json</b>.<br><br>Comprueba el enlace o pide uno nuevo. Mientras, puedes usar el plan por defecto:</div><button class="btn" style="margin-top:12px" onclick="recordarPlan(\'\');location.search=\'\'">Abrir plan por defecto</button></div>';
      return;
    }
  } else {
    // primera vez en la app instalada, sin parámetro ni memoria: preguntar en vez de asumir
    if(!enURL && !planGuardado() && esStandalone() && !localStorage.getItem("deka-trainer-v4")){
      manifestDinamico("");
      return elegirPlanInicial();
    }
    applyProfile(null);
  }
  manifestDinamico(PROFILE.id==="miguel"?"":PROFILE.id);
  checkBadges();
  render();
}
function elegirPlanInicial(){
  document.getElementById("app").innerHTML=
   '<div class="card" style="margin:48px 14px"><div class="ctitle">¿De quién es este plan?</div>'+
   '<div style="font-size:13px;line-height:1.6;color:#8A8F98;margin-bottom:14px">Al instalar la app se ha perdido el identificador del enlace. Escribe el tuyo una sola vez y ya queda guardado en este móvil.</div>'+
   '<input type="text" id="planIni" placeholder="marchena, iker, lydia…" autocapitalize="off" autocorrect="off">'+
   '<button class="btn" style="margin-top:12px" onclick="fijarPlanInicial()">CONTINUAR</button>'+
   '<button class="btn2" style="margin:0" onclick="fijarPlanInicial(true)">Usar el plan por defecto</button></div>';
  setTimeout(()=>{const e=document.getElementById("planIni"); if(e) e.focus();},80);
}
function fijarPlanInicial(defecto){
  const v=defecto?"":((document.getElementById("planIni").value||"").trim().toLowerCase().replace(/[^a-z0-9_-]/g,""));
  recordarPlan(v==="miguel"?"":v);
  location.href=location.pathname+(v&&v!=="miguel"?"?plan="+v:"?plan=miguel");
}
boot();

/* Service worker: guarda la app en el móvil para que abra al instante y
   funcione sin cobertura. Solo en https, que es lo que sirve GitHub Pages;
   abriendo el archivo en local no se registra y no pasa nada. */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
