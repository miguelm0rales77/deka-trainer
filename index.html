*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0D0F12}
body{background:#0D0F12;min-height:100vh;color:#e8e8f0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;max-width:480px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom));background-image:linear-gradient(rgba(232,255,58,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(232,255,58,.02) 1px,transparent 1px);background-size:40px 40px}
.screen{padding:16px 14px 0;display:none}
.screen.active{display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #242A32;padding-top:env(safe-area-inset-top)}
.logo{font-family:'Bebas Neue',impact,sans-serif;font-size:21px;letter-spacing:3px;color:#A8E63E;text-shadow:0 0 20px rgba(232,255,58,.3)}
.slbl{font-family:monospace;font-size:10px;color:#8A8F98;text-transform:uppercase;letter-spacing:2px;text-align:right}
.card{background:#161A20;border:1px solid #242A32;border-radius:18px;padding:16px;margin-bottom:14px}
.ctitle{font-size:13px;font-weight:700;color:#eceef2;letter-spacing:-.2px;margin-bottom:12px;text-transform:none;font-family:inherit}
.ctitle.mini{font-family:monospace;font-size:9px;color:#8A8F98;text-transform:uppercase;letter-spacing:2px;font-weight:400}
.metricrow{background:#1c1c2a;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.metricrow .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.metricrow .nm{font-size:14px;font-weight:600}
.metricrow .pct{font-size:14px;font-weight:700;color:#A8E63E}
.metricrow .sub{display:flex;justify-content:space-between;font-size:11px;color:#8A8F98;margin-top:7px}
.bar{height:7px;background:#2a2a3d;border-radius:4px;overflow:hidden}
.bar>div{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:#A8E63E;color:#0D0F12;font-family:'Bebas Neue',impact,sans-serif;font-size:19px;letter-spacing:3px;cursor:pointer;margin-bottom:10px;display:block}
.btn:disabled{opacity:.35}
.btn2{width:100%;padding:11px;border-radius:12px;border:1px solid #242A32;background:transparent;color:#8A8F98;font-family:monospace;font-size:12px;letter-spacing:1px;cursor:pointer;margin-bottom:10px;display:block}
.btn3{padding:7px 11px;border-radius:8px;border:1px solid #242A32;background:transparent;color:#8A8F98;font-size:11px;cursor:pointer}
.btn3.sel{border-color:#A8E63E;color:#A8E63E;background:rgba(232,255,58,.08)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#14171C;border-top:1px solid #242A32;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:10px 0 7px;background:none;border:none;color:#8A8F98;font-family:monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nb.active{color:#A8E63E}
.nb span.ic{font-size:16px}
.big{font-family:'Bebas Neue',impact,sans-serif;line-height:1}
.mono{font-family:monospace}
.dim{color:#8A8F98}
.row{display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tagz{font-size:10px;padding:3px 8px;border-radius:10px;display:inline-block;font-family:monospace}
input[type=range]{accent-color:#A8E63E;flex:1}
input[type=text],input[type=number],textarea,select{background:#14171C;border:1px solid #242A32;border-radius:10px;padding:10px;color:#e8e8f0;font-size:13px;outline:none;font-family:inherit;width:100%}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8A8F98 50%),linear-gradient(135deg,#8A8F98 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.hbar{height:5px;background:#2a2a3d;border-radius:3px;overflow:hidden}
.hbar>div{height:100%;border-radius:3px;transition:width .6s}
.dotday{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid #2a2a3d;color:#5a5a74}
.dotday.today{box-shadow:0 0 0 2px rgba(232,255,58,.35)}
.beatdot{width:9px;height:9px;border-radius:50%;background:#242A32;transition:all .05s}
.beatdot.on{background:#A8E63E;box-shadow:0 0 14px rgba(232,255,58,.8);transform:scale(1.5)}
.daybox{border:1px solid #242A32;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.overlay{position:fixed;inset:0;background:rgba(5,5,10,.92);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 14px calc(30px + env(safe-area-inset-bottom))}
.overlay.open{display:flex}
.ovcard{background:#14141f;border:1px solid #242A32;border-radius:16px;padding:16px;width:100%;max-width:452px}
.muscle{transition:fill .5s}
.wkhead{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:#161A20;border:1px solid #242A32;border-radius:12px;margin-bottom:6px}
.wbadge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;font-family:monospace}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#A8E63E;color:#0D0F12;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;display:none;max-width:90%}

var _trRx=null;
function trBuild(){
  const d=I18N[PROFILE.lang]; _trRx=null; if(!d) return;
  const ks=Object.keys(d).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  _trRx=new RegExp(ks.join("|"),"g");
}
function trTxt(t){ const d=I18N[PROFILE.lang]; if(!d||!_trRx) return t;
  return String(t).replace(_trRx,m=>d[m]||m); }
/* traduce el DOM ya renderizado: nunca toca atributos ni manejadores */
function trDOM(root){
  const d=I18N[PROFILE.lang]; if(!d||!_trRx||!root) return;
  const it=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false), ns=[];
  let n; while(n=it.nextNode()) ns.push(n);
  ns.forEach(x=>{ const t=x.textContent; if(!t.trim()) return;
    const r=t.replace(_trRx,m=>d[m]||m); if(r!==t) x.textContent=r; });
  root.querySelectorAll("[placeholder]").forEach(e=>{ e.placeholder=e.placeholder.replace(_trRx,m=>d[m]||m); });
}

function exEquip(e){
  const n=e.name.toUpperCase(), wgt=(e.weight||"").toLowerCase();
  if(/^REMO$/.test(n)) return "remo";
  if(n==="SKIERG") return "skierg";
  if(n==="ASSAULT BIKE") return "bike";
  if(n==="CARRERA") return "ninguno";
  if(/BOXEO/.test(n)) return "boxeo";
  if(/CLUBBELL/.test(n)) return "clubbell";
  if(/COMBA|DOUBLE UNDER/.test(n)||/comba/.test(wgt)) return "comba";
  if(/ANILLA|RING/.test(n)||/anillas/.test(wgt)) return "anillas";
  if(/PULL-UPS|TOES TO BAR|HANGING/.test(n)) return "anillas";
  if(/SANDBAG|BEAR HUG|SACO/.test(n)||/saco/.test(wgt)) return "saco";
  if(/MANCUERNA|APERTURAS|ELEVACIONES|PULLOVER|ENCOGIMIENTOS|EXTENSIÓN TRÍCEPS/.test(n)||/×\d+kg/.test(wgt)&&/MANCUERNA/.test(n)) return "mancuernas";
  if(/BARRA|SENTADILLA|PESO MUERTO|PRESS BANCA|PRESS MILITAR|PUSH PRESS|FRONT SQUAT|HIP THRUST|RDL$|REMO CON BARRA|FLOOR PRESS|CURL BÍCEPS/.test(n)||/barra/.test(wgt)) return "barra";
  if(/TO PLATE/.test(n)||/disco/.test(wgt)) return "disco";
  if(/BOX|CAJÓN/.test(n)||/cajón/.test(wgt)) return "cajon";
  if(/WALL BALL|SIT-UP THROW|SLAM BALL|RUSSIAN TWIST/.test(n)||/balón/.test(wgt)) return "balon";
  if(/KB |KETTLEBELL|GOBLET|FARMER|SUITCASE|OVERHEAD CARRY|THRUSTER|DEAD BALL|LUNGES/.test(n)||/kb/.test(wgt)) return "kb";
  if(/CHALECO/.test(n)||/chaleco/.test(wgt)) return "chaleco";
  if(/2×\d|×\d+kg/.test(wgt)) return "mancuernas";
  return "ninguno";
}
function hasEquip(e){ const q=exEquip(e); return q==="ninguno"||(PROFILE.equipment||[]).includes(q); }

const HELP={
  heatmap:{t:"🫀 Mapa de carga muscular",b:"Se calienta con los <b>entrenamientos que registras</b>, no con las agujetas. Cada ejercicio reparte su volumen (reps × peso) entre los grupos musculares que trabaja, y el mapa acumula esa carga en los últimos 7 días.<br><br><b>Colores:</b> gris = sin carga · verde→amarillo→naranja = carga creciente relativa · <b style='color:#ff4f3a'>rojo = sobrecarga</b> (ACWR &gt; 1.5).<br><br>El <b>diario de agujetas</b> es una señal aparte: puedes entrenar sin tener agujetas. Por eso el mapa mide la carga objetiva y las agujetas actúan solo como veto extra del generador."},
  acwr:{t:"📈 ACWR — ratio de carga",b:"Compara la carga media de los <b>últimos 7 días</b> (aguda) con la de los <b>últimos 28</b> (crónica), por grupo muscular.<br><br>· ~0.8–1.3: zona segura<br>· &gt;1.5: pico de carga — riesgo de lesión, la app evita ese grupo<br>· &lt;0.8: desentrenamiento relativo — el generador lo prioriza.<br><br>Se calcula solo con lo que registras: cuantas más sesiones apuntes, más fiable."},
  pace:{t:"⏱ Sistema de pace",b:"<b>Pace = reps/min × 5.</b> Ejemplo: 25 burpees/min = pace 125. Cada punto = 0.2 reps/min, lo que permite progresar en pasos de 1/5 de segundo.<br><br>· <b>Primera vez</b> con un ejercicio: cronómetro puro — marca tu referencia.<br>· <b>Siguientes:</b> el metrónomo suena a tu pace anterior <b>+2 puntos</b>. Sincroniza cada rep con el beep.<br><br>En el pacer de ergómetros/carrera el número es directamente strokes o pasos por minuto."},
  mobtests:{t:"📏 Tests de movilidad",b:"6 tests tipo GOWOD, escala 1–5. Hazlos <b>en frío</b> (sin calentar) y repítelos cada 2–4 semanas, siempre en condiciones parecidas.<br><br>· <b>Flexión cadera:</b> pies juntos, rodillas estiradas, baja las manos.<br>· <b>Sentadilla profunda:</b> talones en el suelo, sin ayudarte.<br>· <b>Tobillo:</b> rodilla a la pared sin levantar el talón; mide la distancia dedo gordo–pared.<br>· <b>Rotación cadera:</b> tumbado, rodilla a 90°, deja caer el pie hacia fuera.<br>· <b>Hombro:</b> una mano por encima del hombro, otra por debajo, por la espalda.<br>· <b>Torácica:</b> sentadilla con brazos estirados arriba, ¿se quedan verticales?<br><br>Puntuar ≤2 en un test hace que la sesión de movilidad doble el tiempo en esa zona."},
  z2:{t:"💚 Trabajo en Z2 (Maffetone)",b:"Sesiones a intensidad baja y continua, <b>FC ≤130</b>, para construir base aeróbica y quemar grasa como combustible. Aquí no se busca PB: el objetivo es NO subir pulsaciones.<br><br>La app te pide la <b>FC media del reloj</b> al terminar: si te pasaste de 130, la sesión no cuenta como Z2 válida. Es deliberado — el error clásico es convertir el rodaje suave en tempo."},
  disciplina:{t:"🎯 Score de disciplina",b:"Se calcula por semana:<br><br>· <b>50%</b> adherencia al plan (sesiones hechas / planificadas — la movilidad pesa igual que un WOD y saltártela resta)<br>· <b>30%</b> hábitos marcados en el check-in<br>· <b>20%</b> check-ins hechos.<br><br>Los hábitos evaluados los puedes personalizar en Más → Hábitos."},
  descansos:{t:"⏱ Descansos: R90\" y compañía",b:"El descanso es una variable de prescripción tan importante como las series y las repeticiones. Las mismas 4×6 con 3 minutos de pausa son <b>fuerza</b>; con 45 segundos son <b>resistencia muscular</b>. No son la misma sesión.<br><br><b>Cómo leer la notación</b><br>· <b>R3\'</b> → 3 minutos<br>· <b>R2\'</b> → 2 minutos<br>· <b>R90\"</b> → 90 segundos<br>· <b>R60\"</b> → 60 segundos<br><br><b>El criterio que sigo</b><br>· <b>≤6 reps con porcentaje de tu máximo</b> → R3\'. Buscas fuerza y sistema nervioso: necesitas estar recuperado del todo o la siguiente serie ya no entrena lo mismo.<br>· <b>6-8 reps pesadas</b> → R2\'.<br>· <b>8-12 reps</b> → R90\". Zona de hipertrofia: descanso suficiente para mantener el volumen, corto para acumular estrés metabólico.<br>· <b>15-30 reps</b> → R60\". Resistencia muscular, que es lo que decide las estaciones de HYROX y DEKA.<br>· <b>Circuitos y rondas</b> → el descanso va escrito en la propia sesión, porque ahí es el corazón del estímulo.<br><br><b>Cuándo saltárselo</b><br>Si al terminar la serie no puedes hablar, descansa más de lo que pone. Si acabas la última serie igual de fresco que la primera, o descansas de menos o el peso es corto. La cifra es una guía, no una orden.<br><br><b>Ojo con el circuito</b><br>En un WOD metabólico el descanso corto <i>es</i> el entrenamiento. Ahí no lo alargues: si necesitas más, baja el peso."},
  recup:{t:"🌡️ VFC y fuerza de agarre",b:"Dos marcadores que se registran en el check-in matinal y se leen <b>contra tu propia línea base</b>, no contra valores de referencia.<br><br><b>VFC (variabilidad de la frecuencia cardiaca)</b><br>Refleja el equilibrio del sistema nervioso autónomo. Mídela siempre igual: al despertar, tumbado o sentado, antes del café y antes de mirar el móvil. El valor absoluto importa poco — lo que cuenta es dónde cae hoy respecto a tu media de 7 días. Una caída de más de una desviación suele indicar fatiga, sueño malo, alcohol o algo incubándose.<br><br><b>Fuerza de agarre (dinamómetro)</b><br>Proxy razonable de fatiga neuromuscular central: cuando el sistema nervioso está cansado, el agarre baja antes que otros marcadores. Tres intentos por mano, anota el mejor. Una caída sostenida &gt;10% respecto a tu media merece atención.<br><br><b>Asimetría entre manos</b><br>Diferencias del 5-10% son normales (mano dominante). Por encima del 15%, conviene mirarlo: en HYROX el agarre limita en farmers y remo.<br><br><b>Cautela honesta:</b> la VFC tiene respaldo sólido para guiar el entrenamiento; el agarre como marcador diario es más ruidoso. Ninguno de los dos manda por sí solo — si el dato dice rojo pero te encuentras perfecto, o al revés, hazle caso a la tendencia de varios días, no a un valor suelto."},
  xybrid:{t:"🏁 XYBRID · sáb 19 sep",b:"Formato tipo HYROX (8 km de carrera intercalados) con <b>estaciones propias</b>:<br><br>· <b>SkiErg</b> 1000m<br>· <b>Sled Push + Sled Pull</b> — <span style='color:#ffb347'>en la misma estación, sin carrera entre medias</span><br>· <b>Burpees to Plate</b> ×40 <span class='dim'>(sustituye a los Burpee Broad Jump)</span><br>· <b>Rowing</b> 1000m<br>· <b>Assault Bike</b> <span class='dim'>(sustituye al Farmers Carry)</span><br>· <b>Lunges to Box</b> ×40<br>· <b>Slam Ball 30kg</b> ×30 <span class='dim'>(en vez de Wall Balls)</span><br><br><b>Qué cambia para ti:</b><br>· Sled push+pull encadenado = pico de lactato mucho mayor que en HYROX. Sal conservador en el push.<br>· Burpees to plate son más rápidos que los BBJ pero castigan más el pecho.<br>· Slam ball de 30kg con 30 reps es la estación más pesada del circuito — bisagra de cadera, no espalda.<br>· El Air Bike sustituye al farmers: es cardio puro, no agarre. Bueno para ti."},
  formats:{t:"✏️ Formatos de WOD",b:"· <b>Series × Reps:</b> clásico con metrónomo, pace y descansos automáticos.<br>· <b>AMRAP:</b> máximas rondas en X minutos. Marca cada ronda completada.<br>· <b>FOR TIME:</b> trabajo fijo (rondas × ejercicios) en el menor tiempo posible, con time cap opcional.<br>· <b>EMOM:</b> cada minuto empieza un ejercicio; lo que sobra del minuto, descansas.<br>· <b>CIRCUITO:</b> rondas completas con descanso fijo entre rondas.<br>· <b>LADDER:</b> escalera de reps (21-15-9, o 1-2-3…10) con los mismos ejercicios."},
};

/* ═══════════════════ CORE: estado, fechas, carga, puntos ═══════════════════ */
var KEY = "deka-trainer-v4";  // miguel conserva la clave original; el resto añade sufijo
const defaultState = {
  planStart: "2026-07-20",           // lunes de la S1
  sessions: [],                       // {id,date,week,dayIdx,type,mode,exercises,durationMin,rpe,srpe,fcAvg,z2ok,feelings,notes,muscleLoad,points}
  savedPaces: {}, paceHistory: [],
  mobHistory: [],
  checkins: {},                       // "YYYY-MM-DD": {soreness:{}, sleep:1-5, habits:{}}
  points: 0, pointsLog: [],
  rewards: [], badges: [], perfectWeeks: 0,
  favorites: [], exCustom: [],
};
var st = loadState();
function loadState(){ try{ const r=localStorage.getItem(KEY); if(r) return Object.assign({},defaultState,JSON.parse(r)); }catch(e){} return JSON.parse(JSON.stringify(defaultState)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

/* ── fechas ── */
function todayISO(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function dateFromISO(s){ const a=s.split("-"); return new Date(+a[0],+a[1]-1,+a[2]); }
function daysBetween(a,b){ return Math.round((dateFromISO(b)-dateFromISO(a))/864e5); }
function planPos(dISO){ // {week (1-13 | 0 pre | -1 post), dayIdx 0-6}
  const diff = daysBetween(st.planStart, dISO||todayISO());
  if(diff<0) return {week:0, dayIdx:0, pre:-diff};
  const w = Math.floor(diff/7)+1;
  if(w>PLAN.length) return {week:-1, dayIdx:0};
  return {week:w, dayIdx:diff%7};
}
function planDay(week,dayIdx){ const wk=PLAN[week-1]; return wk ? wk.days[dayIdx] : null; }
function DAYNAMES_(){ return nombresDias(); }
var DAYNAMES=new Proxy({},{get:(t,k)=>nombresDias()[k]});

/* ── carga muscular ── */
function sessionMuscleLoad(exercises){ // exercises: [{name, totalReps, weightNum?}]
  const load={};
  exercises.forEach(e=>{
    const ex=allEx().find(x=>x.name===e.name); if(!ex) return;
    const vol=(e.totalReps||0)*(ex.unit==="m"?0.05:ex.unit==="cal"?0.8:ex.unit==="seg"?0.3:1);
    Object.entries(ex.m).forEach(([mus,c])=>{ load[mus]=(load[mus]||0)+c*vol*ex.wf; });
  });
  return load;
}
function dailyLoads(){ // {date: {muscle: load}}
  const by={};
  st.sessions.forEach(s=>{ if(!s.muscleLoad) return; const d=by[s.date]=by[s.date]||{};
    Object.entries(s.muscleLoad).forEach(([m,v])=>d[m]=(d[m]||0)+v); });
  return by;
}
function windowLoad(days){ // media diaria por músculo en últimos N días
  const by=dailyLoads(), out={}, today=todayISO();
  MUSCLES.forEach(mu=>out[mu.id]=0);
  Object.entries(by).forEach(([d,ml])=>{ const age=daysBetween(d,today);
    if(age>=0&&age<days) Object.entries(ml).forEach(([m,v])=>out[m]+=v); });
  MUSCLES.forEach(mu=>out[mu.id]/=days);
  return out;
}
function acwr(){ // ratio agudo(7d):crónico(28d) por músculo
  const a=windowLoad(7), c=windowLoad(28), out={};
  MUSCLES.forEach(mu=>{ out[mu.id] = c[mu.id]>0.01 ? a[mu.id]/c[mu.id] : (a[mu.id]>0?1:0); });
  return out;
}
function sorenessToday(){ const c=st.checkins[todayISO()]; return c?c.soreness||{}:{}; }
function muscleStatus(){ // por músculo: {load7, ratio, sore, flag: ok|alto|sobrecarga}
  const a=windowLoad(7), r=acwr(), sore=sorenessToday(), out={};
  const max7=Math.max(0.01,...Object.values(a));
  MUSCLES.forEach(mu=>{
    const rel=a[mu.id]/max7, ratio=r[mu.id], s=sore[mu.id]||0;
    let flag="ok";
    if(ratio>1.5&&rel>0.4) flag="sobrecarga"; else if(s>=2||rel>0.75) flag="alto";
    out[mu.id]={rel,ratio,sore:s,flag};
  });
  return out;
}

/* ── métricas matinales: VFC, FC reposo y dinamometría ── */
function metricSeries(k,days){ // [{date,v}] más antiguo → más reciente
  const out=[], today=new Date();
  for(let i=(days||90)-1;i>=0;i--){ const d=new Date(today); d.setDate(today.getDate()-i);
    const iso=todayISO(d), c=st.checkins[iso];
    let v=c&&c.metrics?c.metrics[k]:null;
    if(k==="grip"&&c&&c.metrics){ const a=c.metrics.gripL,b=c.metrics.gripR;
      v=(a!=null&&b!=null)?(a+b)/2:(a!=null?a:(b!=null?b:null)); }
    if(v!=null&&!isNaN(v)) out.push({date:iso,v:+v});
  }
  return out;
}
function baseline(k,excludeToday){ // media y desviación de los últimos 7 y 28 registros
  let s=metricSeries(k,60);
  if(excludeToday) s=s.filter(p=>p.date!==todayISO());
  if(s.length<3) return null;
  const last7=s.slice(-7).map(p=>p.v), last28=s.slice(-28).map(p=>p.v);
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const m7=mean(last7), m28=mean(last28);
  let sd=Math.sqrt(mean(last28.map(v=>(v-m28)*(v-m28))))||1;
  // suelo del 5% de la media: si tus datos son muy estables, evita que caídas triviales disparen alarmas
  sd=Math.max(sd, m28*0.05);
  return {m7,m28,sd,n:s.length};
}
function readiness(dISO){
  const iso=dISO||todayISO(), c=st.checkins[iso];
  const mt=(c&&c.metrics)||{};
  const gripToday=(mt.gripL!=null&&mt.gripR!=null)?(mt.gripL+mt.gripR)/2:(mt.gripL!=null?mt.gripL:mt.gripR);
  if(mt.hrv==null&&gripToday==null) return null;
  const bH=baseline("hrv",true), bG=baseline("grip",true);
  const parts=[]; let score=0, n=0;
  if(mt.hrv!=null&&bH){ const z=(mt.hrv-bH.m7)/bH.sd; score+=z; n++;
    parts.push("VFC "+mt.hrv+" ms ("+(z>=0?"+":"")+z.toFixed(1)+" DE sobre tu media de 7 días: "+bH.m7.toFixed(0)+")"); }
  else if(mt.hrv!=null) parts.push("VFC "+mt.hrv+" ms — aún sin línea base (necesito 3+ días)");
  if(gripToday!=null&&bG){ const pct=gripToday/bG.m7*100; score+=(pct-100)/7; n++;
    parts.push("Agarre "+gripToday.toFixed(1)+" kg ("+(pct>=100?"+":"")+(pct-100).toFixed(0)+"% vs tu media)"); }
  else if(gripToday!=null) parts.push("Agarre "+gripToday.toFixed(1)+" kg — construyendo línea base");
  // asimetría
  if(mt.gripL!=null&&mt.gripR!=null){
    const asym=Math.abs(mt.gripL-mt.gripR)/Math.max(mt.gripL,mt.gripR)*100;
    if(asym>15) parts.push("⚠ Asimetría "+asym.toFixed(0)+"% entre manos");
  }
  if(!n) return {c:"#8A8F98",icon:"📊",t:"Registrando",msg:parts.join(" · ")};
  const z=score/n;
  const r = z>=-0.3 ? {c:"#4B7F3B",icon:"🟢",t:"Recuperado",msg:"Puedes ir a por la sesión tal como está planificada."}
        : z>=-1.2 ? {c:"#ffb347",icon:"🟡",t:"Fatiga moderada",msg:"Haz la sesión, pero sin buscar récords. Si es un día de calidad, quédate en el extremo bajo del objetivo."}
        : {c:"#ff4f3a",icon:"🔴",t:"Fatiga alta",msg:"Tu cuerpo pide margen. Cambia la intensidad por Z2, o descansa. Forzar hoy te cuesta los tres días siguientes."};
  r.msg=parts.join(" · ")+". "+r.msg;
  return r;
}

/* ── sRPE y Z2 ── */
function computeSRPE(rpe,min){ return (rpe||0)*(min||0); }
function z2Check(fcAvg){ return fcAvg!=null && fcAvg>0 && fcAvg<=ZONES.Z2[1]; }

/* ── disciplina (semana actual) ── */
function weekDates(week){ const start=dateFromISO(st.planStart); start.setDate(start.getDate()+(week-1)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return todayISO(d);}); }
function disciplineWeek(week){
  const wk=PLAN[week-1]; if(!wk) return null;
  const dates=weekDates(week), today=todayISO();
  let plannedDue=0, done=0, mobDue=0, mobDone=0, habitPts=0, habitMax=0, checks=0, checksDue=0;
  dates.forEach((d,i)=>{
    const day=wk.days[i], past=daysBetween(d,today)>=0;
    if(!past) return;
    checksDue++; if(st.checkins[d]&&st.checkins[d]._saved) checks++;
    const c=st.checkins[d];
    if(c){ habits().forEach(hb=>{ const w=hb.w||1; habitMax+=w; if((c.habits||{})[hb.id]) habitPts+=w; }); }
    if(day.t!=="Descanso"&&day.t!=="COMPETICIÓN"){ plannedDue++;
      const s=st.sessions.find(x=>x.date===d&&x.mode!=="checkin");
      if(s) done++;
      if(day.t==="Movilidad"){ mobDue++; if(s&&s.type==="Movilidad") mobDone++; }
    }
  });
  const adh = plannedDue? done/plannedDue : 1;
  const hab = habitMax? habitPts/habitMax : 0;
  const chk = checksDue? checks/checksDue : 0;
  const score = Math.round((adh*0.5 + hab*0.3 + chk*0.2)*100);
  return {score, adh, hab, chk, done, plannedDue, mobDue, mobDone};
}

const CATS=[

  {id:"ergómetros",label:"ERGO",full:"Ergómetros",icon:"🚣",color:"#A8E63E",metric:"Remo · SkiErg · Bike"},

/* categorías a las que contribuye una sesión: por sus ejercicios, y si no, por su tipo */
const EXCAT2CAT={"metabólico":"metabólico","hyrox":"metabólico","fuerza":"fuerza","core":"fuerza","ergómetros":"ergómetros","running":"running"};
function sessionCats(s){
  const set=new Set();
  (s.exercises||[]).forEach(e=>{ const ex=allEx().find(x=>x.name===e.name);
    if(ex&&EXCAT2CAT[ex.cat]) set.add(EXCAT2CAT[ex.cat]);
    else if(/CARRERA/i.test(e.name)) set.add("running");
    else if(/REMO|SKIERG|BIKE/i.test(e.name)) set.add("ergómetros"); });
  if(!set.size){
    const t=s.type||"";
    if(/Carrera|Comp\. Running|Tempo/i.test(t)) set.add("running");
    else if(/Erg[oó]metro|Bici|Test/i.test(t)) set.add("ergómetros");
    else if(/Fuerza|Activaci[oó]n/i.test(t)) set.add("fuerza");
    else if(/Metab|Cluster|Playa|COMPETI/i.test(t)) set.add("metabólico");
    else if(/Umbral/i.test(t)){ set.add("running"); set.add("ergómetros"); }
  }
  return [...set];
}
function catScore(catId){
  if(catId==="movilidad"){ if(!st.mobHistory.length) return null;
    const last=st.mobHistory[st.mobHistory.length-1]; const v=Object.values(last.scores);
    return v.length?(v.reduce((a,b)=>a+b,0)/v.length)*20:null; }
  if(catId==="disciplina"){ const pos=planPos(); if(pos.week<1) return null;
    const d=disciplineWeek(pos.week); return d?d.score:null; }
  // volumen: nº de sesiones que tocan la categoría (amortiguado) + minutos
  const ses=st.sessions.filter(s=>sessionCats(s).includes(catId));
  const paces=st.paceHistory.filter(h=>{const e=allEx().find(x=>x.name===h.exercise);
    return e&&EXCAT2CAT[e.cat]===catId;}).map(h=>h.pace);
  if(!ses.length&&!paces.length) return null;
  const mins=ses.reduce((a,s)=>a+(s.durationMin||0),0);
  const vol=Math.min(48, 8*Math.sqrt(ses.length) + Math.min(12,mins/60));
  const paceBonus=paces.length?Math.min(26, paces.reduce((a,b)=>a+b,0)/paces.length*0.12):0;
  return Math.min(99, 25 + vol + paceBonus);
}
function dekaScore(){ const s=CATS.map(c=>catScore(c.id)).filter(x=>x!==null); return s.length?s.reduce((a,b)=>a+b,0)/s.length:0; }

/* ── audio: onda cuadrada + armónico + compresor = mucho más audible sobre música ── */
let audioCtx=null, masterGain=null, comp=null;
function vol(){ return (st.audioVol==null?4:st.audioVol)/4; } // 1–8 → 0.25–2
function audioInit(){
  if(audioCtx) return audioCtx;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    comp=audioCtx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=6; comp.ratio.value=12; comp.attack.value=0.002; comp.release.value=0.1;
    masterGain=audioCtx.createGain(); masterGain.gain.value=1;
    comp.connect(masterGain); masterGain.connect(audioCtx.destination);
  }catch(e){}
  return audioCtx;
}
function beep(freq,dur){ freq=freq||880; dur=Math.max(dur||0.06,0.08);
  try{
    audioInit(); if(!audioCtx) return;
    if(audioCtx.state==="suspended") audioCtx.resume();
    const t=audioCtx.currentTime, g=audioCtx.createGain(), amp=Math.min(1.6,0.85*vol());
    g.connect(comp);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(amp,t+0.008);
    g.gain.setValueAtTime(amp,t+dur*0.6);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    // fundamental cuadrada (rica en armónicos → se cuela entre la música)
    const o1=audioCtx.createOscillator(); o1.type="square"; o1.frequency.value=freq; o1.connect(g);
    // octava superior a menor volumen, para el brillo
    const g2=audioCtx.createGain(); g2.gain.value=0.45; g2.connect(g);
    const o2=audioCtx.createOscillator(); o2.type="square"; o2.frequency.value=freq*2; o2.connect(g2);
    o1.start(t); o2.start(t); o1.stop(t+dur); o2.stop(t+dur);
  }catch(e){} }
function testAudio(){ audioInit(); beep(880,0.12); setTimeout(()=>beep(1200,0.18),220); setTimeout(()=>say("Quince segundos. Aprieta."),650); }

  if(flag==="sobrecarga") return "#ff4f3a";
  if(rel<=0.02) return "#242A32";
  const hue=Math.max(0,120-rel*120);
  return "hsl("+hue+",70%,"+(30+rel*15)+"%)";
}

/* ── check-in (editable cualquier día de la semana en curso) ── */
function ckWeekDates(){ // lun–dom de la semana natural actual
  const now=new Date(); const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return todayISO(d); });
}
function openCheckin(dateISO){
  const t=dateISO||st._ckDate||todayISO(); st._ckDate=t;
  const c=st.checkins[t]||{soreness:{},sleep:null,habits:{}};
  const today=todayISO(), dias=PROFILE.lang==="en"?["M","T","W","T","F","S","S"]:["L","M","X","J","V","S","D"];
  let html='<div class="ctitle">☀️ Check-in — '+(t===today?"hoy":DAYNAMES[(dateFromISO(t).getDay()+6)%7])+' '+t.slice(8,10)+'/'+t.slice(5,7)+'</div>';
  // tira de días de la semana
  html+='<div style="display:flex;gap:5px;margin-bottom:14px">';
  ckWeekDates().forEach((d,i)=>{
    const fut=daysBetween(today,d)>0, done=!!(st.checkins[d]&&st.checkins[d]._saved), cur=d===t;
    html+='<button class="btn3" style="flex:1;padding:6px 2px;text-align:center;'+(cur?'border-color:#A8E63E;color:#A8E63E;':'')+(done?'background:rgba(58,255,184,.12);':'')+(fut?'opacity:.25;':'')+'" '+(fut?'disabled':'onclick="openCheckin(\''+d+'\')"')+'>'+dias[i]+'<br><span style="font-size:10px">'+d.slice(8,10)+'</span>'+(done?'<br><span style="color:#4B7F3B">✓</span>':'')+'</button>';
  });

  html+='<div style="font-size:12px;font-weight:600;margin-bottom:2px">🌡️ Métricas de la mañana</div>';
  html+='<div class="dim" style="font-size:10px;margin-bottom:8px">Nada más despertar, antes de café. Mismas condiciones cada día.</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">'+
    [["hrv","VFC (ms)","rMSSD del reloj"],["rhr","FC reposo"," ppm"],["gripL","Agarre izq (kg)","dinamómetro"],["gripR","Agarre der (kg)","dinamómetro"]]
    .map(([k,lb])=>'<div><div class="dim" style="font-size:10px;margin-bottom:3px">'+lb+'</div><input type="number" inputmode="decimal" id="mt_'+k+'" value="'+(mt[k]!=null?mt[k]:"")+'" onchange="ckMetric(\''+k+'\',this.value)" placeholder="—"></div>').join("")+'</div>';
  const rd=readiness(t);

  html+='<div style="font-size:12px;font-weight:600;margin-bottom:6px">💢 Agujetas (0 nada · 3 fuertes)</div>';
  MUSCLES.forEach(mu=>{
    html+='<div class="row" style="padding:4px 0"><span style="font-size:12px">'+mu.name+'</span><span class="chips">';
    for(let i=0;i<=3;i++) html+='<button class="btn3'+((c.soreness[mu.id]||0)===i?' sel':'')+'" style="min-width:30px" onclick="ckSore(\''+mu.id+'\','+i+')">'+i+'</button>';
    html+='</span></div>';
  });
  html+='<div style="font-size:12px;font-weight:600;margin:12px 0 6px">😴 Horas de sueño</div><div class="chips">';

  html+='</div><div style="font-size:12px;font-weight:600;margin:12px 0 6px">✅ Hábitos del día</div>';
  habits().forEach(hb=>{
    html+='<button class="btn3'+(c.habits[hb.id]?' sel':'')+'" style="width:100%;text-align:left;margin-bottom:5px" onclick="ckHabit(\''+hb.id+'\')"><span class="row"><span>'+(hb.icon||"✅")+' '+esc(hb.name)+'</span><span style="color:#4B7F3B;font-family:monospace">+'+(hb.w||1)+'</span></span>'+(hb.desc?'<span class="dim" style="font-size:10px;display:block;margin-top:2px">'+esc(hb.desc)+'</span>':'')+'</button>';
  });
  html+='<button class="btn" style="margin-top:12px" onclick="saveCheckin()">GUARDAR CHECK-IN</button>';
  st._ckDraft=c;

}
function ckMetric(k,v){ const d=st._ckDraft; d.metrics=d.metrics||{};
  const n=parseFloat(String(v).replace(",",".")); d.metrics[k]=isNaN(n)?null:n;
  st.checkins[st._ckDate]=d; save(); }
function ckSore(m,v){ ckKeepMetrics(); st._ckDraft.soreness[m]=v; ckPersist(); }
function ckKeepMetrics(){ const d=st._ckDraft; d.metrics=d.metrics||{};
  ["hrv","rhr","gripL","gripR"].forEach(k=>{ const el=$("mt_"+k); if(el){ const n=parseFloat(String(el.value).replace(",",".")); d.metrics[k]=isNaN(n)?null:n; } }); }
function ckSleep(v){ ckKeepMetrics(); st._ckDraft.sleep=v; ckPersist(); }
function ckHabit(id){ ckKeepMetrics(); st._ckDraft.habits[id]=!st._ckDraft.habits[id]; ckPersist(); }
function ckPersist(){ const d=st._ckDraft; st.checkins[st._ckDate]=d; openCheckin(st._ckDate); st._ckDraft=d; }
function saveCheckin(){
  ckKeepMetrics();
  const t=st._ckDate||todayISO(), first=!st.checkins[t]||!st.checkins[t]._saved;
  const d=st._ckDraft; d._saved=true; st.checkins[t]=d;
  if(first&&t===todayISO()){ const hw=habits().reduce((a,hb)=>a+((d.habits||{})[hb.id]?(hb.w||1):0),0);
    addPoints(PTS.checkin+hw,"Check-in + hábitos (+"+hw+")"); }
  save(); closeOverlay(); toast("Check-in guardado ✓"); render();
}

/* ═══════════════════ PANTALLA: PROGRESO ═══════════════════ */
function renderProgreso(){
  const el=h('<div class="screen active"></div>');
  el.appendChild(h('<div class="hdr"><div class="logo">DEKA TRAINER</div><div class="slbl">Progreso</div></div>'));
  const score=dekaScore();
  // snapshot semanal para deltas
  const mon=ckWeekDates()[0];
  st.scoreSnaps=st.scoreSnaps||{};
  if(score>0){ st.scoreSnaps[mon]=score; save(); }
  const prevMon=(()=>{const d=dateFromISO(mon);d.setDate(d.getDate()-7);return todayISO(d);})();
  const prev=st.scoreSnaps[prevMon];
  const delta=prev!=null?score-prev:null;
  const dTxt=delta==null?'':' · <span style="color:'+(delta>=0?'#4B7F3B':'#ff4f3a')+'">'+(delta>=0?'▲':'▼')+Math.abs(delta).toFixed(1)+' vs sem. anterior</span>';
  el.appendChild(h('<div class="card" style="text-align:center;padding:22px;background:radial-gradient(ellipse at center,rgba(232,255,58,.06),transparent 70%)"><div class="big" style="font-size:72px">'+(st.sessions.length?score.toFixed(1):"—")+'</div><div class="mono dim" style="font-size:10px;letter-spacing:4px;margin-top:4px">DEKA SCORE</div><div class="mono" style="font-size:11px;margin-top:6px;color:#8A8F98">'+st.sessions.length+' sesiones'+dTxt+'</div></div>'));
  // disciplina: esta semana vs anterior
  const pos2=planPos();
  if(pos2.week>1){ const dNow=disciplineWeek(pos2.week), dPrev=disciplineWeek(pos2.week-1);
    if(dNow&&dPrev){ const dd=dNow.score-dPrev.score;
      el.appendChild(h('<div class="card"><div class="row"><span class="mono dim" style="font-size:10px;letter-spacing:2px">DISCIPLINA S'+pos2.week+' vs S'+(pos2.week-1)+'</span><span class="mono" style="font-size:13px">'+dNow.score+' <span style="color:'+(dd>=0?'#4B7F3B':'#ff4f3a')+'">'+(dd>=0?'▲':'▼')+Math.abs(dd)+'</span></span></div></div>')); } }
  // Radar
  const rc=h('<div class="card"><div class="ctitle">Perfil de rendimiento</div><div style="display:flex;justify-content:center"><canvas id="radar"></canvas></div></div>');
  el.appendChild(rc);
  setTimeout(drawRadar,30);
  // Atributos con % (estilo HYBRD, pero contra tu propio histórico)
  const at=h('<div class="card"><div class="ctitle">Atributos <span style="font-weight:400;color:#8A8F98;font-size:11px">· % sobre tu mejor marca</span></div></div>');
  CATS.forEach(ct=>{
    const sc=catScore(ct.id);
    const best=(st.catBest&&st.catBest[ct.id])||0;
    if(sc!=null&&sc>best){ st.catBest=st.catBest||{}; st.catBest[ct.id]=sc; }
    const ref=Math.max(sc||0,best,1);
    const pct=sc!=null?Math.round(sc/ref*100):0;
    at.appendChild(h('<div class="metricrow"><div class="top"><span class="nm">'+ct.icon+' '+ct.full+'</span><span class="pct" style="color:'+(sc!=null?ct.color:"#4a4a60")+'">'+(sc!=null?pct+"%":"—")+'</span></div><div class="bar"><div style="width:'+pct+'%;background:'+ct.color+'"></div></div><div class="sub"><span>'+ct.metric+'</span><span style="color:#eceef2;font-weight:600">'+(sc!=null?sc.toFixed(0)+" pts":"sin datos")+'</span></div></div>'));
  });
  save();
  el.appendChild(at);
  // Recuperación: VFC y agarre
  const rec=recoveryCard(); if(rec) el.appendChild(rec);
  // Training State (ACWR global con banda óptima)
  el.appendChild(trainingStateCard());
  // Load Mix
  el.appendChild(loadMixCard());
  // Recent efforts
  el.appendChild(effortsCard());
  // sRPE semanal
  const sr=h('<div class="card"><div class="ctitle">Carga interna (sRPE) — últimas 4 semanas</div><div style="display:flex;align-items:flex-end;gap:8px;height:80px" id="srpebars"></div></div>');
  const weeks=[3,2,1,0].map(off=>{
    const end=new Date(); end.setDate(end.getDate()-off*7);
    let sum=0; st.sessions.forEach(s=>{ const age=daysBetween(s.date,todayISO(end)); if(age>=0&&age<7) sum+=s.srpe||0; });
    return sum;
  });
  const maxS=Math.max(100,...weeks);
  const bars=sr.querySelector("#srpebars");
  weeks.forEach((v,i)=>{ bars.appendChild(h('<div style="flex:1;text-align:center"><div style="background:'+(i===3?"#A8E63E":"#3a3a55")+';border-radius:4px 4px 0 0;height:'+Math.max(3,v/maxS*64)+'px"></div><div class="mono dim" style="font-size:8px;margin-top:3px">'+(i===3?"ESTA":("-"+(3-i)+"sem"))+'</div><div class="mono" style="font-size:9px;color:#8A8F98">'+Math.round(v)+'</div></div>')); });
  el.appendChild(sr);
  // Historial de paces
  const ph=h('<div class="card"><div class="ctitle">Historial de paces</div></div>');
  if(!st.paceHistory.length) ph.appendChild(h('<div class="dim mono" style="font-size:11px;text-align:center;padding:12px">Sin datos aún.</div>'));

function drawMetric(id,ser,color,showBand){
  const cv=$(id); if(!cv||ser.length<2) return;
  const dpr=window.devicePixelRatio||2, W=Math.min(420,cv.parentNode.clientWidth||300), H=120;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%"; cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const x0=32,x1=W-6,y0=8,y1=H-16;
  const vs=ser.map(p=>p.v); let mn=Math.min(...vs),mx=Math.max(...vs);
  const pad=(mx-mn)*0.15||1; mn-=pad; mx+=pad;
  const Y=v=>y1-((v-mn)/(mx-mn))*(y1-y0);
  // banda de línea base (media 28 ± 1 DE)
  if(showBand&&ser.length>=4){
    const last28=vs.slice(-28), m=last28.reduce((a,b)=>a+b,0)/last28.length;
    const sd=Math.sqrt(last28.map(v=>(v-m)*(v-m)).reduce((a,b)=>a+b,0)/last28.length)||1;
    ctx.fillStyle=color+"18"; ctx.fillRect(x0,Y(m+sd),x1-x0,Math.max(1,Y(m-sd)-Y(m+sd)));
    ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(x0,Y(m)); ctx.lineTo(x1,Y(m));
    ctx.strokeStyle=color+"88"; ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
  }
  [mx-pad,mn+pad].forEach(v=>{ ctx.fillStyle="#8A8F98"; ctx.font="9px monospace"; ctx.textAlign="right";
    ctx.fillText(Math.round(v),x0-4,Y(v)+3); });
  const step=(x1-x0)/(ser.length-1);
  ctx.beginPath(); ser.forEach((p,i)=>{const x=x0+i*step,y=Y(p.v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  ser.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(x0+i*step,Y(p.v),i===ser.length-1?4:2.5,0,Math.PI*2);
    ctx.fillStyle=i===ser.length-1?"#fff":color; ctx.fill(); });
  ctx.fillStyle="#8A8F98"; ctx.font="9px monospace"; ctx.textAlign="left";
  ctx.fillText(ser[0].date.slice(8,10)+"/"+ser[0].date.slice(5,7),x0,H-3);
  ctx.textAlign="right"; ctx.fillText("hoy",x1,H-3);
}
function drawGrip(){
  const cv=$("gripc"); if(!cv) return;
  const L=metricSeries("gripL",90), R=metricSeries("gripR",90);
  if(L.length<2&&R.length<2) return drawMetric("gripc",metricSeries("grip",90),"#A8E63E",true);
  const dpr=window.devicePixelRatio||2, W=Math.min(420,cv.parentNode.clientWidth||300), H=120;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%"; cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const x0=32,x1=W-6,y0=8,y1=H-16;
  const all=L.concat(R).map(p=>p.v); let mn=Math.min(...all),mx=Math.max(...all);
  const pad=(mx-mn)*0.15||1; mn-=pad; mx+=pad;
  const Y=v=>y1-((v-mn)/(mx-mn))*(y1-y0);
  [mx-pad,mn+pad].forEach(v=>{ ctx.fillStyle="#8A8F98"; ctx.font="9px monospace"; ctx.textAlign="right"; ctx.fillText(Math.round(v),x0-4,Y(v)+3); });
  [[L,"#A8E63E","izq"],[R,"#a78bfa","der"]].forEach(([ser,col])=>{
    if(ser.length<2) return;
    const step=(x1-x0)/(ser.length-1);
    ctx.beginPath(); ser.forEach((p,i)=>{const x=x0+i*step,y=Y(p.v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
    ctx.beginPath(); ctx.arc(x1,Y(ser[ser.length-1].v),3.5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
  });
  ctx.font="9px monospace"; ctx.textAlign="left";
  ctx.fillStyle="#A8E63E"; ctx.fillText("● izquierda",x0,H-3);
  ctx.fillStyle="#a78bfa"; ctx.fillText("● derecha",x0+62,H-3);
}

/* ── Training State: ACWR global con banda óptima 0.8–1.3 ── */
function acwrOn(dISO){
  const by=dailyLoads();
  let a=0,c=0;
  Object.entries(by).forEach(([d,ml])=>{ const age=daysBetween(d,dISO);
    const tot=Object.values(ml).reduce((x,y)=>x+y,0);
    if(age>=0&&age<7) a+=tot;
    if(age>=0&&age<28) c+=tot; });
  a/=7; c/=28;
  return c>0.01?a/c:(a>0?1:null);
}
function acwrSeries(days){
  const out=[]; const now=new Date();
  for(let i=days-1;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i);
    out.push({date:todayISO(d), v:acwrOn(todayISO(d))}); }
  return out;
}
function trainingStateCard(){
  const card=h('<div class="card"><div class="row"><div class="ctitle" style="margin-bottom:12px">Training State</div>'+helpBtn("acwr")+'</div><div style="font-size:11px;color:#8A8F98;line-height:1.5;margin:-6px 0 12px">Compara tu carga de los últimos 7 días con la habitual de 28. Manténla en verde para entrenar óptimo y reducir riesgo de lesión.</div></div>');
  const cur=acwrOn(todayISO());
  const state=cur==null?{t:"Sin datos",c:"#8A8F98"}:cur<0.8?{t:"Baja carga",c:"#3ab4ff"}:cur<=1.3?{t:"Óptimo",c:"#4B7F3B"}:cur<=1.5?{t:"Elevado",c:"#ffb347"}:{t:"Riesgo",c:"#ff4f3a"};
  card.appendChild(h('<div class="row" style="margin-bottom:10px"><span class="big" style="font-size:38px;color:'+state.c+'">'+(cur!=null?cur.toFixed(2):"—")+'</span><span class="tagz" style="background:'+state.c+'22;color:'+state.c+';font-size:12px;padding:5px 12px">'+state.t+'</span></div>'));
  card.appendChild(h('<canvas id="acwrc"></canvas>'));
  setTimeout(drawACWR,30);
  return card;
}
function drawACWR(){
  const cv=$("acwrc"); if(!cv) return;
  const dpr=window.devicePixelRatio||2, W=Math.min(420,cv.parentNode.clientWidth||300), H=140;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%"; cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const x0=28, x1=W-6, y0=8, y1=H-18, maxY=2;
  const Y=v=>y1-(Math.min(maxY,Math.max(0,v))/maxY)*(y1-y0);
  // banda óptima
  ctx.fillStyle="rgba(58,255,184,0.10)"; ctx.fillRect(x0,Y(1.3),x1-x0,Y(0.8)-Y(1.3));
  [[0.8,"#4B7F3B"],[1.3,"#4B7F3B"],[1.5,"#ffb347"]].forEach(([v,c])=>{
    ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(x0,Y(v)); ctx.lineTo(x1,Y(v));
    ctx.strokeStyle=c+"66"; ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#8A8F98"; ctx.font="9px monospace"; ctx.textAlign="right"; ctx.fillText(v.toFixed(2),x0-4,Y(v)+3);
  });
  const ser=acwrSeries(60).filter(p=>p.v!=null);
  if(!ser.length){ ctx.fillStyle="#5a5a74"; ctx.font="11px -apple-system,sans-serif"; ctx.textAlign="center";
    ctx.fillText("Registra sesiones para ver tu evolución",W/2,H/2); return; }
  const step=(x1-x0)/Math.max(1,ser.length-1);
  ctx.beginPath();
  ser.forEach((p,i)=>{ const x=x0+i*step,y=Y(p.v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle="#eceef2"; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  const last=ser[ser.length-1];
  ctx.beginPath(); ctx.arc(x0+(ser.length-1)*step,Y(last.v),4,0,Math.PI*2);
  ctx.fillStyle=last.v>=0.8&&last.v<=1.3?"#4B7F3B":last.v>1.5?"#ff4f3a":"#ffb347"; ctx.fill();
  ctx.fillStyle="#8A8F98"; ctx.font="9px monospace"; ctx.textAlign="left";
  ctx.fillText(ser[0].date.slice(8,10)+"/"+ser[0].date.slice(5,7),x0,H-5);
  ctx.textAlign="right"; ctx.fillText("hoy",x1,H-5);
}
/* ── Load Mix: cardio vs fuerza ── */
const CARDIOCATS=["metabólico","ergómetros","running"];
function loadMixCard(){
  let cardio=0,strength=0;
  st.sessions.forEach(s=>{ const age=daysBetween(s.date,todayISO()); if(age<0||age>=28) return;
    const w=s.srpe||s.durationMin||10;
    let c=0,f=0;
    (s.exercises||[]).forEach(e=>{ const ex=allEx().find(x=>x.name===e.name);
      if(!ex){c+=0.5;f+=0.5;return;} (CARDIOCATS.includes(ex.cat)?(c++):(f++)); });
    if(c+f===0){ const t=s.type||""; (/Carrera|Erg|Bici|Umbral|Metab|Comp/.test(t)?c=1:f=1); }
    cardio+=w*c/(c+f); strength+=w*f/(c+f);
  });
  const tot=cardio+strength;
  const pc=tot?Math.round(cardio/tot*100):50, pf=100-pc;
  const card=h('<div class="card"><div class="ctitle">Load Mix <span style="font-weight:400;color:#8A8F98;font-size:11px">· últimos 28 días</span></div></div>');
  card.appendChild(h('<div class="row" style="font-size:13px;font-weight:700;margin-bottom:6px"><span style="color:#22d3ee">'+pc+'%</span><span style="color:#a78bfa">'+pf+'%</span></div>'));
  card.appendChild(h('<div style="display:flex;height:9px;border-radius:5px;overflow:hidden;background:#2a2a3d"><div style="width:'+pc+'%;background:#22d3ee"></div><div style="width:'+pf+'%;background:#a78bfa"></div></div>'));
  card.appendChild(h('<div class="row" style="font-size:11px;color:#8A8F98;margin-top:7px"><span>■ Cardio</span><span>Fuerza ■</span></div>'));
  const msg=!tot?"Sin datos aún.":pc>=70?"Muy volcado en cardio. Bien para preparar HYROX, pero no descuides la fuerza — es lo que sostiene las estaciones.":pf>=70?"Muy volcado en fuerza. Te falta volumen aeróbico para la carrera entre estaciones.":"Mezcla equilibrada para un híbrido. Así se va a Valencia.";
  card.appendChild(h('<div style="font-size:11px;color:#8a8aa4;line-height:1.5;margin-top:8px">'+msg+'</div>'));

function drawEfforts(pts){
  const cv=$("effc"); if(!cv||!pts.length) return;
  const dpr=window.devicePixelRatio||2, W=Math.min(420,cv.parentNode.clientWidth||300), H=130;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%"; cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const x0=34,x1=W-8,y0=10,y1=H-20;
  const vs=pts.map(p=>p.pace), mn=Math.min(...vs), mx=Math.max(...vs), rg=Math.max(1,mx-mn);
  const Y=v=>y1-((v-mn)/rg)*(y1-y0);
  [mx,Math.round((mx+mn)/2),mn].forEach(v=>{
    ctx.beginPath(); ctx.moveTo(x0,Y(v)); ctx.lineTo(x1,Y(v));
    ctx.strokeStyle="rgba(255,255,255,0.06)"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle="#8A8F98"; ctx.font="9px monospace"; ctx.textAlign="right"; ctx.fillText(v,x0-5,Y(v)+3); });
  const step=pts.length>1?(x1-x0)/(pts.length-1):0;
  ctx.beginPath();
  pts.forEach((p,i)=>{ const x=x0+i*step,y=Y(p.pace); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle="#c6e83a"; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.stroke();
  pts.forEach((p,i)=>{ const x=x0+i*step,y=Y(p.pace), isBest=p.pace===mx;
    ctx.beginPath(); ctx.arc(x,y,isBest?5:3.5,0,Math.PI*2);
    ctx.fillStyle=isBest?"#ffb347":"#cfd3dd"; ctx.fill(); });
  ctx.fillStyle="#8A8F98"; ctx.font="9px monospace"; ctx.textAlign="left"; ctx.fillText(pts[0].date,x0,H-5);
  if(pts.length>1){ ctx.textAlign="right"; ctx.fillText(pts[pts.length-1].date,x1,H-5); }
}

function drawRadar(){
  const canvas=$("radar"); if(!canvas) return;
  const dpr=window.devicePixelRatio||2, W=320,H=300;
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+"px"; canvas.style.height=H+"px";
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const cx=W/2, cy=H/2+4, r=88;
  ctx.clearRect(0,0,W,H);
  const angles=CATS.map((c,i)=>-Math.PI/2+Math.PI*2*i/CATS.length);
  // anillos punteados
  ctx.setLineDash([3,4]);
  for(let ring=1;ring<=4;ring++){ ctx.beginPath(); ctx.arc(cx,cy,r*ring/4,0,Math.PI*2);
    ctx.strokeStyle="rgba(255,255,255,"+(ring===4?0.16:0.07)+")"; ctx.lineWidth=1; ctx.stroke(); }
  ctx.setLineDash([]);
  // ejes
  angles.forEach(a=>{ ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    ctx.strokeStyle="rgba(255,255,255,0.07)"; ctx.lineWidth=1; ctx.stroke(); });
  // polígono
  const vals=CATS.map(c=>{const s=catScore(c.id);return s!=null?Math.max(0.04,Math.min(1,s/100)):0.04;});
  ctx.beginPath();
  angles.forEach((a,i)=>{const rr=r*vals[i],x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.closePath();
  ctx.fillStyle="rgba(198,232,58,0.42)"; ctx.fill();
  ctx.strokeStyle="#d4ee3a"; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.stroke();
  // vértices
  angles.forEach((a,i)=>{ const rr=r*vals[i];
    ctx.beginPath(); ctx.arc(cx+rr*Math.cos(a),cy+rr*Math.sin(a),4.5,0,Math.PI*2);
    ctx.fillStyle="#A8E63E"; ctx.fill();
    ctx.strokeStyle="#0D0F12"; ctx.lineWidth=2; ctx.stroke(); });
  // etiquetas: nombre + valor
  angles.forEach((a,i)=>{
    const lx=cx+(r+30)*Math.cos(a), ly=cy+(r+30)*Math.sin(a);
    const s=catScore(CATS[i].id);
    ctx.textAlign=Math.abs(Math.cos(a))<0.25?"center":(Math.cos(a)>0?"left":"right");
    ctx.fillStyle="#9a9ab4"; ctx.font="600 11px -apple-system,system-ui,sans-serif";
    ctx.fillText(CATS[i].full||CATS[i].label,lx,ly-4);
    ctx.fillStyle=s!=null?CATS[i].color:"#4a4a60"; ctx.font="700 13px -apple-system,system-ui,sans-serif";
    ctx.fillText(s!=null?s.toFixed(0):"—",lx,ly+11);
  });
  // arcos MUSCULAR / CARDIO
  ctx.fillStyle="rgba(255,255,255,0.22)"; ctx.font="600 8px monospace"; ctx.textAlign="center";
  ctx.save(); ctx.translate(cx-r-12,cy); ctx.rotate(-Math.PI/2); ctx.fillText("M U S C U L A R",0,0); ctx.restore();
  ctx.save(); ctx.translate(cx+r+12,cy); ctx.rotate(Math.PI/2); ctx.fillText("C A R D I O",0,0); ctx.restore();
}

   Extrae los ejercicios escritos en el texto del día para poder lanzarlos
   con metrónomo, en vez de tener que reconstruirlos a mano. */
const ALIAS={
  "WALL BALL":"WALL BALLS","WALLBALL":"WALL BALLS","WALLBALLS":"WALL BALLS",
  "SENTADILLA TRASERA":"SENTADILLA","BACK SQUAT":"SENTADILLA","SENTADILLA FRONTAL":"FRONT SQUAT",
  "PESO MUERTO RUMANO":"PESO MUERTO RUMANO","RDL":"PESO MUERTO RUMANO",
  "PRESS DE BANCA":"PRESS BANCA","BENCH PRESS":"PRESS BANCA",
  "DOMINADAS":"PULL-UPS","DOMINADAS LASTRADAS":"PULL-UPS","PULL-UP":"PULL-UPS","PULL UPS":"PULL-UPS",
  "BURPEE BROAD JUMP":"BURPEE BROAD JUMP","BBJ":"BURPEE BROAD JUMP",
  "SANDBAG LUNGES":"SANDBAG LUNGES","LUNGES":"REAR LUNGES","ZANCADAS":"REAR LUNGES",
  "KB SWINGS":"KB SWING","SWINGS":"KB SWING",
  "SIT-UP THROW":"SIT-UP THROW","SIT UP THROW":"SIT-UP THROW",
  "FLEXIONES":"PUSH-UPS","PUSH-UP":"PUSH-UPS","PUSH UPS":"PUSH-UPS",
  "FONDOS":"FONDOS EN CAJÓN","ANILLAS DIPS":"RING DIPS","RING DIP":"RING DIPS",
  "ANILLAS ROWS":"RING ROW","REMO INVERTIDO":"RING ROW","ANILLAS PULL-UP":"PULL-UPS",
  "PUSH-UP ANILLAS":"RING PUSH-UP","PLANCHA":"PLANCHA","HOLLOW HOLD":"HOLLOW HOLD",
  "GOBLET SQUAT":"GOBLET SQUAT","KB GOBLET SQUAT":"GOBLET SQUAT",
  "PRESS MILITAR":"PRESS MILITAR","ELEVACIONES LATERALES":"ELEVACIONES LATERALES",
  "HIP THRUST":"HIP THRUST","FACE PULL":"FACE PULL","CURL MARTILLO":"CURL MANCUERNAS",
  "DEAD BUG":"DEAD BUG","DEADBUG":"DEAD BUG","SLAM BALL":"SLAM BALL",
};
function leerSesionDelPlan(texto){
  if(!texto) return [];
  // el descanso de la sesion, si viene anotado
  const rr=texto.match(/R(\d+)(['"])/);
  const restSesion = rr ? (rr[2]==="'" ? +rr[1]*60 : +rr[1]) : null;
  // trocear: cada fragmento suele contener un solo ejercicio
  const trozos=texto.replace(/\s+/g," ").split(/\s*[+·]\s*|\.\s+(?=[A-ZÁÉÍÓÚ])/);
  const nombres=allEx().filter(e=>!e.erg).map(e=>e.name)
    .concat(Object.keys(ALIAS)).sort((a,b)=>b.length-a.length);
  const out=[], vistos=new Set();
  trozos.forEach(fr=>{
    const F=fr.toUpperCase();
    // el nombre mas largo que aparezca en este fragmento
    const nm=nombres.find(n=>F.includes(n.toUpperCase()));
    if(!nm) return;
    const canon=ALIAS[nm]||nm;
    if(vistos.has(canon)) return;
    const ex=allEx().find(e=>e.name===canon); if(!ex||ex.erg) return;
    // series x reps dentro del fragmento
    const m=fr.match(/(\d+)\s*[x×]\s*(\d+)/);
    let sets=null, reps=null;
    if(m){ sets=+m[1]; reps=+m[2]; }
    else { const m2=fr.match(/[x×]\s*(\d+)/); if(m2){ sets=3; reps=+m2[1]; } }
    if(!reps) return;
    // peso: solo el que aparezca en ESTE fragmento
    const w=fr.match(/@?\s*(\d+(?:[.,]\d+)?)\s*kg/i);
    vistos.add(canon);
    out.push({name:canon,cat:ex.cat,sets:Math.max(1,Math.min(8,sets||3)),reps,
      rest:restSesion||ex.rest||90,
      weight:w?w[1]+"kg":(ex.weight||"—"),note:ex.note,
      paceMin:ex.paceMin,paceMax:ex.paceMax,unit:ex.unit,erg:false});
  });
  return out;
}
function lanzarSesionDelPlan(){
  const pos=planPos(), day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  if(!day) return;
  const wod=leerSesionDelPlan(day.main);
  if(!wod.length){ toast("No he sabido leer los ejercicios — usa el diseñador"); openBuilder(); return; }
  previewWod(wod,false);
}

  html+='<div class="dim" style="font-size:11px;margin-bottom:12px">Con '+genOpts.mins+' min saldrán <b>'+nx+' ejercicios × '+ns+' series</b>. Si te sabe a poco o a demasiado, cambia la duración.</div>';
  html+='<button class="btn" onclick="generateWod()">GENERAR WOD</button>';
  html+='<button class="btn2" style="margin:0" onclick="openBuilder()">✏️ Prefiero diseñarlo yo (AMRAP, EMOM…)</button>';
  overlay(html);
}
function genSet(k,v){ genOpts[k]=v; openGenerator(); }
function generateWod(){
  const ms=muscleStatus();
  const focus=genOpts.focus, mins=genOpts.mins;
  // escala proporcional: sirve para 12 minutos y para 90
  const nEx = mins<=15?2 : mins<=22?3 : mins<=32?4 : mins<=45?5 : mins<=60?6 : 7;
  const nSets = mins<=15?3 : mins<=25?3 : mins<=45?4 : 5;
  // base: sin ergómetros, con material disponible y respetando sobrecarga/agujetas SIEMPRE
  const soloCuerpo=!!PROFILE.soloCuerpo;
  const safe=allEx().filter(e=>!e.erg&&hasEquip(e)
    &&(!soloCuerpo||exEquip(e)==="ninguno")
    &&!Object.entries(e.m).some(([mu,c])=>c>=0.5&&(ms[mu].flag==="sobrecarga"||ms[mu].sore>=2)));
  let pool=safe.slice();
  if(focus==="metabólico") pool=pool.filter(e=>e.cat==="metabólico"||e.cat==="hyrox");
  else if(focus==="fuerza") pool=pool.filter(e=>e.cat==="fuerza");
  else if(focus==="hyrox") pool=pool.filter(e=>e.cat==="hyrox");
  else if(focus==="core") pool=pool.filter(e=>e.cat==="core"||Object.keys(e.m).includes("core"));
  else if(focus==="z2") pool=pool.filter(e=>e.cat!=="fuerza"); // bodyweight continuo
  // si el enfoque deja pocos, rellenar con el resto de ejercicios seguros (nunca los excluidos)
  if(pool.length<nEx) safe.forEach(e=>{ if(!pool.includes(e)) pool.push(e); });
  // puntuar: prioriza músculos poco trabajados; diversifica en greedy
  const temp={}; MUSCLES.forEach(m=>temp[m.id]=ms[m.id].rel);
  const chosen=[];
  for(let i=0;i<nEx&&pool.length;i++){
    pool.forEach(e=>{ e._score=Object.entries(e.m).reduce((a,[mu,c])=>a+c*(1-Math.min(1,temp[mu])),0)+Math.random()*0.3; });
    pool.sort((a,b)=>b._score-a._score);
    const pick=pool.shift(); chosen.push(pick);
    Object.entries(pick.m).forEach(([mu,c])=>temp[mu]=Math.min(1.5,temp[mu]+c*0.5));
  }
  const wod=chosen.map(e=>({name:e.name,cat:e.cat,sets:nSets,reps:e.reps,rest:focus==="z2"?45:e.rest,weight:e.weight,note:e.note,paceMin:e.paceMin,paceMax:e.paceMax,unit:e.unit}));
  previewWod(wod, focus==="z2");
}
function previewWod(wod,isZ2){
  st._wodDraft={wod,isZ2};
  let html='<div class="ctitle">'+(isZ2?'💚 WOD Z2 — continuo, FC <130':'⚡ WOD generado')+'</div>';
  wod.forEach((e,i)=>{
    const saved=st.savedPaces[e.name], u=e.unit&&e.unit!=="reps"?" "+e.unit:"";
    html+='<div class="daybox"><div class="row"><div><div style="font-size:14px;font-weight:600">'+(e.erg?"🚣 ":"")+esc(e.name)+'</div><div class="dim" style="font-size:11px">'+e.sets+'×'+e.reps+u+(e.unit==="seg"?'':'')+' · '+(e.erg?'ergómetro':esc(e.weight))+' · '+e.rest+'s desc</div></div><div class="mono" style="font-size:10px;color:'+(e.erg?'#4B7F3B':saved?'#A8E63E':'#ff4f3a')+'">'+(e.erg?'cronómetro':saved?'pace '+(saved+2):'1ª vez')+'</div></div></div>';
  });
  if(isZ2) html+='<div style="font-size:11px;color:#4B7F3B;margin:8px 0">Modo Z2: ritmo cómodo constante, sin buscar PB. Registra FC media al final — cuenta como sesión Z2 si ≤130.</div>';
  html+='<button class="btn" onclick="startWod()">▶ EMPEZAR</button><button class="btn2" onclick="generateWod()">↻ Regenerar</button>';
  overlay(html);
}

/* ═══════════════════ PLAYER WOD (metrónomo) ═══════════════════ */
var P={timers:[]};
function pClear(){ P.timers.forEach(clearInterval); P.timers=[]; }
function stopAllTimers(){ pClear(); }
function startWod(){
  const d=st._wodDraft; if(!d) return;
  st._lastCfg={type:"wod",wod:JSON.parse(JSON.stringify(d.wod)),isZ2:!!d.isZ2};
  Object.assign(P,{wod:d.wod,isZ2:d.isZ2,idx:0,set:1,results:[],setResults:[],running:false,resting:false,elapsed:0,restSec:0,startTime:Date.now(),pace:0,beat:-1});

}
function pInitEx(){
  const ex=P.wod[P.idx], saved=st.savedPaces[ex.name];
  P.pace = P.isZ2 ? (saved?Math.max(ex.paceMin,saved-10):0) : (saved?saved+2:0);

}
function pRender(){

  html+='<div style="display:flex;gap:7;justify-content:center;gap:7px;margin-bottom:10px">'+Array.from({length:ex.sets},(_,i)=>'<div style="width:11px;height:11px;border-radius:50%;background:'+(i<P.set-1?'#A8E63E':'transparent')+';border:2px solid '+(i===P.set-1?'#4B7F3B':'#242A32')+'"></div>').join("")+'</div>';
  // pace
  html+='<div style="background:#14171C;border:1px solid #242A32;border-radius:12px;padding:12px;margin-bottom:10px">';
  html+='<div class="row"><div><div class="mono dim" style="font-size:9px;letter-spacing:2px">PACE</div><div class="big" style="font-size:'+(P.pace?'42':'22')+'px;color:'+(P.pace?'#A8E63E':'#8A8F98')+'">'+(P.pace||"—")+'</div></div><div class="mono dim" style="font-size:10px;text-align:right">'+(P.pace?(P.pace/5).toFixed(1)+' reps/min<br>beat cada '+(60/(P.pace/5)).toFixed(2)+'s':'Cronómetro puro')+'</div></div>';
  if(ex.paceMax>0) html+='<div style="display:flex;gap:6px;margin-top:8px;align-items:center">'+[[-5,'-5'],[-1,'−'],[1,'+'],[5,'+5']].map(([d,l])=>'<button class="btn3" style="min-width:34px" '+(P.pace?'':'disabled')+' onclick="pPace('+d+')">'+l+'</button>').join("")+'<input type="range" min="'+ex.paceMin+'" max="'+ex.paceMax+'" value="'+(P.pace||ex.paceMin)+'" oninput="pPaceSet(this.value)"></div>';
  html+='</div>';
  // beats
  html+='<div style="display:flex;justify-content:center;gap:6px;padding:6px 0">'+Array.from({length:8},(_,i)=>'<div class="beatdot'+(P.beat===i?' on':'')+'" id="bd'+i+'"></div>').join("")+'</div>';
  // timer
  html+='<div style="text-align:center;margin:4px 0 12px"><div class="big" style="font-size:56px;letter-spacing:4px;color:'+(P.running?'#4B7F3B':first?'#ff4f3a':'#e8e8f0')+'">'+m+':'+s+'</div><div class="mono dim" style="font-size:9px;letter-spacing:2px;text-transform:uppercase">'+(P.running?(first?'CRONOMETRANDO — '+ex.reps+' reps':'SERIE EN CURSO'):'LISTO')+'</div></div>';

  } else {
    html+='<button class="btn" onclick="pMain()">'+(P.running?'COMPLETAR SERIE':'INICIAR')+'</button>';

function pPace(d){ const ex=P.wod[P.idx]; P.pace=Math.max(ex.paceMin,Math.min(ex.paceMax,(P.pace||ex.paceMin)+d)); if(P.running) pStartMetro(); pRender(); }
function pPaceSet(v){ P.pace=parseInt(v); if(P.running) pStartMetro(); pRender(); }
function pStartMetro(){
  P.timers=P.timers.filter(t=>t!==P.metro); clearInterval(P.metro);
  if(!P.pace) return;
  const ms=60000/(P.pace/5); let b=0;
  P.metro=setInterval(()=>{ P.beat=b%8; beep(880,0.05); b++;
    for(let i=0;i<8;i++){ const el=$("bd"+i); if(el) el.classList.toggle("on",i===P.beat); }
    setTimeout(()=>{const el=$("bd"+P.beat); if(el) el.classList.remove("on");},170);
  },ms);
  P.timers.push(P.metro);
}
function pMain(){
  const ex=P.wod[P.idx];
  if(P.resting) return;
  if(!P.running){
    P.running=true; P.elapsed=0;
    P.chron=setInterval(()=>{ P.elapsed++; const el=$("overlay").querySelector(".big[style*='56px']"); if(el){const m=String(Math.floor(P.elapsed/60)).padStart(2,"0"),s2=String(P.elapsed%60).padStart(2,"0"); el.textContent=m+":"+s2;} },1000);
    P.timers.push(P.chron);
    if(P.pace) pStartMetro();
    pRender(); // re-render resets chron display refs
  } else {
    pClear(); P.running=false; P.beat=-1;
    const t=Math.max(1,P.elapsed);
    const rpm=(ex.reps/t)*60, ap=Math.round(rpm*5);
    P.setResults.push({set:P.set,time:t,pace:ex.paceMax>0?ap:0,reps:ex.reps});
    if(P.set<ex.sets){ P.set++; pStartRest(ex.rest,false); }
    else {
      const paced=P.setResults.filter(r=>r.pace>0);
      const avg=paced.length?Math.round(paced.reduce((a,b)=>a+b.pace,0)/paced.length):0;
      P.results.push({name:ex.name,sets:P.setResults.slice(),avgPace:avg,totalReps:ex.reps*ex.sets,unit:ex.unit});
      if(P.idx<P.wod.length-1){ pStartRest(ex.rest*2,true); }
      else { pFeedback(); }
    }
  }
}
function pStartRest(sec,nextEx){
  P.resting=true; P.restSec=sec; P.nextEx=nextEx; P.elapsed=0; pRender();
  P.rest=setInterval(()=>{
    P.restSec--;
    if(P.restSec<=3&&P.restSec>0) beep(440,0.1);
    const el=$("restnum"); if(el) el.textContent=P.restSec;
    if(P.restSec<=0){ clearInterval(P.rest); P.resting=false; beep(660,0.15);
      if(P.nextEx){ P.idx++; pInitEx(); } else { P.elapsed=0; }
      pRender(); }
  },1000);
  P.timers.push(P.rest);
}
function pSkipRest(){ clearInterval(P.rest); P.resting=false; beep(660,0.15); if(P.nextEx){ P.idx++; pInitEx(); } else P.elapsed=0; pRender(); }
function pReset(){ pClear(); P.running=false; P.beat=-1; P.elapsed=0; pRender(); }
function pSkipEx(){ pClear(); P.running=false; if(P.idx<P.wod.length-1){ P.idx++; pInitEx(); pRender(); } else pFeedback(); }
function pQuit(){ pClear(); closeOverlay(); }
function pFeedback(){
  pClear();

  const paced=P.results.filter(r=>r.avgPace);
  const avg=paced.length?Math.round(paced.reduce((a,b)=>a+b.avgPace,0)/paced.length):0;

}

/* ═══════════════════ FEEDBACK Y GUARDADO ═══════════════════ */
const FEELINGS=["💪 Bien","😓 Duro","🦵 Piernas cargadas","😴 Fatiga","🤕 Molestia","🔥 En zona","❄️ Sin energía"];
const SESSTYPES=["Fuerza","Metabólico","Carrera","Tempo","Ergómetro","Umbral Híbrido","Cluster HYROX","Comp. Running","Bici Z2","Movilidad","Activación","Test","Playa","COMPETICIÓN"];
/* deduce el tipo por el contenido real de la sesión; solo usa el plan si no hay pistas */
function guessType(fb){
  const names=(fb.results||[]).map(r=>r.name.toUpperCase());
  fb.typeAuto=true;
  if(fb.mode==="mob") return "Movilidad";
  if(names.length){
    const cats=[...new Set(names.map(n=>{const e=allEx().find(x=>x.name===n);return e?e.cat:null;}).filter(Boolean))];
    const hasRun=names.some(n=>/CARRERA/.test(n)), hasErg=names.some(n=>/REMO|SKIERG|BIKE/.test(n));
    if(hasRun&&(hasErg||cats.some(c=>c!=="running"))) return "Umbral Híbrido";
    if(hasRun) return fb.isZ2?"Carrera":"Carrera";
    if(hasErg) return "Ergómetro";
    if(cats.length===1&&cats[0]==="fuerza") return "Fuerza";
    if(cats.includes("hyrox")) return "Cluster HYROX";
    return "Metabólico";
  }
  // sin ejercicios (registro manual): propone el del plan
  const pos=planPos(), day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  if(day&&day.t!=="Descanso") return day.t;
  return fb.mode==="pacer"?"Carrera":"Fuerza";
}

function fbRpe(v){ st._fb.rpe=v; keepFbInputs(); showFeedback(); }
function fbFav(){ st._fb.saveFav=!st._fb.saveFav; keepFbInputs(); showFeedback(); }
function fbType(t){ st._fb.type=t; st._fb.typeAuto=false; keepFbInputs(); showFeedback(); }
function fbFeel(f){ const a=st._fb.feelings; a.includes(f)?a.splice(a.indexOf(f),1):a.push(f); keepFbInputs(); showFeedback(); }
function keepFbInputs(){ const fc=$("fbFc"),n=$("fbNotes"); if(fc) st._fb.fcAvg=fc.value?parseInt(fc.value):null; if(n) st._fb.notes=n.value; }
function saveSession(){
  keepFbInputs();
  const fb=st._fb, pos=planPos(), t=todayISO();
  const day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  const isPlanned=!!day&&day.t!=="Descanso";
  const type=fb.type||guessType(fb);
  // la sesión cuenta como "del plan" solo si coincide con lo previsto
  const matchesPlan=isPlanned&&day&&(type===day.t||DTYPE[type]&&DTYPE[day.t]&&DTYPE[type].mode===DTYPE[day.t].mode);
  const z2Expected=fb.isZ2||(day&&DTYPE[day.t]&&DTYPE[day.t].z2&&matchesPlan);
  const z2ok=z2Expected? z2Check(fb.fcAvg) : undefined;
  const exercises=(fb.results||[]).map(r=>({name:r.name,avgPace:r.avgPace||null,totalReps:r.totalReps,sets:r.sets}));
  const muscleLoad=sessionMuscleLoad(exercises);
  const srpe=computeSRPE(fb.rpe,fb.durationMin);
  const pts=fb.mode==="mob"?PTS.mobilidad:matchesPlan?PTS.plan:fb.mode==="wod"?PTS.generado:PTS.libre;
  const sess={id:Date.now(),date:t,week:pos.week>0?pos.week:null,dayIdx:pos.dayIdx,type,mode:fb.mode,
    exercises,durationMin:fb.durationMin,rpe:fb.rpe,srpe,fcAvg:fb.fcAvg||null,
    z2ok:z2Expected?!!z2ok:undefined,feelings:fb.feelings,notes:fb.notes||"",muscleLoad,points:pts,format:fb.formatName||null};
  st.sessions.push(sess);
  // actualizar paces
  exercises.forEach(e=>{ if(e.avgPace){ st.savedPaces[e.name]=e.avgPace;
    st.paceHistory.push({exercise:e.name,pace:e.avgPace,date:new Date().toLocaleDateString(locale(),{day:"2-digit",month:"short"}),cat:(allEx().find(x=>x.name===e.name)||{}).cat}); } });
  addPoints(pts,(matchesPlan?"Sesión del plan":"Sesión libre")+" — "+type);
  if(z2Expected&&!z2ok&&fb.fcAvg) toast("⚠ FC "+fb.fcAvg+" — fuera de Z2. La próxima, más suave.");
  // semana perfecta
  if(pos.week>=1){ const d=disciplineWeek(pos.week); if(d&&d.plannedDue>0&&d.done>=d.plannedDue&&pos.dayIdx===6){ st.perfectWeeks++; addPoints(PTS.weekPerfect,"Semana perfecta S"+pos.week); } }
  // favoritos: alta y registro de marca
  const entry=fb.metric?{date:t,v:fb.metric.v,label:fb.metric.label}:{date:t,v:null,label:"hecho"};
  if(fb.saveFav&&st._lastCfg&&st._runningFav==null){
    const nm=((fb.formatName||type).split(" — ")[0])+" · "+(exercises.slice(0,2).map(e=>e.name).join("+")||"WOD");
    st.favorites.push({id:Date.now(),name:nm,cfg:st._lastCfg,hi:fb.metric?fb.metric.hi:true,history:[entry]});
    toast("⭐ Favorito guardado: "+nm);
  }
  if(st._runningFav!=null){
    const fav=st.favorites.find(f=>f.id===st._runningFav);
    if(fav&&entry.v!=null){
      const prev=fav.history.filter(x=>x.v!=null).map(x=>x.v);
      const isPB=prev.length&&(fav.hi?entry.v>Math.max(...prev):entry.v<Math.min(...prev));
      fav.history.push(entry);
      if(isPB){ addPoints(5,"🏆 PB en "+fav.name); setTimeout(()=>toast("🏆 ¡PB! "+entry.label+" en "+fav.name),400); }
    } else if(fav) fav.history.push(entry);
  }
  st._runningFav=null; st._lastCfg=null;
  st._fb=null; save(); closeOverlay(); render(); toast("Sesión guardada · +"+pts+" pts ⚡");
}

var PC={timers:[],machine:"CARRERA",bpm:172,running:false,elapsed:0};
function openPacer(z2){
  PC.z2=!!z2; PC.running=false; PC.elapsed=0;
  PC.mode=PC.mode||"libre"; PC.work=PC.work||60; PC.restS=PC.restS||60; PC.series=PC.series||6;
  if(PC.voice==null) PC.voice=true;
  PC.phase="work"; PC.curSerie=1; PC.phaseLeft=0;
  pcRender();
}
function pcRender(){
  const machines=EXDB.filter(e=>e.erg);
  const mx=machines.find(m=>m.name===PC.machine)||machines[3];
  if(!PC._userBpm) PC.bpm=mx.spmDef;
  const isInt=PC.mode==="int";
  const shown=isInt&&(PC.running||PC.phaseLeft>0)?PC.phaseLeft:PC.elapsed;
  const m=String(Math.floor(shown/60)).padStart(2,"0"), s=String(shown%60).padStart(2,"0");
  let html='<div class="row" style="margin-bottom:10px"><span class="mono dim" style="font-size:10px">PACER'+(PC.z2?' · <span style="color:#4B7F3B">Z2 — FC ≤130</span>':'')+'</span><button class="btn3" onclick="pcQuit()">✕ Salir</button></div>';
  html+='<div class="chips" style="margin-bottom:10px">'+machines.map(mm=>'<button class="btn3'+(PC.machine===mm.name?' sel':'')+'" onclick="pcMachine(\''+mm.name+'\')">'+esc(mm.name)+'</button>').join("")+'</div>';
  // modo
  html+='<div style="display:flex;gap:6px;margin-bottom:10px"><button class="btn3'+(!isInt?' sel':'')+'" style="flex:1" onclick="pcMode(\'libre\')">⏱ Libre</button><button class="btn3'+(isInt?' sel':'')+'" style="flex:1" onclick="pcMode(\'int\')">🔔 Intervalos con audio</button></div>';
  if(isInt&&!PC.running&&PC.elapsed===0){
    html+='<div style="font-size:11px;font-weight:600;margin-bottom:4px">Trabajo</div><div class="chips" style="margin-bottom:8px">';
    [30,45,60,90,120,180,240].forEach(v=>{ html+='<button class="btn3'+(PC.work===v?' sel':'')+'" onclick="pcSet(\'work\','+v+')">'+(v<60?v+'s':(v/60)+"'")+'</button>'; });
    html+='</div><div style="font-size:11px;font-weight:600;margin-bottom:4px">Descanso</div><div class="chips" style="margin-bottom:8px">';
    [30,45,60,90,120].forEach(v=>{ html+='<button class="btn3'+(PC.restS===v?' sel':'')+'" onclick="pcSet(\'restS\','+v+')">'+(v<60?v+'s':(v/60)+"'")+'</button>'; });
    html+='</div><div style="font-size:11px;font-weight:600;margin-bottom:4px">Series</div><div class="chips" style="margin-bottom:8px">';
    [4,5,6,8,10,12].forEach(v=>{ html+='<button class="btn3'+(PC.series===v?' sel':'')+'" onclick="pcSet(\'series\','+v+')">'+v+'</button>'; });
    html+='</div><input type="text" id="pcTarget" value="'+esc(PC.target||"")+'" placeholder="Objetivo por serie (ej: 250m ski · 62 splits)" onchange="PC.target=this.value" style="margin-bottom:8px">';
    html+='<button class="btn3'+(PC.voice?' sel':'')+'" style="width:100%;margin-bottom:10px" onclick="PC.voice=!PC.voice;pcRender()">'+(PC.voice?'🔊 Voz activada (es-ES)':'🔇 Solo beeps')+'</button>';
  }
  // cadencia
  html+='<div style="background:#14171C;border:1px solid #242A32;border-radius:12px;padding:12px;margin-bottom:10px"><div class="row"><div><div class="mono dim" style="font-size:9px;letter-spacing:2px">'+(PC.machine==="CARRERA"?"CADENCIA (pasos/min)":"RITMO (strokes/min)")+'</div><div class="big" style="font-size:40px;color:#A8E63E">'+PC.bpm+'</div></div><div class="mono dim" style="font-size:10px;text-align:right">beep cada<br>'+(60/PC.bpm).toFixed(2)+'s</div></div>';
  html+='<div style="display:flex;gap:6px;margin-top:8px;align-items:center"><button class="btn3" onclick="pcBpm(-1)">−</button><input type="range" min="'+mx.spm[0]+'" max="'+mx.spm[1]+'" value="'+PC.bpm+'" oninput="pcBpmSet(this.value)"><button class="btn3" onclick="pcBpm(1)">+</button></div></div>';
  html+='<div style="display:flex;justify-content:center;gap:6px;padding:6px 0">'+Array.from({length:8},(_,i)=>'<div class="beatdot" id="pbd'+i+'"></div>').join("")+'</div>';
  // estado intervalo
  if(isInt){
    const workPhase=PC.phase==="work";
    html+='<div style="text-align:center;margin-bottom:4px"><span class="tagz" id="pcphase" style="background:'+(workPhase?'#ff4f3a22;color:#ff4f3a':'#4B7F3B22;color:#4B7F3B')+';font-size:12px;padding:4px 12px">'+(workPhase?'🔥 TRABAJO':'💨 DESCANSO')+'</span> <span class="mono" id="pcserie" style="font-size:12px;color:#A8E63E">SERIE '+PC.curSerie+'/'+PC.series+'</span></div>';
    if(PC.target) html+='<div style="text-align:center;font-size:13px;color:#8A8F98;margin-bottom:2px">🎯 '+esc(PC.target)+'</div>';
  }
  html+='<div style="text-align:center;margin:4px 0 12px"><div class="big" id="pcclock" style="font-size:56px;letter-spacing:4px;color:'+(PC.running?(isInt&&PC.phase==="work"?'#ff8347':'#4B7F3B'):'#e8e8f0')+'">'+m+':'+s+'</div><div class="mono dim" style="font-size:9px;letter-spacing:2px">'+(PC.running?(isInt?"CUENTA ATRÁS":"EN MARCHA"):"LISTO")+'</div></div>';
  html+='<button class="btn" onclick="pcToggle()">'+(PC.running?'⏸ PARAR':'▶ EMPEZAR')+'</button>';
  html+='<button class="btn2" onclick="pcFinish()">✓ Terminar y registrar sesión</button>';
  overlay(html);
}
function pcMode(m2){ PC.mode=m2; pcRender(); }
function pcSet(k,v){ const t=$("pcTarget"); if(t) PC.target=t.value; PC[k]=v; pcRender(); }
function pcMachine(n){ PC.machine=n; PC._userBpm=false; pcRender(); }
function pcBpm(d){ PC.bpm+=d; PC._userBpm=true; if(PC.running) pcMetro(); pcRender(); }
function pcBpmSet(v){ PC.bpm=parseInt(v); PC._userBpm=true; if(PC.running) pcMetro(); pcRender(); }
function pcMetro(){
  clearInterval(PC.metro);
  const ms=60000/PC.bpm; let b=0;
  PC.metro=setInterval(()=>{ const bi=b%8; beep(PC.z2?660:880,0.05); b++;
    for(let i=0;i<8;i++){ const el=$("pbd"+i); if(el) el.classList.toggle("on",i===bi); }
  },ms);
  PC.timers.push(PC.metro);
}
function pcClock(v){ const el=$("pcclock"); if(el) el.textContent=String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0"); }
function pcToggle(){
  if(!PC.running){
    PC.running=true;
    const t=$("pcTarget"); if(t) PC.target=t.value;
    if(PC.mode==="int"&&PC.elapsed===0){ PC.phase="work"; PC.phaseLeft=PC.work; PC.curSerie=1;
      say("Serie 1. ¡Vamos!"); beep(990,0.15); }
    PC.chron=setInterval(()=>{
      PC.elapsed++;
      if(PC.mode!=="int"){ pcClock(PC.elapsed); return; }
      PC.phaseLeft--;
      pcClock(Math.max(0,PC.phaseLeft));
      const L=PC.phaseLeft;
      if(PC.phase==="work"){
        if(PC.work>=60&&L===Math.floor(PC.work/2)) say("Mitad.");
        if(PC.work>45&&L===30) say("Treinta segundos.");
        if(L===15) say("Quince. Si no llegas, aprieta ya.");
        if(L<=5&&L>0) beep(1200,0.1);
        if(L<=0){
          if(PC.curSerie>=PC.series){
            beep(660,0.4); say("Última serie completada. ¡Hecho!");
            PC.running=false; PC.timers.forEach(clearInterval); PC.timers=[]; pcRender(); return;
          }
          PC.phase="rest"; PC.phaseLeft=PC.restS;
          beep(660,0.3); say("¡Descanso!"); pcRender();
        }
      } else { // rest
        if(L===10) say("Diez segundos. Prepárate.");
        if(L<=3&&L>0) beep(440,0.1);
        if(L<=0){
          PC.curSerie++; PC.phase="work"; PC.phaseLeft=PC.work;
          beep(990,0.2); say("Serie "+PC.curSerie+". ¡Vamos!"); pcRender();
        }
      }
    },1000);
    PC.timers.push(PC.chron); pcMetro(); pcRender();
  } else { PC.running=false; PC.timers.forEach(clearInterval); PC.timers=[]; try{speechSynthesis.cancel();}catch(e){} pcRender(); }
}
function pcToggleResume(){ /* re-render mata el interval visual pero los timers siguen */ }
function pcQuit(){ PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false; closeOverlay(); }
function pcFinish(){
  PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false;
  const mins=Math.max(1,Math.round(PC.elapsed/60));
  st._fb={results:[{name:PC.machine,avgPace:null,totalReps:mins*10,unit:"min"}],durationMin:mins,mode:"pacer",isZ2:PC.z2,type:null};
  showFeedback();
}

function fpResults(fmt,roundsDone,mins){

  if(fmt==="emom"){ const perEx=Math.floor((mins/((B.every||1)))/B.ex.length);
    return B.ex.map(x=>({name:x.name,avgPace:null,totalReps:x.reps*perEx})); }
  if(fmt==="classic") return B.ex.map(x=>({name:x.name,avgPace:null,totalReps:x.reps*B.sets}));
  return B.ex.map(x=>({name:x.name,avgPace:null,totalReps:x.reps*roundsDone})); // amrap/fortime/circuit

var FP={timers:[]};
function fpClear(){ (FP.timers||[]).forEach(clearInterval); FP.timers=[]; }
function fpRender(){
  const f=FP.fmt, meta=FORMATS[f];
  const countdown=(f==="amrap"||f==="emom");
  const totalSec=countdown?FP.mins*60:null;
  const remain=countdown?Math.max(0,totalSec-FP.elapsed):null;
  const shown=countdown?remain:FP.elapsed;
  const mm=String(Math.floor(shown/60)).padStart(2,"0"), ss=String(shown%60).padStart(2,"0");

    html+='<div class="chips" style="margin-bottom:10px">'+sch.map((r,i)=>'<span class="tagz" style="background:'+(i<FP.rung?'#A8E63E22;color:#A8E63E':i===FP.rung?'#4B7F3B22;color:#4B7F3B':'#23233f;color:#8A8F98')+'">'+r+'</span>').join("")+'</div>';
    html+='<div style="text-align:center;margin-bottom:8px"><span class="big" style="font-size:44px;color:#4B7F3B">'+(sch[FP.rung]!=null?sch[FP.rung]:"✓")+'</span> <span class="mono dim" style="font-size:10px">reps de cada uno</span></div>';
  }
  if(f==="emom"){ const ev=FP.every||60; const blq=Math.floor(FP.elapsed/ev); const cur=FP.ex[blq%FP.ex.length]; const nxt=FP.ex[(blq+1)%FP.ex.length];
    const inMin=ev-(FP.elapsed%ev), cu=cur.unit&&cur.unit!=="reps"?" "+cur.unit:"";
    const totBlq=Math.floor(FP.mins*60/ev);
    html+='<div style="text-align:center;margin-bottom:8px"><div class="mono dim" style="font-size:9px;letter-spacing:2px">'+(ev===60?'MINUTO ':'BLOQUE ')+(blq+1)+'/'+totBlq+' · quedan <span id="fpinmin">'+inMin+'</span>s</div><div class="big" style="font-size:30px;color:#A8E63E">'+(cur.erg?"🚣 ":"")+esc(cur.name)+' '+(cu?cur.reps+cu:"×"+cur.reps)+'</div><div class="dim" style="font-size:11px">siguiente: '+esc(nxt.name)+'</div></div>';
  }
  // lista de ejercicios (una ronda)
  if(f!=="emom") FP.ex.forEach(e=>{ const u=e.unit&&e.unit!=="reps"?e.unit:null;
    html+='<div class="daybox" style="padding:7px 11px"><div class="row"><span style="font-size:13px;font-weight:600">'+(e.erg?"🚣 ":"")+esc(e.name)+'</span><span class="mono" style="font-size:12px;color:#4B7F3B">'+(f==="ladder"&&!e.erg?"↕":(u?e.reps+" "+u:"×"+e.reps))+'</span></div></div>'; });
  // reloj
  html+='<div style="text-align:center;margin:10px 0"><div class="big" id="fpclock" style="font-size:60px;letter-spacing:4px;color:'+(FP.running?(countdown&&remain<60?'#ff4f3a':'#4B7F3B'):'#e8e8f0')+'">'+mm+':'+ss+'</div><div class="mono dim" style="font-size:9px;letter-spacing:2px">'+(countdown?"CUENTA ATRÁS":"TIEMPO")+(FP.cap&&f==="fortime"?' · CAP '+FP.cap+"'":'')+'</div></div>';
  // rondas
  if(f==="amrap") html+='<div style="text-align:center;margin-bottom:10px"><span class="big" style="font-size:40px;color:#A8E63E">'+FP.done+'</span> <span class="mono dim" style="font-size:10px">RONDAS</span></div>';
  if(f==="fortime"||f==="circuit") html+='<div style="text-align:center;margin-bottom:10px"><span class="big" style="font-size:40px;color:#A8E63E">'+FP.done+'</span><span class="mono dim" style="font-size:12px">/'+FP.rounds+' RONDAS</span></div>';
  if(!FP.running&&FP.elapsed===0) html+='<button class="btn" onclick="fpToggle()">▶ EMPEZAR</button>';
  else{
    if(f==="amrap") html+='<button class="btn" onclick="fpRound()">+1 RONDA</button>';
    if(f==="fortime"||f==="circuit") html+='<button class="btn" onclick="fpRound()">✓ RONDA HECHA</button>';
    if(f==="ladder") html+='<button class="btn" onclick="fpRung()">✓ PELDAÑO HECHO</button>';
    html+='<div style="display:flex;gap:8px"><button class="btn2" style="margin:0;flex:1" onclick="fpToggle()">'+(FP.running?'⏸ Pausa':'▶ Seguir')+'</button><button class="btn2" style="margin:0;flex:1" onclick="fpFinish()">🏁 Terminar</button></div>';
  }
