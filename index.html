/* D6 · variables de color: un sitio para toda la paleta */
:root{
  --bg:#0D0F12; --card:#161A20; --card-2:#1F252D; --line:#2A313B; --line-2:#3A4350;
  --text:#ECEEF2; --text-2:#D9DCE3; --muted:#A3A9B3;
  --lime:#A8E63E; --ok:#7BC96F; --ok-fill:#4B7F3B;
  --warn:#FFB347; --danger:#FF6B5A; --rehab:#C4A6FF;
  --f-run:#5BB8FF; --f-erg:#3DD6C4; --f-str:#B79CFF; --f-hyb:#FF9B54; --f-rec:#7BC96F; --f-race:#FF7AA8;
  --ts:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* D7 · todo el texto escala con «Texto grande» */
html{background:var(--bg);font-size:calc(16px * var(--ts));-webkit-text-size-adjust:100%}
body{background:var(--bg);min-height:100vh;color:var(--text);font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:1rem;line-height:1.45;max-width:480px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.screen{padding:16px 14px 0;display:none}
.screen.active{display:block}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.logo{font-family:'Bebas Neue',impact,sans-serif;font-size:1.625rem;letter-spacing:2px;line-height:1;color:var(--lime)}
.who{font-size:.875rem;color:var(--muted);margin-top:4px}
.slbl{font-size:.8125rem;color:var(--muted);text-align:right;line-height:1.4}
.slbl b{color:var(--text);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.ctitle{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:12px}
.ctitle.mini{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:8px}
.lbl{font-size:.875rem;font-weight:600;color:var(--text-2);margin-bottom:6px}
.metricrow{background:var(--card-2);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.metricrow .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.metricrow .nm{font-size:.9375rem;font-weight:600}
.metricrow .pct{font-size:1.25rem;font-weight:700}
.metricrow .sub{display:flex;justify-content:space-between;gap:8px;font-size:.8125rem;color:var(--muted);margin-top:7px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>div{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
/* D4 · todo lo tocable mide al menos 44 px */
.btn{width:100%;min-height:56px;padding:14px;border-radius:14px;border:none;background:var(--lime);color:#0D0F12;font-family:'Bebas Neue',impact,sans-serif;font-size:1.375rem;letter-spacing:2px;line-height:1.1;cursor:pointer;margin-bottom:10px;display:block}
.btn.xl{min-height:64px;font-size:1.5rem}
.btn:disabled{opacity:.35}
.btn2{width:100%;min-height:52px;padding:12px;border-radius:14px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font-family:inherit;font-size:.9375rem;font-weight:600;cursor:pointer;margin-bottom:10px;display:block;line-height:1.3}
.btn2.btn-danger,.btn-danger{color:var(--danger);border-color:rgba(255,107,90,.45)}
.btn3{min-height:44px;min-width:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font-family:inherit;font-size:.875rem;line-height:1.25;cursor:pointer}
.btn3.sel{border-color:var(--lime);color:var(--lime);background:rgba(168,230,62,.10)}
.btn3:disabled{opacity:.35}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid5 .btn3{width:100%;padding:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.opts .btn2{margin:0;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
/* D9 · barra inferior */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#12151A;border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;min-height:60px;padding:8px 0 6px;background:none;border:none;color:var(--muted);font-family:inherit;font-size:.6875rem;font-weight:600;letter-spacing:.3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nb.active{color:var(--lime)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb .ic svg{width:24px;height:24px}
.big{font-family:'Bebas Neue',impact,sans-serif;line-height:1;letter-spacing:.5px}
.mono{font-family:ui-monospace,Menlo,monospace}
.dim{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tagz{font-size:.8125rem;font-weight:600;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip{font-size:.8125rem;padding:5px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
input[type=range]{accent-color:var(--lime);flex:1;min-height:44px}
input[type=text],input[type=number],textarea,select{background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:12px;color:var(--text);font-size:1rem;outline:none;font-family:inherit;width:100%;min-height:48px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.hbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.hbar>div{height:100%;border-radius:4px;transition:width .6s}
/* D2 · semana: círculos de 40 px */
.dotday{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.875rem;font-weight:700;border:2px solid var(--line-2);color:var(--muted)}
.dotday.today{box-shadow:0 0 0 3px rgba(168,230,62,.45)}
.beatdot{width:10px;height:10px;border-radius:50%;background:var(--line-2);transition:all .05s}
.beatdot.on{background:var(--lime);box-shadow:0 0 14px rgba(168,230,62,.8);transform:scale(1.5)}
.daybox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.overlay{position:fixed;inset:0;background:rgba(5,6,8,.92);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 14px calc(30px + env(safe-area-inset-bottom))}
.overlay.open{display:flex}
.ovcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:452px}
.muscle{transition:fill .5s}
.wkhead{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px}
.wbadge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8125rem;font-weight:700;color:#0D0F12;flex-shrink:0}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--lime);color:#0D0F12;padding:12px 18px;border-radius:12px;font-size:.9375rem;font-weight:600;z-index:300;display:none;max-width:90%}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:150;background:var(--lime);color:#0D0F12;border:none;border-radius:999px;padding:12px 18px;font-family:inherit;font-weight:700;font-size:.9375rem;min-height:48px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.cargando{padding:80px 20px;text-align:center;color:var(--muted);font-size:1rem}
/* D2 · tarjeta de la sesión de hoy */
.today{padding:0;overflow:hidden}
.today .stripe{height:6px}
.today .in{padding:16px}
.today .ttl{font-family:'Bebas Neue',impact,sans-serif;font-size:2.5rem;line-height:1;letter-spacing:.5px;margin:10px 0 8px}
.today .txt{font-size:1rem;line-height:1.55;color:var(--text)}
.today .sub{font-size:.875rem;line-height:1.5;color:var(--muted);margin-top:6px}
.pre{font-size:.875rem;color:var(--warn);background:rgba(255,179,71,.10);padding:8px 10px;border-radius:10px;margin-bottom:10px;line-height:1.45}
.rehab{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.rehab .t{font-size:.75rem;letter-spacing:1.5px;font-weight:700;color:var(--rehab);margin-bottom:6px}
.rehab .x{font-size:.875rem;line-height:1.5;color:var(--text-2);margin-bottom:10px}
.rehab .btn2{border-color:rgba(196,166,255,.45);color:var(--rehab);margin:0}
.rehab .btn2.on{background:rgba(196,166,255,.12)}
.aviso{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:.9375rem;line-height:1.5}
.aviso.w{background:rgba(255,179,71,.10);border:1px solid rgba(255,179,71,.45);color:var(--text)}
.aviso.d{background:rgba(255,107,90,.10);border:1px solid rgba(255,107,90,.5);color:var(--text)}
.stat3{display:flex;gap:0;padding:12px 6px}
.stat3>div{flex:1;text-align:center}
.stat3>div+div{border-left:1px solid var(--line)}
.stat3 .v{font-family:'Bebas Neue',impact,sans-serif;font-size:1.75rem;line-height:1}
.stat3 .l{font-size:.75rem;color:var(--muted);margin-top:4px}

</style>

var _trRx=null;
function trBuild(){
  const d=I18N[PROFILE.lang]; _trRx=null; if(!d) return;
  /* C6 · las claves de 5 letras o menos solo casan como palabra entera:
     «media» dentro de «immediately» daba «immediumtely» */
  const L="A-Za-zÀ-ÿ";
  const ks=Object.keys(d).sort((a,b)=>b.length-a.length).map(k=>{ const q=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return k.trim().length<=5 ? "(?<!["+L+"])"+q+"(?!["+L+"])" : q; });
  _trRx=new RegExp(ks.join("|"),"g");
}
function trTxt(t){ const d=I18N[PROFILE.lang]; if(!d||!_trRx) return t;
  return String(t).replace(_trRx,m=>d[m]||m); }
/* traduce el DOM ya renderizado: nunca toca atributos ni manejadores */
function trDOM(root){
  const d=I18N[PROFILE.lang]; if(!d||!_trRx||!root) return;
  /* C6 · el texto que viene del plan, del perfil o del usuario lleva
     data-notr y no se toca */
  const it=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const p=n.parentElement; return p&&p.closest&&p.closest("[data-notr]") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }},false), ns=[];
  let n; while(n=it.nextNode()) ns.push(n);
  ns.forEach(x=>{ const t=x.textContent; if(!t.trim()) return;
    const r=t.replace(_trRx,m=>d[m]||m); if(r!==t) x.textContent=r; });
  root.querySelectorAll("[placeholder]").forEach(e=>{ if(e.closest("[data-notr]")) return; e.placeholder=e.placeholder.replace(_trRx,m=>d[m]||m); });
}
function nt(s){ return '<span data-notr>'+esc(s)+'</span>'; }

function exEquip(e){
  const n=e.name.toUpperCase(), wgt=(e.weight||"").toLowerCase();
  if(/^REMO$/.test(n)) return "remo";
  if(n==="SKIERG") return "skierg";
  if(n==="ASSAULT BIKE") return "bike";
  if(n==="CARRERA") return "ninguno";
  if(/BOXEO/.test(n)) return "boxeo";
  if(/CLUBBELL/.test(n)) return "clubbell";
  if(/COMBA|DOUBLE UNDER/.test(n)||/comba/.test(wgt)) return "comba";
  if(/ANILLA|RING/.test(n)||/anillas/.test(wgt)) return "anillas";
  if(/PULL-UPS|TOES TO BAR|HANGING/.test(n)) return "anillas";
  if(/SANDBAG|BEAR HUG|SACO/.test(n)||/saco/.test(wgt)) return "saco";
  if(/MANCUERNA|APERTURAS|ELEVACIONES|PULLOVER|ENCOGIMIENTOS|EXTENSIÓN TRÍCEPS/.test(n)||/×\d+kg/.test(wgt)&&/MANCUERNA/.test(n)) return "mancuernas";
  if(/BARRA|SENTADILLA|PESO MUERTO|PRESS BANCA|PRESS MILITAR|PUSH PRESS|FRONT SQUAT|HIP THRUST|RDL$|REMO CON BARRA|FLOOR PRESS|CURL BÍCEPS/.test(n)||/barra/.test(wgt)) return "barra";
  if(/TO PLATE/.test(n)||/disco/.test(wgt)) return "disco";
  if(/BOX|CAJÓN/.test(n)||/cajón/.test(wgt)) return "cajon";
  if(/WALL BALL|SIT-UP THROW|SLAM BALL|RUSSIAN TWIST/.test(n)||/balón/.test(wgt)) return "balon";
  if(/KB |KETTLEBELL|GOBLET|FARMER|SUITCASE|OVERHEAD CARRY|THRUSTER|DEAD BALL|LUNGES/.test(n)||/kb/.test(wgt)) return "kb";
  if(/CHALECO/.test(n)||/chaleco/.test(wgt)) return "chaleco";
  if(/2×\d|×\d+kg/.test(wgt)) return "mancuernas";
  return "ninguno";
}
function hasEquip(e){ const q=exEquip(e); return q==="ninguno"||(PROFILE.equipment||[]).includes(q); }

/* Los mesociclos eran globales: cualquier perfil con plan propio veía los de
   Miguel — Ángel leyendo "Transición post-DEKA" y Joaquina "Base HYROX".
   Ahora los declara el perfil, y si no, se derivan de los `m` de su plan. */
const MESOCOLS=["#6B7F3A","#1D9E75","#378ADD","#D85A30","#D4537E","#BA7517","#7C3AED"];
function mesos(){
  if(PROFILE.mesos&&PROFILE.mesos.length) return PROFILE.mesos;
  if(!PROFILE.plan||!PROFILE.plan.length) return MESOS;
  const out=[];
  PLAN.forEach(w=>{
    const m=w.m||1; let e=out.find(x=>x.id===m);
    if(!e){ e={id:m,label:"M"+m,title:"Bloque "+m,color:MESOCOLS[(m-1)%MESOCOLS.length],_w:[]}; out.push(e); }
    e._w.push(w.w);
  });
  out.forEach(e=>{ const a=Math.min.apply(null,e._w), b=Math.max.apply(null,e._w);
    e.sub = a===b ? ("S"+a) : ("S"+a+"–S"+b); delete e._w; });
  return out.sort((a,b)=>a.id-b.id);
}

function tagTipo(t){ const f=famTipo(t); return '<span class="tagz" style="background:'+f.c+'1F;color:'+f.c+'">'+icon(f.icon)+esc(t)+'</span>'; }
Object.keys(DTYPE).forEach(t=>{ DTYPE[t].c=famTipo(t).c; });
function aplicarEscala(){ try{ document.documentElement.style.setProperty("--ts", st.textScale||1); }catch(e){} }

var KEY = "deka-trainer-v4";  // miguel conserva la clave original; el resto añade sufijo
const defaultState = {
  planStart: "2026-07-20",           // lunes de la S1
  sessions: [],                       // {id,date,week,dayIdx,type,mode,exercises,durationMin,rpe,srpe,fcAvg,z2ok,feelings,notes,muscleLoad,points}
  savedPaces: {}, paceHistory: [],
  mobHistory: [],
  checkins: {},                       // "YYYY-MM-DD": {soreness:{}, sleep:1-5, habits:{}}
  points: 0, pointsLog: [],
  rewards: [], badges: [], perfectWeeks: 0,
  favorites: [], exCustom: [],
  rehabDone: {},                      // "YYYY-MM-DD": true — prehab del día hecho
  fichasHechas: {},                   // "YYYY-MM-DD": [idFicha] — fichas sin registro
};
var st = loadState();
function loadState(){
  /* A4 · si el JSON guardado no se puede leer, NO se arranca encima sin más:
     se guarda el texto original aparte y se avisa. A6 · los valores por
     defecto se clonan en profundidad (antes se compartían listas entre perfiles). */
  let r=null;
  try{ r=localStorage.getItem(KEY); }catch(e){}
  if(r){
    try{
      const o=Object.assign(JSON.parse(JSON.stringify(defaultState)),JSON.parse(r));
      if(!o.rehabDone) o.rehabDone={};
      return o;
    }catch(e){
      try{ localStorage.setItem(KEY+"-ilegible-"+Date.now(), r); }catch(e2){}
      window._estadoIlegible=true;
    }
  }
  return JSON.parse(JSON.stringify(defaultState));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(st)); window._saveFail=false; }
  catch(e){
    /* A4 · antes se tragaba el error: el usuario creía que había guardado */
    if(!window._saveFail){ window._saveFail=true; try{ toast("⚠ No se ha podido guardar. Haz una copia de seguridad cuanto antes."); }catch(e2){} }
  }
}

/* ── fechas ── */
function todayISO(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function dateFromISO(s){ const a=s.split("-"); return new Date(+a[0],+a[1]-1,+a[2]); }
function daysBetween(a,b){ return Math.round((dateFromISO(b)-dateFromISO(a))/864e5); }
function planPos(dISO){ // {week (1-13 | 0 pre | -1 post), dayIdx 0-6}
  const diff = daysBetween(st.planStart, dISO||todayISO());
  if(diff<0) return {week:0, dayIdx:0, pre:-diff};
  const w = Math.floor(diff/7)+1;
  if(w>PLAN.length) return {week:-1, dayIdx:0};
  return {week:w, dayIdx:diff%7};
}
function planDay(week,dayIdx){ const wk=PLAN[week-1]; return wk ? wk.days[dayIdx] : null; }
function DAYNAMES_(){ return nombresDias(); }
var DAYNAMES=new Proxy({},{get:(t,k)=>nombresDias()[k]});

/* ── carga muscular ── */
/* B6 · Carga de sesiones sin ejercicios (registro manual y pacer).
   Antes sumaban cero al mapa muscular y al ACWR. Se estima por tipo y minutos,
   con la misma escala que «Otra actividad». Las sesiones antiguas no se
   reescriben en disco: se calcula al vuelo cuando muscleLoad está vacío. */
const CARGA_TIPO={
  run:{gemelos:.6,cuads:.5,isquios:.5,gluteos:.4,core:.2},
  bici:{cuads:.6,gemelos:.3},
  erg:{espalda:.6,hombros:.4,core:.5,brazos:.4,isquios:.4,cuads:.4},
  fuerza:{cuads:.5,gluteos:.5,isquios:.4,espalda:.4,pecho:.3,hombros:.3,brazos:.3,core:.4,lumbar:.3},
  hib:{cuads:.5,gemelos:.4,isquios:.4,gluteos:.4,espalda:.3,hombros:.3,core:.4,brazos:.2},
};
function perfilCargaTipo(t){
  if(/^(Carrera|Tempo|Eficiencia|Cuesta|Carrera\+Erg)$/.test(t)) return CARGA_TIPO.run;
  if(t==="Bici Z2") return CARGA_TIPO.bici;
  if(t==="Ergómetro") return CARGA_TIPO.erg;
  if(t==="Fuerza") return CARGA_TIPO.fuerza;
  if(/^(Movilidad|Descanso|Otra actividad)$/.test(t)) return null;
  return CARGA_TIPO.hib;
}
function estimarCargaTipo(type,min,rpe){
  const p=perfilCargaTipo(type||""); if(!p||!min) return {};
  const k=0.35*(rpe?Math.max(0.4,rpe/6):1), out={};
  Object.entries(p).forEach(([m,c])=>out[m]=c*min*k);
  return out;
}
function cargaSesion(s){
  if(s.muscleLoad&&Object.keys(s.muscleLoad).length) return s.muscleLoad;
  if(s.mode==="otra") return s.muscleLoad||{};
  return estimarCargaTipo(s.type,s.durationMin,s.rpe);
}
function sessionMuscleLoad(exercises){ // exercises: [{name, totalReps, minutes?}]
  const load={};
  exercises.forEach(e=>{
    const ex=baseEjercicios().find(x=>x.name===e.name); if(!ex) return;
    // en el pacer la carga sale de los minutos, no de "metros" inventados
    if(e.minutes){ Object.entries(ex.m).forEach(([mus,c])=>{ load[mus]=(load[mus]||0)+c*e.minutes*0.35; }); return; }
    const vol=(e.totalReps||0)*(ex.unit==="m"?0.05:ex.unit==="cal"?0.8:ex.unit==="seg"?0.3:ex.unit==="tramos"?20:1);
    Object.entries(ex.m).forEach(([mus,c])=>{ load[mus]=(load[mus]||0)+c*vol*ex.wf; });
  });
  return load;
}
function dailyLoads(){ // {date: {muscle: load}}
  const by={};
  st.sessions.forEach(s=>{ const ml=cargaSesion(s); if(!ml||!Object.keys(ml).length) return; const d=by[s.date]=by[s.date]||{};
    Object.entries(ml).forEach(([m,v])=>d[m]=(d[m]||0)+v); });
  return by;
}
/* B5 · sin 21 días de historial el ratio agudo:crónico no significa nada: la
   primera sesión de alguien nuevo daba ACWR 4 y «sobrecarga». */
function primeraCarga(){ const ds=Object.keys(dailyLoads()).sort(); return ds[0]||null; }
function construyendoBase(dISO){ const p=primeraCarga(); return !p || daysBetween(p,dISO||todayISO())<21; }

function windowLoad(days){ // media diaria por músculo en últimos N días
  const by=dailyLoads(), out={}, today=todayISO();
  MUSCLES.forEach(mu=>out[mu.id]=0);
  Object.entries(by).forEach(([d,ml])=>{ const age=daysBetween(d,today);
    if(age>=0&&age<days) Object.entries(ml).forEach(([m,v])=>out[m]+=v); });
  MUSCLES.forEach(mu=>out[mu.id]/=days);
  return out;
}
function acwr(){ // ratio agudo(7d):crónico(28d) por músculo
  const a=windowLoad(7), c=windowLoad(28), out={};
  MUSCLES.forEach(mu=>{ out[mu.id] = c[mu.id]>0.01 ? a[mu.id]/c[mu.id] : (a[mu.id]>0?1:0); });
  return out;
}
function sorenessToday(){ const c=st.checkins[todayISO()]; return c?c.soreness||{}:{}; }
function muscleStatus(){ // por músculo: {load7, ratio, sore, flag: ok|alto|sobrecarga}
  const a=windowLoad(7), base=construyendoBase(), r=base?{}:acwr(), sore=sorenessToday(), out={};
  const max7=Math.max(0.01,...Object.values(a));
  MUSCLES.forEach(mu=>{
    const rel=a[mu.id]/max7, ratio=base?null:r[mu.id], s=sore[mu.id]||0;
    let flag="ok";
    if(!base&&ratio>1.5&&rel>0.4) flag="sobrecarga"; else if(s>=2||(!base&&rel>0.75)) flag="alto";
    out[mu.id]={rel,ratio,sore:s,flag,base};
  });
  return out;
}

/* ── métricas matinales: VFC, FC reposo y dinamometría ── */
function metricSeries(k,days){ // [{date,v}] más antiguo → más reciente
  const out=[], today=new Date();
  for(let i=(days||90)-1;i>=0;i--){ const d=new Date(today); d.setDate(today.getDate()-i);
    const iso=todayISO(d), c=st.checkins[iso];
    let v=c&&c.metrics?c.metrics[k]:null;
    if(k==="grip"&&c&&c.metrics){ const a=c.metrics.gripL,b=c.metrics.gripR;
      v=(a!=null&&b!=null)?(a+b)/2:(a!=null?a:(b!=null?b:null)); }
    if(v!=null&&!isNaN(v)) out.push({date:iso,v:+v});
  }
  return out;
}
function baseline(k,excludeToday){ // media y desviación de los últimos 7 y 28 registros
  let s=metricSeries(k,60);
  if(excludeToday) s=s.filter(p=>p.date!==todayISO());
  if(s.length<3) return null;
  const last7=s.slice(-7).map(p=>p.v), last28=s.slice(-28).map(p=>p.v);
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const m7=mean(last7), m28=mean(last28);
  let sd=Math.sqrt(mean(last28.map(v=>(v-m28)*(v-m28))))||1;
  // suelo del 5% de la media: si tus datos son muy estables, evita que caídas triviales disparen alarmas
  sd=Math.max(sd, m28*0.05);
  return {m7,m28,sd,n:s.length};
}
function readiness(dISO){
  const iso=dISO||todayISO(), c=st.checkins[iso];
  const mt=(c&&c.metrics)||{};
  const gripToday=(mt.gripL!=null&&mt.gripR!=null)?(mt.gripL+mt.gripR)/2:(mt.gripL!=null?mt.gripL:mt.gripR);
  if(mt.hrv==null&&gripToday==null) return null;
  const bH=baseline("hrv",true), bG=baseline("grip",true);
  const parts=[]; let score=0, n=0;
  if(mt.hrv!=null&&bH){ const z=(mt.hrv-bH.m7)/bH.sd; score+=z; n++;
    parts.push("VFC "+mt.hrv+" ms ("+(z>=0?"+":"")+z.toFixed(1)+" DE sobre tu media de 7 días: "+bH.m7.toFixed(0)+")"); }
  else if(mt.hrv!=null) parts.push("VFC "+mt.hrv+" ms — aún sin línea base (necesito 3+ días)");
  if(gripToday!=null&&bG){ const pct=gripToday/bG.m7*100; score+=(pct-100)/7; n++;
    parts.push("Agarre "+gripToday.toFixed(1)+" kg ("+(pct>=100?"+":"")+(pct-100).toFixed(0)+"% vs tu media)"); }
  else if(gripToday!=null) parts.push("Agarre "+gripToday.toFixed(1)+" kg — construyendo línea base");
  // asimetría
  if(mt.gripL!=null&&mt.gripR!=null){
    const asym=Math.abs(mt.gripL-mt.gripR)/Math.max(mt.gripL,mt.gripR)*100;
    if(asym>15) parts.push("⚠ Asimetría "+asym.toFixed(0)+"% entre manos");
  }
  if(!n) return {c:"#A3A9B3",icon:"📊",t:"Registrando",msg:parts.join(" · ")};
  const z=score/n;
  const r = z>=-0.3 ? {c:"#7BC96F",icon:"🟢",t:"Recuperado",msg:"Puedes ir a por la sesión tal como está planificada."}
        : z>=-1.2 ? {c:"#ffb347",icon:"🟡",t:"Fatiga moderada",msg:"Haz la sesión, pero sin buscar récords. Si es un día de calidad, quédate en el extremo bajo del objetivo."}
        : {c:"#FF6B5A",icon:"🔴",t:"Fatiga alta",msg:"Tu cuerpo pide margen. Cambia la intensidad por Z2, o descansa. Forzar hoy te cuesta los tres días siguientes."};
  r.msg=parts.join(" · ")+". "+r.msg;
  return r;
}

/* ── sRPE y Z2 ── */
function computeSRPE(rpe,min){ return (rpe||0)*(min||0); }

/* ── disciplina (semana actual) ── */
function weekDates(week){ const start=dateFromISO(st.planStart); start.setDate(start.getDate()+(week-1)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return todayISO(d);}); }
function disciplineWeek(week){
  const wk=PLAN[week-1]; if(!wk) return null;
  const dates=weekDates(week), today=todayISO();
  let plannedDue=0, done=0, mobDue=0, mobDone=0, habitPts=0, habitMax=0, checks=0, checksDue=0;
  const hechoDia=(d,day)=>st.sessions.find(x=>x.date===d&&x.mode!=="checkin"&&(x.mode!=="otra"||day.t==="Otra actividad"));
  dates.forEach((d,i)=>{
    const day=wk.days[i], dd=daysBetween(d,today);
    if(dd<0) return;
    /* B7 · hoy solo cuenta si ya está hecho: a primera hora no puede figurar
       como fallado algo que aún te queda todo el día para hacer */
    const esHoy=dd===0, ck=!!(st.checkins[d]&&st.checkins[d]._saved);
    if(!esHoy||ck){ checksDue++; if(ck) checks++;
      const c=st.checkins[d];
      // el denominador de hábitos cuenta todos los días vencidos, con o sin check-in
      habits().forEach(hb=>{ const w=hb.w||1; habitMax+=w; if(c&&(c.habits||{})[hb.id]) habitPts+=w; });
    }
    if(day.t!=="Descanso"&&day.t!=="COMPETICIÓN"){
      const s=hechoDia(d,day);
      if(!esHoy||s){ plannedDue++; if(s) done++;
        if(day.t==="Movilidad"){ mobDue++; if(s&&s.type==="Movilidad") mobDone++; } }
    }
  });
  const adh = plannedDue? done/plannedDue : 1;
  const hab = habitMax? habitPts/habitMax : 0;
  const chk = checksDue? checks/checksDue : 0;
  const score = Math.round((adh*0.5 + hab*0.3 + chk*0.2)*100);
  return {score, adh, hab, chk, done, plannedDue, mobDue, mobDone, dueDays:checksDue};
}
/* B8 · la semana perfecta se premiaba en el guardado del domingo, y podía
   premiarse varias veces o ninguna. Ahora se evalúa la última semana cerrada,
   una sola vez, guardando qué lunes ya se premiaron. */
function revisarSemanaPerfecta(){
  const pos=planPos(); const ult = pos.week===-1 ? PLAN.length : pos.week-1;
  if(ult<1) return;
  st.perfectWeekIds=st.perfectWeekIds||[];
  const lunes=weekDates(ult)[0];
  if(st.perfectWeekIds.includes(lunes)) return;
  const d=disciplineWeek(ult);
  if(d&&d.plannedDue>0&&d.done>=d.plannedDue){
    st.perfectWeekIds.push(lunes); st.perfectWeeks=(st.perfectWeeks||0)+1;

}

/* ═══════════ RADAR (v22) ═══════════
   Antes: sumaba TODAS las sesiones históricas y se saturaba en 99 (Fuerza
   seguía en 99 meses después de la última sesión de fuerza). Ahora cada eje
   mide la carga reciente de esa categoría —últimas 6 semanas, con vida media
   de 14 días— frente a tu propio mejor momento en esa misma categoría. */
const CATS=[
  {id:"metabólico",full:"Metabólico",fam:"hyb",metric:"Estaciones, WODs y circuitos"},
  {id:"ergómetros",full:"Ergómetros",fam:"erg",metric:"Remo · SkiErg · Bike"},
  {id:"running",full:"Running",fam:"run",metric:"Rodajes, series y tempo"},
  {id:"disciplina",full:"Disciplina",fam:"race",metric:"Plan + hábitos + check-ins · 4 semanas"},
  {id:"movilidad",full:"Movilidad",fam:"rec",metric:"Último test + práctica de 28 días"},
  {id:"fuerza",full:"Fuerza",fam:"str",metric:"Fuerza con carga"},
  {id:"core",full:"Core",fam:"core",metric:"Planchas, dead bug, antirrotación…"},
];
const CARGA_CATS=["metabólico","ergómetros","running","fuerza","core"];
const EXCAT2CAT={"metabólico":"metabólico","hyrox":"metabólico","fuerza":"fuerza","core":"core","ergómetros":"ergómetros","running":"running"};
const TIPO2CATS={
  "Carrera":["running"],"Tempo":["running"],"Eficiencia":["running"],"Cuesta":["running"],"Carrera+Erg":["running","ergómetros"],
  "Ergómetro":["ergómetros"],"Bici Z2":["ergómetros"],
  "Fuerza":["fuerza"],"Fuerza+Metab":["fuerza","metabólico"],
  "Metabólico":["metabólico"],"Playa":["metabólico"],"Activación":["metabólico"],
  "Cluster HYROX":["metabólico","running"],"COMPETICIÓN":["metabólico","running"],"XYBRID":["metabólico","running"],
  "Comp. Running":["running","metabólico"],"Umbral+HYROX":["running","metabólico"],
  "Umbral Híbrido":["running","ergómetros"],"Test":["running","ergómetros"],
};
function cargaRadar(s){ return s.srpe>0 ? s.srpe : (s.durationMin ? s.durationMin*5 : 150); }
/* reparto de la carga de una sesión entre categorías */
function dosisSesion(s){
  if(s.mode==="otra") return {};
  const carga=cargaRadar(s), cnt={}; let n=0;
  (s.exercises||[]).forEach(e=>{ const ex=baseEjercicios().find(x=>x.name===e.name);
    const c=ex&&EXCAT2CAT[ex.cat]; if(c){ cnt[c]=(cnt[c]||0)+1; n++; } });
  const out={};
  if(n){ Object.entries(cnt).forEach(([c,k])=>out[c]=carga*k/n); return out; }
  const cs=TIPO2CATS[s.type]||[];
  cs.forEach(c=>out[c]=carga/cs.length);
  return out;
}
function sessionCats(s){ return Object.keys(dosisSesion(s)); }
function _mediana(a){ if(!a.length) return 0; const b=a.slice().sort((x,y)=>x-y), m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }
/* Serie diaria de L7 por categoría desde la primera sesión hasta hoy. Cachea
   por render: el pico recorre todo el historial día a día. */
let _radarCache=null;
function radarSeries(){
  const key=st.sessions.length+"|"+todayISO()+"|"+(st.sessions.length?st.sessions[st.sessions.length-1].id:0);
  if(_radarCache&&_radarCache.key===key) return _radarCache;
  const ses=st.sessions.filter(s=>s.date&&s.mode!=="otra").map(s=>({d:s.date,dos:dosisSesion(s)}));
  const hoy=todayISO();
  const out={key, cats:{}, first:null, days:[], med:_mediana(st.sessions.filter(s=>s.mode!=="otra").map(cargaRadar))};
  if(!ses.length){ _radarCache=out; return out; }
  const first=ses.map(s=>s.d).sort()[0]; out.first=first;
  const N=daysBetween(first,hoy)+1;
  const start=dateFromISO(first);
  for(let i=0;i<N;i++){ const d=new Date(start); d.setDate(start.getDate()+i); out.days.push(todayISO(d)); }
  const idx={}; out.days.forEach((d,i)=>idx[d]=i);
  CARGA_CATS.forEach(c=>{
    // dosis por día
    const dia=new Array(N).fill(0);
    ses.forEach(s=>{ const v=s.dos[c]; if(v&&idx[s.d]!=null) dia[idx[s.d]]+=v; });
    // L(día) = Σ dosis × 0,5^(edad/14), solo los últimos 42 días
    const L=new Array(N).fill(0);
    for(let i=0;i<N;i++){ let sum=0; for(let a=0;a<42&&i-a>=0;a++){ const v=dia[i-a]; if(v) sum+=v*Math.pow(0.5,a/14); } L[i]=sum; }
    // L7 = media de L en los últimos 7 días
    const L7=new Array(N).fill(0); let pico=0, pk=new Array(N).fill(0);
    for(let i=0;i<N;i++){ let s=0,k=0; for(let a=0;a<7&&i-a>=0;a++){ s+=L[i-a]; k++; } L7[i]=s/7; pico=Math.max(pico,L7[i]); pk[i]=pico; }
    // última sesión de esa categoría
    let ult=null; for(let i=N-1;i>=0;i--) if(dia[i]>0){ ult=out.days[i]; break; }
    out.cats[c]={L7,pk,ult};
  });
  _radarCache=out; return out;
}
function valorCarga(c,dISO){
  const R=radarSeries(); if(!R.first) return null;
  const i=daysBetween(R.first,dISO||todayISO()); if(i<0) return null;
  const C=R.cats[c]; const j=Math.min(i,C.L7.length-1);
  const ref=Math.max(C.pk[j], 3*R.med);
  if(!(ref>0)) return null;
  const conf=Math.min(1,(i+1)/28);
  return Math.round(100*Math.min(1,C.L7[j]/ref)*conf);
}
function confianzaRadar(dISO){ const R=radarSeries(); if(!R.first) return 0; return Math.min(1,(daysBetween(R.first,dISO||todayISO())+1)/28); }
function valorDisciplina(dISO){
  const d=dISO||todayISO(); const p=planPos(d); const cur = p.week===-1 ? PLAN.length+1 : p.week;
  if(cur<1) return null;
  let s=0,w=0;
  for(let k=Math.max(1,cur-3);k<=Math.min(cur,PLAN.length);k++){
    const r=disciplineWeek(k); if(!r) continue;
    const peso = k===cur ? (r.dueDays||0)/7 : 1;
    if(peso>0){ s+=r.score*peso; w+=peso; }
  }
  return w? Math.round(s/w) : null;
}
function _isoTest(m){
  if(m.iso) return m.iso;
  const M={ene:0,jan:0,feb:1,mar:2,abr:3,apr:3,may:4,jun:5,jul:6,ago:7,aug:7,sep:8,oct:9,nov:10,dic:11,dec:11};
  const x=String(m.date||"").toLowerCase().match(/(\d{1,2})\s*([a-zñ]{3})/); if(!x||M[x[2]]==null) return null;
  const hoy=new Date(); let d=new Date(hoy.getFullYear(),M[x[2]],+x[1]); if(d>hoy) d.setFullYear(d.getFullYear()-1);
  return todayISO(d);
}
function valorMovilidad(dISO){
  const D=dISO||todayISO();
  const tests=st.mobHistory.filter(m=>{ const i=_isoTest(m); return !i||i<=D; });
  const last=tests[tests.length-1];
  let practica=0;
  for(let a=0;a<28;a++){ const d=new Date(dateFromISO(D)); d.setDate(d.getDate()-a); const iso=todayISO(d);
    if(st.rehabDone[iso]||(st.fichasHechas&&(st.fichasHechas[iso]||[]).length)||st.sessions.some(s=>s.date===iso&&s.type==="Movilidad")) practica++; }
  const vP=Math.min(1,practica/12)*100;
  if(!last){ return practica? Math.round(vP) : null; }
  const v=Object.values(last.scores||{}); const vT=v.length?v.reduce((a,b)=>a+b,0)/v.length*20:0;
  const iso=_isoTest(last), edad=iso?daysBetween(iso,D):99;
  const wT = edad>42 ? 0.25 : 0.5;
  return Math.round(vT*wT + vP*(1-wT));
}
function catScore(catId,dISO){
  if(catId==="movilidad") return valorMovilidad(dISO);
  if(catId==="disciplina") return valorDisciplina(dISO);
  return valorCarga(catId,dISO);
}
function ultimaSesionCat(c){ const R=radarSeries(); return R.cats[c]?R.cats[c].ult:null; }
function dekaScore(){ const s=CATS.map(c=>catScore(c.id)).filter(x=>x!==null); return s.length?s.reduce((a,b)=>a+b,0)/s.length:0; }

/* ── audio: onda cuadrada + armónico + compresor = mucho más audible sobre música ── */
let audioCtx=null, masterGain=null, comp=null;
function vol(){ return (st.audioVol==null?4:st.audioVol)/4; } // 1–8 → 0.25–2
function audioInit(){
  if(audioCtx) return audioCtx;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    comp=audioCtx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=6; comp.ratio.value=12; comp.attack.value=0.002; comp.release.value=0.1;
    masterGain=audioCtx.createGain(); masterGain.gain.value=1;
    comp.connect(masterGain); masterGain.connect(audioCtx.destination);
  }catch(e){}
  return audioCtx;
}
function beep(freq,dur){ freq=freq||880; dur=Math.max(dur||0.06,0.08);
  try{
    audioInit(); if(!audioCtx) return;
    if(audioCtx.state==="suspended") audioCtx.resume();
    const t=audioCtx.currentTime, g=audioCtx.createGain(), amp=Math.min(1.6,0.85*vol());
    g.connect(comp);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(amp,t+0.008);
    g.gain.setValueAtTime(amp,t+dur*0.6);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    // fundamental cuadrada (rica en armónicos → se cuela entre la música)
    const o1=audioCtx.createOscillator(); o1.type="square"; o1.frequency.value=freq; o1.connect(g);
    // octava superior a menor volumen, para el brillo
    const g2=audioCtx.createGain(); g2.gain.value=0.45; g2.connect(g);
    const o2=audioCtx.createOscillator(); o2.type="square"; o2.frequency.value=freq*2; o2.connect(g2);
    o1.start(t); o2.start(t); o1.stop(t+dur); o2.stop(t+dur);
  }catch(e){} }
function testAudio(){ audioInit(); beep(880,0.12); setTimeout(()=>beep(1200,0.18),220); setTimeout(()=>say("Quince segundos. Aprieta."),650); }

let curTab="hoy";

  aplicarEscala();
  $("nav").innerHTML=TABS.map(([id,ic,lb])=>'<button class="nb'+(curTab===id?" active":"")+'" onclick="nav(\''+id+'\')" aria-label="'+lb+'">'+icon(ic)+'<span>'+lb+'</span></button>').join("");
  const app=$("app");

  const scr={hoy:renderHoy,plan:renderPlan,cuerpo:renderCuerpo,progreso:renderProgreso,mas:renderMas}[curTab];

/* ═══════════════════ PANTALLA: HOY ═══════════════════ */
/* ═══════════════════ PANTALLA: HOY (D2) ═══════════════════
   La sesión de hoy manda: arriba, grande, con un solo botón principal. */
function duracionDe(txt){ const m=String(txt||"").match(/(\d{2,3})\s*min/i); return m?m[1]+" min":""; }
function descansoDe(txt){ const t=String(txt||""); const m=t.match(/R(\d+)(['"])/);
  if(m) return m[2]==="'"? "Descanso "+m[1]+" min" : "Descanso "+m[1]+" s";
  return /continuo|sin pausas/i.test(t)?"Continuo":""; }
function cabecera(der){
  return '<div class="hdr"><div><div class="logo">'+esc(appLogo())+'</div>'+(PROFILE.name?'<div class="who" data-notr>'+esc(PROFILE.name)+'</div>':'')+'</div><div class="slbl">'+der+'</div></div>';
}
function avisosHoy(el){
  if(window._estadoIlegible) el.appendChild(h('<div class="aviso d"><b>No he podido leer tus datos guardados.</b> Los he apartado sin borrarlos y la app ha arrancado vacía. No restaures ni registres nada todavía: avisa a quien te preparó el plan.</div>'));
  if(window._saveFail) el.appendChild(h('<div class="aviso d"><b>No se está guardando.</b> El móvil no deja escribir los datos. Haz una copia de seguridad ahora (Más → Copia de seguridad).</div>'));
  if(st._fb&&!$("overlay").classList.contains("open")){
    const c=h('<div class="aviso w"><b>Tienes una sesión sin guardar</b>'+(st._fb.durationMin?' · '+st._fb.durationMin+' min':'')+'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn2" style="margin:0;flex:1" onclick="showFeedback()">Guardarla</button><button class="btn2 btn-danger" style="margin:0;flex:1" onclick="descartarFb()">Descartar</button></div></div>');
    el.appendChild(c);
  }
  const dc=diasDesdeCopia();
  if(st.sessions.length>=5&&(dc==null||dc>30)) el.appendChild(h('<div class="aviso w" style="display:flex;align-items:center;gap:10px"><span style="flex:1">'+(dc==null?'Aún no has guardado ninguna copia de tus datos.':'Tu última copia es de hace '+dc+' días.')+'</span><button class="btn3 sel" onclick="openData()">Hacer copia</button></div>'));
}
function renderHoy(){
  const pos=planPos(), t=todayISO(), day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  const wk=pos.week>=1?PLAN[pos.week-1]:null;
  const meso=wk?(mesos().find(m=>m.id===wk.m)||{}):null;
  const disc=pos.week>=1?disciplineWeek(pos.week):null;
  const checkinDone=!!(st.checkins[t]&&st.checkins[t]._saved);
  const sessToday=st.sessions.filter(s=>s.date===t);
  const raceInfo=nextRace();
  const el=h('<div class="screen active"></div>');
  const hoyTxt=DAYNAMES[(new Date().getDay()+6)%7]+' '+new Date().getDate();
  el.appendChild(h(cabecera('<b>'+hoyTxt+'</b><br>'+(pos.week>=1?L('Semana '+pos.week+' de '+PLAN.length,'Week '+pos.week+' of '+PLAN.length):pos.week===0?'Antes del plan':'Plan terminado'))));
  avisosHoy(el);

  // 2 · la sesión de hoy
  if(pos.week===0){
    el.appendChild(h('<div class="card" style="text-align:center;padding:24px"><div class="big" style="font-size:3rem;color:var(--lime)">'+pos.pre+'</div><div style="font-size:.875rem;letter-spacing:1px;color:var(--muted);margin-top:4px">DÍAS PARA EMPEZAR EL PLAN</div><div class="dim" style="font-size:.9375rem;margin-top:10px"><span data-notr>'+esc(planLabel())+'</span> · '+PLAN.length+' semanas · empieza el lunes '+st.planStart.slice(8,10)+'/'+st.planStart.slice(5,7)+'</div></div>'));
  } else if(pos.week===-1){
    /* B3 · fin de plan: no se repiten semanas solas; se ofrece qué hacer */
    el.appendChild(h('<div class="card"><div class="ctitle" style="font-size:1.25rem">🏁 Plan terminado</div><div style="font-size:1rem;line-height:1.55;color:var(--text-2);margin-bottom:14px">Has llegado al final de <span data-notr>'+esc(planLabel())+'</span>. Mientras llega el siguiente plan, puedes seguir entrenando y registrando:</div>'+
      '<button class="btn" onclick="openFavs()">⭐ PLANTILLAS Y FAVORITOS</button><button class="btn2" onclick="openGenerator()">⚙ Generar un WOD</button><button class="btn2" style="margin:0" onclick="openManualLog()">✓ Registrar una sesión</button></div>'));
  } else if(day){
    const dt=DTYPE[day.t]||{mode:"wod"}, f=famTipo(day.t);
    const dur=duracionDe(day.main), desc=descansoDe(day.main);
    const card=h('<div class="card today"><div class="stripe" style="background:'+f.c+'"></div><div class="in"></div></div>');
    const inn=card.querySelector(".in");
    inn.appendChild(h('<div class="row" style="gap:8px">'+tagTipo(day.t)+(meso&&meso.title?'<span class="dim" data-notr style="font-size:.8125rem;text-align:right">'+esc(meso.title)+'</span>':'')+'</div>'));
    inn.appendChild(h('<div class="ttl">'+esc(day.t)+(dur?' · '+esc(dur):'')+'</div>'));
    if(day.flag) inn.appendChild(h('<div class="tagz" style="background:rgba(255,122,168,.15);color:var(--f-race);margin-bottom:8px">★ <span data-notr>'+esc(day.flag)+'</span></div>'));
    if(/XYBRID/i.test((day.main||"")+(day.sub||""))) inn.appendChild(h('<button class="btn3" style="margin-bottom:8px" onclick="openHelp(\'xybrid\')">🏁 Ver estaciones Xybrid</button>'));
    if(day.pre) inn.appendChild(h('<div class="pre">▲ <span data-notr>'+esc(day.pre)+'</span></div>'));
    inn.appendChild(h('<div class="txt" data-notr>'+esc(day.main)+'</div>'));
    if(day.sub) inn.appendChild(h('<div class="sub" data-notr>'+esc(day.sub)+'</div>'));
    if(day.fc||desc) inn.appendChild(h('<div class="chips" style="margin-top:10px">'+(day.fc?'<span class="chip">'+icon("heart")+'<span data-notr>'+esc(day.fc)+'</span></span>':'')+(desc?'<span class="chip">'+icon("clock")+esc(desc)+'</span>':'')+'</div>'));
    if(sessToday.length) inn.appendChild(h('<div style="margin-top:12px;font-size:.9375rem;color:var(--ok);font-weight:600">✓ Registrado hoy: '+sessToday.map(s=>esc(s.type)).join(", ")+'</div>'));
    const cta=h('<div style="margin-top:14px"></div>');
    const yaLaHice='<button class="btn2" onclick="yaLaHice()">✓ Ya la hice · registrar</button>';
    if(dt.mode==="wod"){
      const leidos=leerSesionDelPlan(day.main);
      if(leidos.length){
        cta.appendChild(h('<button class="btn xl" onclick="lanzarSesionDelPlan()">▶ HACER LA SESIÓN</button>'));
        cta.appendChild(h('<div class="dim" data-notr style="font-size:.8125rem;text-align:center;margin:-4px 0 10px;line-height:1.5">'+leidos.map(x=>esc(x.name)+' '+fmtPresc(x)).join(' · ')+'</div>'));
      } else cta.appendChild(h('<button class="btn xl" onclick="openGenerator(\'plan\')">▶ WOD CON METRÓNOMO</button>'));
      cta.appendChild(h(yaLaHice));
      if(leidos.length) cta.appendChild(h('<button class="btn3" style="width:100%;border:none" onclick="openGenerator()">⚙ Prefiero generar otro WOD</button>'));
    } else if(dt.mode==="pacer"){
      cta.appendChild(h('<button class="btn xl" onclick="openPacer('+(dt.z2?'true':'false')+')">▶ PACER + CRONÓMETRO</button>'));
      cta.appendChild(h(yaLaHice));
    } else if(dt.mode==="mob"){
      cta.appendChild(h('<button class="btn xl" onclick="abrirFichas()">'+esc(mobBtn())+'</button>'));
      cta.appendChild(h('<button class="btn2" onclick="startMobilitySession()">▶ Sesión rápida (20\')</button>'));
    } else if(dt.mode==="otra"){
      cta.appendChild(h('<button class="btn xl" onclick="openOtra()">✓ REGISTRAR ACTIVIDAD</button>'));
    } else if(dt.mode==="race"){
      cta.appendChild(h('<div class="big" style="text-align:center;font-size:1.75rem;padding:4px 0 10px;color:var(--f-race)">🏁 DÍA DE COMPETICIÓN</div>'));
      cta.appendChild(h('<button class="btn xl" onclick="yaLaHice()">✓ REGISTRAR LA CARRERA</button>'));
    } else {
      cta.appendChild(h('<div class="dim" style="text-align:center;font-size:.9375rem;padding:4px 0">Día de descanso. El check-in también suma.</div>'));
    }
    inn.appendChild(cta);
    /* el prehab se marca aparte: se hace en otro momento y es lo que más se olvida */
    if(day.rehab){
      const hecho=!!st.rehabDone[t];
      inn.appendChild(h('<div class="rehab"><div class="t">'+icon("rehab")+' '+esc(rehabLabel(false).replace(/^He hecho (el|la|los|las) /i,"").toUpperCase())+'</div><div class="x" data-notr>'+esc(day.rehab)+'</div>'+
        '<button class="btn2'+(hecho?' on':'')+'" onclick="marcarRehab()">'+(hecho?'✓ '+rehabLabel(true)+(rehabStreak()>1?' · '+rehabStreak()+' días seguidos':' · toca para deshacer'):esc(rehabLabel(false)))+'</button></div>'));
    }
    el.appendChild(card);
  }

  // 3 · recuperación
  const rd=readiness();
  if(rd) el.appendChild(h('<div class="card" style="border-color:'+rd.c+'66"><div style="font-size:1rem;font-weight:700;color:'+rd.c+'">'+rd.icon+' '+rd.t+'</div><div style="font-size:.875rem;color:var(--text-2);line-height:1.55;margin-top:4px">'+esc(rd.msg)+'</div></div>'));

  // 4 · esta semana
  const ckDates=ckWeekDates(), ckDone=ckDates.filter(d=>st.checkins[d]&&st.checkins[d]._saved).length;
  const ckCard=h('<div class="card"></div>');
  const sessWeek=st.sessions.filter(s=>ckDates.includes(s.date)).length;
  ckCard.appendChild(h('<div class="row" style="margin-bottom:12px"><div class="ctitle" style="margin:0">Esta semana</div><span class="dim" style="font-size:.8125rem">'+L(sessWeek+' sesiones · '+ckDone+' de 7 check-ins',sessWeek+' sessions · '+ckDone+' of 7 check-ins')+'</span></div>'));
  const strip=h('<div style="display:flex;gap:4px;justify-content:space-between"></div>');
  const dias=PROFILE.lang==="en"?["M","T","W","T","F","S","S"]:["L","M","X","J","V","S","D"];
  ckDates.forEach((d,i)=>{
    const fut=daysBetween(t,d)>0, done=!!(st.checkins[d]&&st.checkins[d]._saved), isToday=d===t;
    const cols=st.sessions.filter(x=>x.date===d).map(x=>famTipo(x.type).c);
    let dotStyle='';
    if(cols.length===1) dotStyle='background:'+cols[0]+';border-color:'+cols[0]+';color:#0D0F12;';
    else if(cols.length>1) dotStyle='background:linear-gradient(135deg,'+cols[0]+' 50%,'+cols[1]+' 50%);border-color:transparent;color:#0D0F12;';
    else if(done) dotStyle='border-color:var(--ok);color:var(--ok);';
    const col=h('<button style="flex:1;background:none;border:none;font-family:inherit;color:inherit;text-align:center;padding:0;'+(fut?'opacity:.35;':'cursor:pointer;')+'" '+(fut?'disabled':'')+' aria-label="Check-in '+d+'"><div style="font-size:.75rem;font-weight:600;color:'+(isToday?'var(--lime)':'var(--muted)')+';margin-bottom:5px">'+dias[i]+'</div><div class="dotday'+(isToday?' today':'')+'" style="margin:0 auto;'+dotStyle+'">'+(done&&!cols.length?'✓':+d.slice(8,10))+'</div></button>');
    if(!fut) col.onclick=()=>openCheckin(d);
    strip.appendChild(col);
  });
  ckCard.appendChild(strip);
  if(!checkinDone) ckCard.appendChild(h('<button class="btn2" style="margin:14px 0 0;color:var(--warn);border-color:rgba(255,179,71,.45)" onclick="openCheckin()">☀️ Hacer el check-in de hoy</button>'));
  el.appendChild(ckCard);

  // 5 · puntos, racha, próxima carrera
  const rk=checkinStreak();
  el.appendChild(h('<div class="card stat3"><div><div class="v" style="color:var(--lime)">'+st.points+'</div><div class="l">puntos</div></div><div><div class="v" style="color:var(--warn)">'+rk+'</div><div class="l">'+L((rk===1?'día':'días')+' de racha',(rk===1?'day':'days')+' streak')+'</div></div><div style="flex:1.4"><div class="v" style="color:var(--f-run)">'+(raceInfo?(raceInfo.days===0?'HOY':raceInfo.days):'—')+'</div><div class="l">'+(raceInfo?(raceInfo.days?L(raceInfo.days===1?'día':'días',raceInfo.days===1?'day':'days')+' · ':'')+'<span data-notr>'+esc(raceInfo.name)+'</span>':'sin carrera')+'</div></div></div>'));

  // 6 · disciplina
  if(disc){
    const c=disc.score>=80?"var(--ok)":disc.score>=50?"var(--warn)":"var(--danger)";
    const dcard=h('<div class="card"></div>');
    dcard.appendChild(h('<div class="row"><div class="ctitle" style="margin:0">Disciplina · semana '+pos.week+'</div>'+helpBtn("disciplina")+'</div>'));
    dcard.appendChild(h('<div class="row" style="margin:10px 0 8px;align-items:flex-end"><span class="big" style="font-size:2.5rem;color:'+c+'">'+disc.score+'</span><span class="dim" style="font-size:.875rem;text-align:right;line-height:1.5">'+L(disc.done+' de '+disc.plannedDue+' entrenos del plan',disc.done+' of '+disc.plannedDue+' planned sessions')+'<br>'+Math.round(disc.hab*100)+L('% hábitos · ','% habits · ')+Math.round(disc.chk*100)+'% check-ins</span></div>'));
    dcard.appendChild(h('<div class="hbar"><div style="width:'+disc.score+'%;background:'+c+'"></div></div>'));
    if(disc.mobDue>disc.mobDone) dcard.appendChild(h('<div style="font-size:.875rem;color:var(--warn);margin-top:10px">⚠ Movilidad del plan sin hacer: resta disciplina</div>'));
    el.appendChild(dcard);
  }

  // 7 · control de carga
  const ms=muscleStatus();
  const over=MUSCLES.filter(m=>ms[m.id].flag==="sobrecarga");
  const sore=MUSCLES.filter(m=>ms[m.id].sore>=2);
  if(over.length||sore.length){
    el.appendChild(h('<div class="card" style="border-color:rgba(255,107,90,.5)"><div class="ctitle" style="color:var(--danger)">⚠ Control de carga</div>'+
      (over.length?'<div style="font-size:.9375rem;margin-bottom:6px">Sobrecarga (ACWR &gt; 1,5): <b style="color:var(--danger)">'+over.map(m=>m.name).join(", ")+'</b></div>':'')+
      (sore.length?'<div style="font-size:.9375rem">Agujetas fuertes hoy: <b style="color:var(--warn)">'+sore.map(m=>m.name).join(", ")+'</b></div>':'')+
      '<div class="dim" style="font-size:.875rem;margin-top:8px">El generador evitará cargar estas zonas.</div></div>'));
  }

  // 8 · otras opciones
  el.appendChild(h('<div class="ctitle mini" style="margin-top:4px">Otras opciones</div>'));
  el.appendChild(h('<div class="opts">'+
    '<button class="btn2" onclick="openGenerator()">⚙ Generar</button>'+
    '<button class="btn2" onclick="openBuilder()">✏️ Diseñar</button>'+
    '<button class="btn2" onclick="openFavs()">⭐ Favoritos'+(st.favorites.length?' ('+st.favorites.length+')':'')+'</button>'+
    '<button class="btn2" onclick="openPacer(false)">🔔 Pacer</button>'+
    '<button class="btn2" onclick="openRefs()">📊 Ritmos y zonas</button>'+
    '<button class="btn2" onclick="openOtra()">🏃 Otra actividad</button></div>'));
  return el;
}
/* ── S1 · «Ya la hice»: registrar la sesión del plan con un toque ──────────
   Guarda la sesión con el tipo del día y una duración propuesta (la que se lea
   del texto, si no 45) y solo pide el esfuerzo. Todo se puede corregir
   después en Más → Historial. */
function yaLaHice(){
  const pos=planPos(), day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  if(!day||day.t==="Descanso"){ openManualLog(); return; }
  const min=parseInt(duracionDe(day.main))||45;
  window._s1={type:day.t,min,rpe:null};
  s1Render();
}
function s1Render(){
  const s=window._s1;
  let html='<div class="ctitle">✓ Registrar la sesión de hoy</div>';
  html+='<div style="margin-bottom:12px">'+tagTipo(s.type)+'</div>';
  html+='<div class="lbl">Duración</div><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><button class="btn3" onclick="window._s1.min=Math.max(5,window._s1.min-5);s1Render()">−5</button><input type="number" inputmode="numeric" id="s1min" value="'+s.min+'" onchange="window._s1.min=parseInt(this.value)||window._s1.min" style="text-align:center;font-size:1.25rem;font-weight:700"><span class="dim">min</span><button class="btn3" onclick="window._s1.min+=5;s1Render()">+5</button></div>';
  html+='<div class="lbl">¿Cuánto te ha costado?</div>'+selectorEsfuerzo(s.rpe,'s1Rpe');
  html+='<button class="btn xl" style="margin-top:14px" '+(s.rpe?'':'disabled')+' onclick="s1Guardar()">GUARDAR</button>';
  html+='<button class="btn2" style="margin:0" onclick="closeOverlay();openManualLog()">Más detalles (FC, notas…)</button>';
  overlay(html,{modal:false});
}
function s1Rpe(v){ const i=$("s1min"); if(i) window._s1.min=parseInt(i.value)||window._s1.min; window._s1.rpe=v; s1Render(); }
function s1Guardar(){
  const s=window._s1; if(!s||!s.rpe) return;
  const i=$("s1min"); if(i) s.min=parseInt(i.value)||s.min;
  st._fb={results:[],durationMin:s.min,mode:"manual",type:s.type,rpe:s.rpe,feelings:[],notes:""};
  window._s1=null; saveSession();
}
/* el selector de esfuerzo: escala 1–10 en dos filas (o tres caras en modo sencillo) */
function selectorEsfuerzo(rpe,fn){
  if(PROFILE.simple) return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+
    [[3,"🙂","Fácil"],[6,"😐","Normal"],[8,"😮‍💨","Duro"]].map(([v,e,l])=>'<button class="btn3'+(rpe===v?' sel':'')+'" style="min-height:72px;font-size:1rem" onclick="'+fn+'('+v+')"><div style="font-size:1.75rem">'+e+'</div>'+l+'</button>').join("")+'</div>';
  let h2='<div class="grid5">'; for(let i=1;i<=10;i++) h2+='<button class="btn3'+(rpe===i?' sel':'')+'" onclick="'+fn+'('+i+')">'+i+'</button>';
  return h2+'</div><div class="row dim" style="font-size:.75rem;margin-top:4px"><span>muy suave</span><span>a tope</span></div>';
}

/* Prehab del día: se marca solo, sin pasar por el registro de sesiones.
   No entra en sRPE ni en ACWR a propósito — isométricos y movilidad no son
   carga de entrenamiento, y contarlos como tal ensuciaría el ratio. */
function rehabLabel(hecho){
  const n=PROFILE.rehabLabel||"prehab";
  return hecho ? (n.charAt(0).toUpperCase()+n.slice(1))+" hecho hoy" : "He hecho "+(PROFILE.rehabArt||"el")+" "+n+" de hoy";
}
function marcarRehab(){
  const t=todayISO();
  if(st.rehabDone[t]){ delete st.rehabDone[t]; addPoints(-PTS.rehab,"prehab deshecho"); toast("Prehab desmarcado"); }
  else { st.rehabDone[t]=true; addPoints(PTS.rehab,"prehab del día"); toast("🔧 Prehab hecho — bien ahí"); }
  save(); render();
}
function rehabStreak(){
  let n=0; const d=new Date();
  for(;;){ const iso=todayISO(d); if(!st.rehabDone[iso]) break; n++; d.setDate(d.getDate()-1); }
  return n;
}
function openRefs(){
  const tbl=(t,rows,col)=>'<div class="ctitle mini" style="margin:14px 0 6px">'+t+'</div>'+rows.map(([a,b])=>
    '<div class="row" data-notr style="padding:8px 0;border-bottom:1px solid var(--line);gap:10px"><span style="font-size:0.875rem">'+esc(a)+'</span><span class="mono" style="font-size:0.875rem;color:'+col+';text-align:right">'+esc(b)+'</span></div>').join("");
  overlay('<div class="ctitle">📊 Mis ritmos y zonas</div>'+
    '<div style="font-size:0.875rem;color:var(--muted);line-height:1.5">'+(REFS.note?'<span data-notr>'+esc(REFS.note)+'</span>':'Tus referencias. Úsalas para fijar el objetivo de cada serie en el pacer.')+'</div>'+
    tbl("Tests",REFS.tests||[],"var(--lime)")+
    tbl("Ritmos de carrera",REFS.run||[],"var(--f-run)")+
    tbl("Ergómetros",REFS.erg||[],"var(--f-erg)")+
    tbl("Objetivos",REFS.goals||[],"var(--f-hyb)")+
    '<button class="btn2" style="margin-top:14px" onclick="closeOverlay()">Cerrar</button>');
}
function nextRace(){
  const t=todayISO();
  const races=(PROFILE.races||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  for(const r of races){ const d=daysBetween(t,r.date); if(d>=0) return {name:r.name,days:d}; }
  return null;
}

/* ═══════════════════ PANTALLA: PLAN ═══════════════════ */
let planMeso=null;
function renderPlan(){
  const pos=planPos();
  if(planMeso===null) planMeso=pos.week>=1?PLAN[pos.week-1].m:(mesos()[0]||{id:1}).id;
  const el=h('<div class="screen active"></div>');
  el.appendChild(h(cabecera('Plan<br><b data-notr>'+esc(planLabel())+'</b>')));
  const mnav=h('<div class="chips" style="margin-bottom:12px"></div>');
  mesos().forEach(m=>{ const b=h('<button class="btn3'+(m.id===planMeso?' sel':'')+'" style="'+(m.id===planMeso?'border-color:'+m.color+';color:'+m.color+';background:'+m.color+'1F':'')+'">'+esc(m.label)+' · '+esc(m.sub)+'</button>');

  if(rel<=0.02) return "#2A313B";
  const hue=Math.max(0,120-rel*120);
  return "hsl("+hue+",70%,"+(30+rel*15)+"%)";
}

/* ── check-in (editable cualquier día de la semana en curso) ── */
function ckWeekDates(){ // lun–dom de la semana natural actual
  const now=new Date(); const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return todayISO(d); });
}
function openCheckin(dateISO){
  const t=dateISO||st._ckDate||todayISO();
  /* C4 · se trabaja sobre un borrador copiado: nada se escribe en el check-in
     guardado hasta pulsar GUARDAR (antes, abrir y tocar ya lo modificaba) */
  if(st._ckDate!==t||!st._ckDraft){ st._ckDraft=JSON.parse(JSON.stringify(st.checkins[t]||{soreness:{},sleep:null,habits:{}})); }
  st._ckDate=t;
  const c=st._ckDraft; c.soreness=c.soreness||{}; c.habits=c.habits||{};
  const today=todayISO(), dias=PROFILE.lang==="en"?["M","T","W","T","F","S","S"]:["L","M","X","J","V","S","D"];
  let html='<div class="ctitle">☀️ Check-in — '+(t===today?"hoy":DAYNAMES[(dateFromISO(t).getDay()+6)%7])+' '+t.slice(8,10)+'/'+t.slice(5,7)+'</div>';
  // tira de días de la semana
  html+='<div style="display:flex;gap:5px;margin-bottom:14px">';
  ckWeekDates().forEach((d,i)=>{
    const fut=daysBetween(today,d)>0, done=!!(st.checkins[d]&&st.checkins[d]._saved), cur=d===t;

  });
  html+='</div>';

  const mt=c.metrics||{};

  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">'+
    [["hrv","VFC (ms)","rMSSD del reloj"],["rhr","FC reposo"," ppm"],["gripL","Agarre izq (kg)","dinamómetro"],["gripR","Agarre der (kg)","dinamómetro"]]
    .map(([k,lb])=>'<div><div class="dim" style="font-size:0.75rem;margin-bottom:3px">'+lb+'</div><input type="number" inputmode="decimal" id="mt_'+k+'" value="'+(mt[k]!=null?mt[k]:"")+'" onchange="ckMetric(\''+k+'\',this.value)" placeholder="—"></div>').join("")+'</div>';

    html+='</span></div>';
  });

function ckMetric(k,v){ const d=st._ckDraft; d.metrics=d.metrics||{};
  const n=parseFloat(String(v).replace(",",".")); d.metrics[k]=isNaN(n)?null:n; }
function ckSore(m,v){ ckKeepMetrics(); st._ckDraft.soreness[m]=v; ckPersist(); }
function ckKeepMetrics(){ const d=st._ckDraft; d.metrics=d.metrics||{};
  ["hrv","rhr","gripL","gripR"].forEach(k=>{ const el=$("mt_"+k); if(el){ const n=parseFloat(String(el.value).replace(",",".")); d.metrics[k]=isNaN(n)?null:n; } }); }
function ckSleep(v){ ckKeepMetrics(); st._ckDraft.sleep=v; ckPersist(); }
function ckHabit(id){ ckKeepMetrics(); st._ckDraft.habits[id]=!st._ckDraft.habits[id]; ckPersist(); }
function ckPersist(){ openCheckin(st._ckDate); }
function saveCheckin(){
  ckKeepMetrics();
  const t=st._ckDate||todayISO(), prev=st.checkins[t];
  const d=st._ckDraft; d._saved=true;
  if(t===todayISO()){
    /* C4 · al editar el check-in de hoy se ajusta la diferencia de puntos de
       hábitos; antes se sumaban solo la primera vez y nunca se restaban */
    const hw=habits().reduce((a,hb)=>a+((d.habits||{})[hb.id]?(hb.w||1):0),0);
    const nuevo=PTS.checkin+hw;
    let ya=0;
    if(prev&&prev._saved) ya = prev._pts!=null ? prev._pts : PTS.checkin+habits().reduce((a,hb)=>a+((prev.habits||{})[hb.id]?(hb.w||1):0),0);
    d._pts=nuevo;
    if(nuevo!==ya) addPoints(nuevo-ya, ya?"Check-in editado ("+(nuevo-ya>0?"+":"")+(nuevo-ya)+")":"Check-in + hábitos (+"+hw+")");
  } else if(prev&&prev._pts!=null) d._pts=prev._pts;
  st.checkins[t]=d; st._ckDraft=null;
  save(); closeOverlay(); toast("Check-in guardado ✓"); render();
}

  el.appendChild(sr);

  const ph=h('<div class="card"><div class="ctitle">Historial de paces</div></div>');
  if(!st.paceHistory.length) ph.appendChild(h('<div class="dim mono" style="font-size:0.75rem;text-align:center;padding:12px">Sin datos aún.</div>'));

function drawMetric(id,ser,color,showBand){
  const cv=$(id); if(!cv||ser.length<2) return;
  const dpr=window.devicePixelRatio||2, W=Math.min(420,cv.parentNode.clientWidth||300), H=120;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%"; cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const x0=32,x1=W-6,y0=8,y1=H-16;
  const vs=ser.map(p=>p.v); let mn=Math.min(...vs),mx=Math.max(...vs);
  const pad=(mx-mn)*0.15||1; mn-=pad; mx+=pad;
  const Y=v=>y1-((v-mn)/(mx-mn))*(y1-y0);
  // banda de línea base (media 28 ± 1 DE)
  if(showBand&&ser.length>=4){
    const last28=vs.slice(-28), m=last28.reduce((a,b)=>a+b,0)/last28.length;
    const sd=Math.sqrt(last28.map(v=>(v-m)*(v-m)).reduce((a,b)=>a+b,0)/last28.length)||1;
    ctx.fillStyle=color+"18"; ctx.fillRect(x0,Y(m+sd),x1-x0,Math.max(1,Y(m-sd)-Y(m+sd)));
    ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(x0,Y(m)); ctx.lineTo(x1,Y(m));
    ctx.strokeStyle=color+"88"; ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
  }
  [mx-pad,mn+pad].forEach(v=>{ ctx.fillStyle="#A3A9B3"; ctx.font="9px monospace"; ctx.textAlign="right";
    ctx.fillText(Math.round(v),x0-4,Y(v)+3); });
  const step=(x1-x0)/(ser.length-1);
  ctx.beginPath(); ser.forEach((p,i)=>{const x=x0+i*step,y=Y(p.v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  ser.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(x0+i*step,Y(p.v),i===ser.length-1?4:2.5,0,Math.PI*2);
    ctx.fillStyle=i===ser.length-1?"#fff":color; ctx.fill(); });
  ctx.fillStyle="#A3A9B3"; ctx.font="9px monospace"; ctx.textAlign="left";
  ctx.fillText(ser[0].date.slice(8,10)+"/"+ser[0].date.slice(5,7),x0,H-3);
  ctx.textAlign="right"; ctx.fillText("hoy",x1,H-3);
}
function drawGrip(){
  const cv=$("gripc"); if(!cv) return;

  if(L.length<2&&R.length<2) return drawMetric("gripc",metricSeries("grip",90),"#A8E63E",true);

  const x0=32,x1=W-6,y0=8,y1=H-16;
  const all=L.concat(R).map(p=>p.v); let mn=Math.min(...all),mx=Math.max(...all);

  [[L,"#A8E63E","izq"],[R,"#B79CFF","der"]].forEach(([ser,col])=>{
    if(ser.length<2) return;
    const step=(x1-x0)/(ser.length-1);
    ctx.beginPath(); ser.forEach((p,i)=>{const x=x0+i*step,y=Y(p.v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});

  });

  ctx.fillStyle="#A8E63E"; ctx.fillText("● izquierda",x0,H-3);
  ctx.fillStyle="#B79CFF"; ctx.fillText("● derecha",x0+62,H-3);
}

/* ── Training State: ACWR global con banda óptima 0.8–1.3 ── */
function acwrOn(dISO){
  if(construyendoBase(dISO)) return null;
  const by=dailyLoads();
  let a=0,c=0;
  Object.entries(by).forEach(([d,ml])=>{ const age=daysBetween(d,dISO);
    const tot=Object.values(ml).reduce((x,y)=>x+y,0);
    if(age>=0&&age<7) a+=tot;
    if(age>=0&&age<28) c+=tot; });
  a/=7; c/=28;
  return c>0.01?a/c:(a>0?1:null);
}
function acwrSeries(days){
  const out=[]; const now=new Date();
  for(let i=days-1;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i);
    out.push({date:todayISO(d), v:acwrOn(todayISO(d))}); }
  return out;
}

function drawACWR(){
  const cv=$("acwrc"); if(!cv) return;
  const dpr=window.devicePixelRatio||2, W=Math.min(420,cv.parentNode.clientWidth||300), H=140;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%"; cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const x0=28, x1=W-6, y0=8, y1=H-18, maxY=2;
  const Y=v=>y1-(Math.min(maxY,Math.max(0,v))/maxY)*(y1-y0);
  // banda óptima
  ctx.fillStyle="rgba(58,255,184,0.10)"; ctx.fillRect(x0,Y(1.3),x1-x0,Y(0.8)-Y(1.3));
  [[0.8,"#7BC96F"],[1.3,"#7BC96F"],[1.5,"#ffb347"]].forEach(([v,c])=>{
    ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(x0,Y(v)); ctx.lineTo(x1,Y(v));
    ctx.strokeStyle=c+"66"; ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#A3A9B3"; ctx.font="9px monospace"; ctx.textAlign="right"; ctx.fillText(v.toFixed(2),x0-4,Y(v)+3);

    ctx.fillText("Registra sesiones para ver tu evolución",W/2,H/2); return; }
  const step=(x1-x0)/Math.max(1,ser.length-1);
  ctx.beginPath();
  ser.forEach((p,i)=>{ const x=x0+i*step,y=Y(p.v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle="#ECEEF2"; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  const last=ser[ser.length-1];
  ctx.beginPath(); ctx.arc(x0+(ser.length-1)*step,Y(last.v),4,0,Math.PI*2);
  ctx.fillStyle=last.v>=0.8&&last.v<=1.3?"#7BC96F":last.v>1.5?"#FF6B5A":"#ffb347"; ctx.fill();

  ctx.textAlign="right"; ctx.fillText("hoy",x1,H-5);
}

function drawRadar(){
  const canvas=$("radar"); if(!canvas) return;
  /* D8 · ancho adaptable y siete ejes */
  const box=$("radarBox"), dpr=window.devicePixelRatio||2;
  const W=Math.max(260,Math.min(440,(box&&box.clientWidth)||320)), H=Math.round(W*0.92);
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+"px"; canvas.style.height=H+"px";
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const cx=W/2, cy=H/2+4, r=Math.min(W,H)*0.30;
  ctx.clearRect(0,0,W,H);
  const n=CATS.length, angles=CATS.map((c,i)=>-Math.PI/2+Math.PI*2*i/n);
  ctx.setLineDash([3,4]);
  for(let ring=1;ring<=4;ring++){ ctx.beginPath(); ctx.arc(cx,cy,r*ring/4,0,Math.PI*2);
    ctx.strokeStyle="rgba(255,255,255,"+(ring===4?0.18:0.08)+")"; ctx.lineWidth=1; ctx.stroke(); }
  ctx.setLineDash([]);
  angles.forEach(a=>{ ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)); ctx.strokeStyle="rgba(255,255,255,0.08)"; ctx.stroke(); });
  const sc=CATS.map(c=>catScore(c.id));
  const vals=sc.map(s=>s!=null?Math.max(0.03,Math.min(1,s/100)):0.03);
  ctx.beginPath();
  angles.forEach((a,i)=>{const rr=r*vals[i],x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.closePath(); ctx.fillStyle="rgba(168,230,62,0.30)"; ctx.fill();
  ctx.strokeStyle="#A8E63E"; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.stroke();
  angles.forEach((a,i)=>{ const rr=r*vals[i]; ctx.beginPath(); ctx.arc(cx+rr*Math.cos(a),cy+rr*Math.sin(a),4.5,0,Math.PI*2);
    ctx.fillStyle=colorCat(CATS[i].id); ctx.fill(); ctx.strokeStyle="#0D0F12"; ctx.lineWidth=2; ctx.stroke(); });
  const fs=Math.round(13*(st.textScale||1));
  angles.forEach((a,i)=>{
    const lx=cx+(r+26)*Math.cos(a), ly=cy+(r+22)*Math.sin(a);
    ctx.textAlign=Math.abs(Math.cos(a))<0.3?"center":(Math.cos(a)>0?"left":"right");
    ctx.fillStyle="#D9DCE3"; ctx.font="600 "+fs+"px 'DM Sans',system-ui,sans-serif";
    ctx.fillText(trTxt(CATS[i].full),lx,ly-3);
    ctx.fillStyle=sc[i]!=null?colorCat(CATS[i].id):"#A3A9B3"; ctx.font="700 "+(fs+2)+"px 'DM Sans',system-ui,sans-serif";
    ctx.fillText(sc[i]!=null?sc[i]:"—",lx,ly+fs+1);
  });
}

/* ═══════════════ LEER LA SESIÓN DEL PLAN ═══════════════
   Extrae los ejercicios escritos en el texto del día para poder lanzarlos
   con metrónomo, en vez de tener que reconstruirlos a mano. */
const ALIAS={
  "WALL BALL":"WALL BALLS","WALLBALL":"WALL BALLS","WALLBALLS":"WALL BALLS",
  "SENTADILLA TRASERA":"SENTADILLA","BACK SQUAT":"SENTADILLA","SENTADILLA FRONTAL":"FRONT SQUAT",
  "SENTADILLA GOBLET":"GOBLET SQUAT","KB GOBLET SQUAT":"GOBLET SQUAT","GOBLET SQUAT":"GOBLET SQUAT",
  "RDL":"PESO MUERTO RUMANO","PESO MUERTO RUMANO CON MANCUERNAS":"RDL MANCUERNAS","RDL CON MANCUERNAS":"RDL MANCUERNAS",
  "PRESS DE BANCA":"PRESS BANCA","BENCH PRESS":"PRESS BANCA",
  "DOMINADAS":"PULL-UPS","DOMINADAS LASTRADAS":"PULL-UPS","PULL-UP":"PULL-UPS","PULL UPS":"PULL-UPS",
  "BBJ":"BURPEE BROAD JUMP",
  "LUNGES":"REAR LUNGES","ZANCADAS":"REAR LUNGES",
  "KB SWINGS":"KB SWING","SWINGS":"KB SWING",
  "SIT UP THROW":"SIT-UP THROW",
  "FLEXIONES":"PUSH-UPS","PUSH-UP":"PUSH-UPS","PUSH UPS":"PUSH-UPS",
  "FONDOS":"FONDOS EN CAJÓN","ANILLAS DIPS":"RING DIPS","RING DIP":"RING DIPS",
  "ANILLAS ROWS":"RING ROW","REMO INVERTIDO":"RING ROW","ANILLAS PULL-UP":"PULL-UPS",
  "PUSH-UP ANILLAS":"RING PUSH-UP",
  "CURL MARTILLO":"CURL MANCUERNAS","DEADBUG":"DEAD BUG",
  "FARMERS":"FARMERS CARRY","FARMER":"FARMERS CARRY","FARMERS CARRY":"FARMERS CARRY",
  "GEMELO":"CALF RAISES","GEMELOS":"CALF RAISES","GEMELO A UNA PIERNA":"CALF RAISES",
  "PLANCHA LATERAL":"SIDE PLANK","HOLLOW":"HOLLOW HOLD","REMO CON MANCUERNA":"REMO MANCUERNA 1 BRAZO","PUENTE DE GLUTEO":"HIP THRUST","PUENTE DE GLUTEO CON MANCUERNA":"HIP THRUST","SALTO AL CAJON":"BOX JUMP","SQUAT JUMP":"SQUAT JUMPS",
};
/* Patrones que aparecen en los planes y no tienen ficha: se listan como texto
   bajo el WOD para que no se pierdan, pero no se lanzan con metrónomo. */
const SIN_FICHA=["PUENTE DE ISQUIOS","NORDIC"];
function _norm(s){ return String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function baseEjercicios(){ return EXDB.concat(st.exCustom||[]); }
/* B1 · Lector de la sesión del plan.
   - Trocea por + · , ; y por punto seguido de mayúscula.
   - Las series×reps de un ejercicio son las que van DESPUÉS de su nombre en
     su mismo trozo (antes cogía las del ejercicio anterior).
   - NUNCA rellena el peso con el de la ficha: a Elena le salía goblet a 24 kg.
   - Usa la base completa: el veto de PROFILE.exclude es para el generador,
     no para el plan propio de cada persona.
   - Lo que no reconoce no se pierde: va a `.extra`. */

function fmtPresc(x){ return x.unit==="tramos" ? x.sets+" tramos" : x.sets+"×"+x.reps+(x.unit==="seg"?"s":""); }
/* B1 · Lector de la sesión del plan.
   - Trocea por + · , ; y por punto seguido de mayúscula.
   - Las series×reps de un ejercicio son las que van DESPUÉS de su nombre en
     su mismo trozo (antes cogía las del ejercicio anterior).
   - NUNCA rellena el peso con el de la ficha: a Elena le salía goblet a 24 kg.
   - Usa la base completa: el veto de PROFILE.exclude es para el generador,
     no para el plan propio de cada persona.
   - Lo que no reconoce no se pierde: va a `.extra`. */
function leerSesionDelPlan(texto){
  const out=[]; out.extra=[];
  if(!texto) return out;
  const rr=texto.match(/R(\d+)(['"])/);
  const restSesion = rr ? (rr[2]==="'" ? +rr[1]*60 : +rr[1]) : null;
  const pctSesion=(texto.match(/(\d{2,3})\s*%/)||[])[1];
  const base=baseEjercicios().filter(e=>!e.erg);
  const conBarra=(PROFILE.equipment||[]).includes("barra");
  const nombres=base.map(e=>e.name).concat(Object.keys(ALIAS)).concat(SIN_FICHA)
    .map(n=>({n, N:_norm(n)})).sort((a,b)=>b.N.length-a.N.length);
  const trozos=texto.replace(/\s+/g," ").split(/\s*[+·;]\s*|,\s+|\.\s+(?=[A-ZÁÉÍÓÚÑ¿])/);
  const vistos=new Set();
  trozos.forEach(fr0=>{
    const fr=fr0.trim(); if(!fr) return;
    const F=_norm(fr);
    let hit=null, pos=-1;
    for(const x of nombres){
      const re=new RegExp("(^|[^A-Z0-9])"+x.N.replace(/[.*+?^${}()|[\]\\-]/g,"\\$&")+"(?=[^A-Z0-9]|$)");
      const m=re.exec(F); if(m){ hit=x; pos=m.index+m[1].length; break; }
    }
    const presc=/\d\s*[x×]\s*(\d|max|máx)|[x×]\s*\d/i.test(fr);
    if(!hit){ if(presc) out.extra.push(fr.replace(/\s*R\d+['"]\s*$/,"").slice(0,70)); return; }
    if(SIN_FICHA.includes(hit.n)){ if(presc) out.extra.push(fr.slice(0,70)); return; }
    let canon=ALIAS[hit.n]||hit.n;
    if(canon==="PESO MUERTO RUMANO"&&!conBarra) canon="RDL MANCUERNAS";
    const ex=base.find(e=>e.name===canon); if(!ex){ if(presc) out.extra.push(fr.slice(0,70)); return; }
    if(vistos.has(canon)) return;
    const tras=fr.slice(pos+hit.n.length);
    // series×reps detrás del nombre; "2×24kg" es un peso, no una prescripción
    let sets=null, reps=null, dist=null, seg=false, max=false;
    const re=/(\d+)\s*[x×]\s*(\d+(?:[.,]\d+)?|m[aá]x)\s*(kg|metros|m\b|s\b|seg|"|cal)?/gi; let m;
    while((m=re.exec(tras))){
      if(m[3]&&/kg/i.test(m[3])) continue;
      sets=+m[1];
      if(/m[aá]x/i.test(m[2])) max=true; else reps=+String(m[2]).replace(",",".");
      if(m[3]&&/^(m|metros)$/i.test(m[3])) dist=reps;
      if(m[3]&&/^(s|seg|")$/i.test(m[3])) seg=true;
      break;
    }
    if(sets==null){ const m2=tras.match(/(?:^|\s)[x×]\s*(\d+)/); if(m2){ sets=1; reps=+m2[1]; } }
    if(sets==null&&!max){ if(presc) out.extra.push(fr.slice(0,70)); return; }
    // peso: solo el que trae este trozo; si no, lo que diga el texto; nunca la ficha
    const wk=fr.match(/@?\s*((?:\d+\s*[x×]\s*)?\d+(?:[.,]\d+)?)\s*kg/i);
    const wTxt=(fr.match(/(KB ligera|mancuernas? ligeras?|sin peso|poco o ning[uú]n peso|peso c[oó]modo|banda|goma)/i)||[])[1];
    const pct=(fr.match(/(\d{2,3})\s*%/)||[])[1] || (ex.cat==="fuerza"&&exEquip(ex)==="barra"?pctSesion:null);
    let weight = wk ? wk[1].replace(/\s/g,"")+"kg" : wTxt ? wTxt.toLowerCase() : pct ? "al "+pct+"%" : exEquip(ex)==="ninguno" ? "peso corporal" : "peso según tu plan";
    vistos.add(canon);
    const item={name:canon,cat:ex.cat,sets:Math.max(1,Math.min(10,sets||3)),
      reps:max?(ex.reps||8):reps, rest:restSesion||ex.rest||90, weight, note:ex.note,
      paceMin:ex.paceMin,paceMax:ex.paceMax,unit:ex.unit,erg:false,fromPlan:true};
    if(max){ item.weight=(weight==="peso según tu plan"?"":weight+" · ")+"al máximo"; }
    if(dist!=null){ item.unit="tramos"; item.reps=1; item.weight=weight+" · "+dist+"m"; item.paceMin=0; item.paceMax=0; }
    else if(seg){ item.unit="seg"; item.paceMin=0; item.paceMax=0; }
    out.push(item);
  });
  return out;
}
function lanzarSesionDelPlan(){
  const pos=planPos(), day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  if(!day) return;
  const wod=leerSesionDelPlan(day.main);
  if(!wod.length){ toast("No he sabido leer los ejercicios — usa el diseñador"); openBuilder(); return; }
  previewWod(wod,false);
}

/* ═══════════════════ GENERADOR DE WOD ═══════════════════ */
var genOpts={focus:"auto",mins:30};
function openGenerator(source){
  const foci=[["auto","⚖️ Equilibrar"],["metabólico","🔥 Metabólico"],["fuerza","💪 Fuerza"],["hyrox","🏁 HYROX"],["core","🎯 Core"],["z2","💚 Z2 suave"]];
  let html='<div class="ctitle">⚙ Generador de WOD</div>';
  html+='<div style="font-size:0.75rem;font-weight:600;margin-bottom:6px">Enfoque</div><div class="chips" style="margin-bottom:12px">';
  foci.forEach(([id,lb])=>{ html+='<button class="btn3'+(genOpts.focus===id?' sel':'')+'" onclick="genSet(\'focus\',\''+id+'\')">'+lb+'</button>'; });
  html+='</div><div style="font-size:0.75rem;font-weight:600;margin-bottom:6px">Duración</div><div class="chips" style="margin-bottom:12px">';
  [20,30,40,50].forEach(m=>{ html+='<button class="btn3'+(genOpts.mins===m?' sel':'')+'" onclick="genSet(\'mins\','+m+')">'+m+' min</button>'; });
  html+='<button class="btn3'+(![20,30,40,50].includes(genOpts.mins)?' sel':'')+'" onclick="pedirNumero(\'Duración\',\'Minutos de sesión\','+genOpts.mins+',10,120,v=>genSet(\'mins\',v))">'+(![20,30,40,50].includes(genOpts.mins)?genOpts.mins+' min':'Otro…')+'</button>';
  html+='</div>';
  const ms=muscleStatus();
  const avoid=MUSCLES.filter(m=>ms[m.id].flag==="sobrecarga"||ms[m.id].sore>=2);
  if(avoid.length) html+='<div style="font-size:0.75rem;color:#ffb347;margin-bottom:10px">Se evitarán: '+avoid.map(m=>m.name).join(", ")+'</div>';
  if(PROFILE.soloCuerpo) html+='<div style="font-size:0.75rem;color:#A8E63E;margin-bottom:10px">Solo ejercicios de peso corporal. Para trabajar con material, usa la sesion del plan o las plantillas.</div>';
  const low=MUSCLES.map(m=>({m,rel:ms[m.id].rel})).sort((a,b)=>a.rel-b.rel).slice(0,3);
  html+='<div class="dim" style="font-size:0.75rem;margin-bottom:12px">Zonas menos trabajadas (7d): '+low.map(x=>x.m.name).join(", ")+'</div>';
  const nx = genOpts.mins<=15?2 : genOpts.mins<=22?3 : genOpts.mins<=32?4 : genOpts.mins<=45?5 : genOpts.mins<=60?6 : 7;
  const ns = genOpts.mins<=25?3 : genOpts.mins<=45?4 : 5;
  html+='<div class="dim" style="font-size:0.75rem;margin-bottom:12px">Con '+genOpts.mins+' min saldrán <b>'+nx+' ejercicios × '+ns+' series</b>. Si te sabe a poco o a demasiado, cambia la duración.</div>';
  html+='<button class="btn" onclick="generateWod()">GENERAR WOD</button>';
  html+='<button class="btn2" style="margin:0" onclick="openBuilder()">✏️ Prefiero diseñarlo yo (AMRAP, EMOM…)</button>';
  overlay(html);
}
function genSet(k,v){ genOpts[k]=v; openGenerator(); }
function generateWod(){
  const ms=muscleStatus();
  const focus=genOpts.focus, mins=genOpts.mins;
  // escala proporcional: sirve para 12 minutos y para 90
  const nEx = mins<=15?2 : mins<=22?3 : mins<=32?4 : mins<=45?5 : mins<=60?6 : 7;
  const nSets = mins<=15?3 : mins<=25?3 : mins<=45?4 : 5;
  // base: sin ergómetros, con material disponible y respetando sobrecarga/agujetas SIEMPRE
  const soloCuerpo=!!PROFILE.soloCuerpo;
  const safe=allEx().filter(e=>!e.erg&&hasEquip(e)
    &&(!soloCuerpo||exEquip(e)==="ninguno")
    &&!Object.entries(e.m).some(([mu,c])=>c>=0.5&&(ms[mu].flag==="sobrecarga"||ms[mu].sore>=2)));
  let pool=safe.slice();
  if(focus==="metabólico") pool=pool.filter(e=>e.cat==="metabólico"||e.cat==="hyrox");
  else if(focus==="fuerza") pool=pool.filter(e=>e.cat==="fuerza");
  else if(focus==="hyrox") pool=pool.filter(e=>e.cat==="hyrox");
  else if(focus==="core") pool=pool.filter(e=>e.cat==="core"||Object.keys(e.m).includes("core"));
  else if(focus==="z2") pool=pool.filter(e=>e.cat!=="fuerza"); // bodyweight continuo
  // si el enfoque deja pocos, rellenar con el resto de ejercicios seguros (nunca los excluidos)
  if(pool.length<nEx) safe.forEach(e=>{ if(!pool.includes(e)) pool.push(e); });
  // puntuar: prioriza músculos poco trabajados; diversifica en greedy
  const temp={}; MUSCLES.forEach(m=>temp[m.id]=ms[m.id].rel);
  const chosen=[];
  for(let i=0;i<nEx&&pool.length;i++){
    pool.forEach(e=>{ e._score=Object.entries(e.m).reduce((a,[mu,c])=>a+c*(1-Math.min(1,temp[mu])),0)+Math.random()*0.3; });
    pool.sort((a,b)=>b._score-a._score);
    const pick=pool.shift(); chosen.push(pick);
    Object.entries(pick.m).forEach(([mu,c])=>temp[mu]=Math.min(1.5,temp[mu]+c*0.5));
  }
  const wod=chosen.map(e=>({name:e.name,cat:e.cat,sets:nSets,reps:e.reps,rest:focus==="z2"?45:e.rest,weight:e.weight,note:e.note,paceMin:e.paceMin,paceMax:e.paceMax,unit:e.unit}));
  previewWod(wod, focus==="z2");
}
function previewWod(wod,isZ2){
