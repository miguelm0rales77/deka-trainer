/* ═══════════════════ PLAYER WOD (metrónomo) ═══════════════════ */
var P={timers:[]};
/* ── B2 · reloj real y pantalla encendida ─────────────────────────────────
   Los cronómetros contaban tics de setInterval (elapsed++). Con la pantalla
   bloqueada iOS congela los intervalos y el tiempo se quedaba corto. Ahora
   cada reproductor guarda la hora de inicio y calcula lo transcurrido con
   Date.now(); al volver de segundo plano se recalcula y se avanzan las fases. */
let _wake=null;
async function pedirPantalla(){ try{ if(navigator.wakeLock&&!_wake){ _wake=await navigator.wakeLock.request("screen"); _wake.addEventListener&&_wake.addEventListener("release",()=>{_wake=null;}); } }catch(e){ _wake=null; } }
function soltarPantalla(){ try{ if(_wake){ _wake.release(); } }catch(e){} _wake=null; }
function sesionEnMarcha(){ return !!(P.running||P.resting||PC.running||FP.running); }
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  try{ if(P.tick&&(P.running||P.resting)) P.tick(); }catch(e){}
  try{ if(PC.tick&&PC.running) PC.tick(); }catch(e){}
  try{ if(FP.tick&&FP.running) FP.tick(); }catch(e){}
  if(sesionEnMarcha()) pedirPantalla();
});
function mmss(s){ s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function pClear(){ P.timers.forEach(clearInterval); P.timers=[]; }
function stopAllTimers(){ pClear(); }
function startWod(){
  const d=st._wodDraft; if(!d) return;
  st._lastCfg={type:"wod",wod:JSON.parse(JSON.stringify(d.wod)),isZ2:!!d.isZ2};
  Object.assign(P,{wod:d.wod,isZ2:d.isZ2,idx:0,set:1,results:[],setResults:[],running:false,resting:false,elapsed:0,restSec:0,startTime:Date.now(),pace:0,beat:-1});
  pInitEx(); pRender();
}
/* C15 · un pace guardado por encima del máximo del ejercicio es un toque sin
   querer (RDL MANCUERNAS = 1064): no se usa ni se muestra, pero no se borra */
function paceValido(nombre,p){ if(!p) return 0; const fx=baseEjercicios().find(x=>x.name===nombre)||{}; return (fx.paceMax&&p>fx.paceMax)?0:p; }
function pacesHistValidos(){ return st.paceHistory.filter(h=>paceValido(h.exercise,h.pace)); }
function pInitEx(){
  const ex=P.wod[P.idx], saved=paceValido(ex.name,st.savedPaces[ex.name]);
  P.pace = P.isZ2 ? (saved?Math.max(ex.paceMin,saved-10):0) : (saved?saved+2:0);
  P.set=1; P.setResults=[]; P.elapsed=0; P.running=false; P.resting=false;
}
function pRender(){
  if(window._cfOpen) return;
  const ex=P.wod[P.idx];
  const m=String(Math.floor(P.elapsed/60)).padStart(2,"0"), s=String(P.elapsed%60).padStart(2,"0");
  const first=!P.pace;
  let html='<div class="row" style="margin-bottom:8px"><span class="mono dim" style="font-size:0.75rem">'+(P.idx+1)+'/'+P.wod.length+' · SERIE '+P.set+'/'+ex.sets+'</span><button class="btn3" onclick="pQuit()">✕ Salir</button></div>';
  html+='<div style="display:flex;gap:4px;margin-bottom:12px">'+P.wod.map((_,i)=>'<div style="height:3px;flex:1;border-radius:2px;background:'+(i<P.idx?'#A8E63E':i===P.idx?'rgba(168,230,62,.4)':'#2A313B')+'"></div>').join("")+'</div>';
  if(first) html+='<div style="background:rgba(255,79,58,.08);border:1px solid rgba(255,79,58,.3);border-radius:10px;padding:10px;margin-bottom:10px;font-size:0.75rem;color:#FF6B5A;text-align:center" class="mono">⏱ PRIMERA VEZ — cronómetro puro. Hoy marcas la referencia.</div>';
  if(P.isZ2) html+='<div style="font-size:0.75rem;color:#7BC96F;text-align:center;margin-bottom:8px">💚 Z2 — continuo y cómodo, la FC manda</div>';
  html+='<div class="big" style="font-size:2rem;letter-spacing:2px;color:#A8E63E">'+esc(ex.name)+'</div>';
  html+='<div class="dim" style="font-size:0.75rem;margin-bottom:8px">'+esc(ex.note||"")+'</div>';
  const uL=ex.unit&&ex.unit!=="reps"?ex.unit:"reps";
  html+='<div style="display:flex;gap:16px;margin-bottom:10px" class="mono">'+[[ex.sets+'×','series'],[ex.reps+(uL==="seg"?'s':''),uL],[ex.rest+'s','descanso'],[ex.erg?'—':esc(ex.weight),ex.erg?'máquina':'peso']].map(([v,l])=>'<div><div class="dim" style="font-size:0.75rem;text-transform:uppercase">'+l+'</div><div style="font-size:0.9375rem">'+v+'</div></div>').join("")+'</div>';
  if(ex.erg) html+='<div style="font-size:0.75rem;color:#7BC96F;margin-bottom:8px">🚣 Ergómetro: cronómetro puro, sin metrónomo de reps. Marca «completar» al llegar a '+ex.reps+' '+esc(uL)+'.</div>';
  html+='<div style="display:flex;gap:7;justify-content:center;gap:7px;margin-bottom:10px">'+Array.from({length:ex.sets},(_,i)=>'<div style="width:11px;height:11px;border-radius:50%;background:'+(i<P.set-1?'#A8E63E':'transparent')+';border:2px solid '+(i===P.set-1?'#7BC96F':'#2A313B')+'"></div>').join("")+'</div>';
  // pace
  html+='<div style="background:#0D0F12;border:1px solid #2A313B;border-radius:12px;padding:12px;margin-bottom:10px">';
  html+='<div class="row"><div><div class="mono dim" style="font-size:0.75rem;letter-spacing:2px">PACE</div><div class="big" style="font-size:'+(P.pace?'42':'22')+'px;color:'+(P.pace?'#A8E63E':'#A3A9B3')+'">'+(P.pace||"—")+'</div></div><div class="mono dim" style="font-size:0.75rem;text-align:right">'+(P.pace?(P.pace/5).toFixed(1)+' reps/min<br>beat cada '+(60/(P.pace/5)).toFixed(2)+'s':'Cronómetro puro')+'</div></div>';
  if(ex.paceMax>0) html+='<div style="display:flex;gap:6px;margin-top:8px;align-items:center">'+[[-5,'-5'],[-1,'−'],[1,'+'],[5,'+5']].map(([d,l])=>'<button class="btn3" style="min-width:34px" '+(P.pace?'':'disabled')+' onclick="pPace('+d+')">'+l+'</button>').join("")+'<input type="range" min="'+ex.paceMin+'" max="'+ex.paceMax+'" value="'+(P.pace||ex.paceMin)+'" oninput="pPaceSet(this.value)"></div>';
  html+='</div>';
  // beats
  html+='<div style="display:flex;justify-content:center;gap:6px;padding:6px 0">'+Array.from({length:8},(_,i)=>'<div class="beatdot'+(P.beat===i?' on':'')+'" id="bd'+i+'"></div>').join("")+'</div>';
  // timer
  html+='<div style="text-align:center;margin:4px 0 12px"><div class="big" id="pclock" style="font-size:3.5rem;letter-spacing:4px;color:'+(P.running?'#7BC96F':first?'#FF6B5A':'#ECEEF2')+'">'+m+':'+s+'</div><div class="mono dim" style="font-size:0.75rem;letter-spacing:2px;text-transform:uppercase">'+(P.running?(first?'CRONOMETRANDO — '+ex.reps+' reps':'SERIE EN CURSO'):'LISTO')+'</div></div>';
  if(P.resting){
    html+='<div style="text-align:center;border:1px solid rgba(255,79,58,.3);border-radius:12px;padding:12px;margin-bottom:8px"><div class="mono dim" style="font-size:0.75rem;letter-spacing:3px">DESCANSO</div><div class="big" style="font-size:3.75rem;color:#FF6B5A" id="restnum">'+P.restSec+'</div><button class="btn2" style="margin:0" onclick="pSkipRest()">Saltar descanso</button></div>';
  } else {
    html+='<button class="btn xl" onclick="pMain()">'+(P.running?'COMPLETAR SERIE':'INICIAR')+'</button>';
    html+='<div style="display:flex;gap:8px"><button class="btn2" style="margin:0" onclick="pReset()">↺ Reset</button><button class="btn2" style="margin:0" onclick="pSkipEx()">Saltar ejercicio →</button></div>';
  }
  overlay(html,{modal:true});
}
function pPace(d){ const ex=P.wod[P.idx]; P.pace=Math.max(ex.paceMin,Math.min(ex.paceMax,(P.pace||ex.paceMin)+d)); if(P.running) pStartMetro(); pRender(); }
function pPaceSet(v){ P.pace=parseInt(v); if(P.running) pStartMetro(); pRender(); }
function pStartMetro(){
  P.timers=P.timers.filter(t=>t!==P.metro); clearInterval(P.metro);
  if(!P.pace) return;
  const ms=60000/(P.pace/5); let b=0;
  P.metro=setInterval(()=>{ P.beat=b%8; beep(880,0.05); b++;
    for(let i=0;i<8;i++){ const el=$("bd"+i); if(el) el.classList.toggle("on",i===P.beat); }
    setTimeout(()=>{const el=$("bd"+P.beat); if(el) el.classList.remove("on");},170);
  },ms);
  P.timers.push(P.metro);
}
function pMain(){
  const ex=P.wod[P.idx];
  if(P.resting) return;
  if(!P.running){
    P.running=true; P.elapsed=0; P.t0=Date.now(); pedirPantalla();
    P.tick=()=>{ if(!P.running) return; P.elapsed=Math.floor((Date.now()-P.t0)/1000);
      const el=$("pclock"); if(el) el.textContent=mmss(P.elapsed); };
    P.chron=setInterval(()=>P.tick(),250);
    P.timers.push(P.chron);
    if(P.pace) pStartMetro();
    pRender();
  } else {
    P.elapsed=Math.floor((Date.now()-P.t0)/1000);
    pClear(); P.running=false; P.beat=-1;
    const t=Math.max(1,P.elapsed);
    const rpm=(ex.reps/t)*60, ap=Math.round(rpm*5);
    /* C15 · una serie de menos de 3 s o un pace por encima del máximo del
       ejercicio es un toque sin querer, no una marca: no se guarda */
    const valido = ex.paceMax>0 && P.elapsed>=3 && ap<=ex.paceMax;
    P.setResults.push({set:P.set,time:t,pace:valido?ap:0,reps:ex.reps});
    if(P.set<ex.sets){ P.set++; pStartRest(ex.rest,false); }
    else { pCerrarEjercicio(); if(P.idx<P.wod.length-1){ pStartRest(ex.rest*2,true); } else { pFeedback(); } }
  }
}
function pCerrarEjercicio(){
  const ex=P.wod[P.idx]; if(!P.setResults.length) return;
  const paced=P.setResults.filter(r=>r.pace>0);
  const avg=paced.length?Math.round(paced.reduce((a,b)=>a+b.pace,0)/paced.length):0;
  P.results.push({name:ex.name,sets:P.setResults.slice(),avgPace:avg,totalReps:P.setResults.reduce((a,r)=>a+(r.reps||0),0),unit:ex.unit});
  P.setResults=[];
}
function pStartRest(sec,nextEx){
  P.resting=true; P.restSec=sec; P.nextEx=nextEx; P.elapsed=0; P.restEnd=Date.now()+sec*1000; P._lastRest=sec; pRender();
  P.tick=()=>{ if(!P.resting) return;
    P.restSec=Math.ceil((P.restEnd-Date.now())/1000);
    if(P.restSec<P._lastRest&&P.restSec<=3&&P.restSec>0) beep(440,0.1);
    P._lastRest=P.restSec;
    const el=$("restnum"); if(el) el.textContent=Math.max(0,P.restSec);
    if(P.restSec<=0){ clearInterval(P.rest); P.resting=false; beep(660,0.15);
      if(P.nextEx){ P.idx++; pInitEx(); } else { P.elapsed=0; }
      pRender(); } };
  P.rest=setInterval(()=>P.tick(),250);
  P.timers.push(P.rest);
}
function pSkipRest(){ clearInterval(P.rest); P.resting=false; beep(660,0.15); if(P.nextEx){ P.idx++; pInitEx(); } else P.elapsed=0; pRender(); }
function pReset(){ pClear(); P.running=false; P.beat=-1; P.elapsed=0; pRender(); }
function pSkipEx(){
  /* A3 · antes se tiraban las series ya hechas del ejercicio saltado */
  pClear(); P.running=false; P.resting=false;
  pCerrarEjercicio();
  if(P.idx<P.wod.length-1){ P.idx++; pInitEx(); pRender(); } else pFeedback();
}
function pQuit(){
  const empezada=P.results.length||P.setResults.length||P.running||P.resting;
  if(!empezada){ pClear(); closeOverlay(); return; }
  confirmar("¿Salir sin guardar?","Llevas parte de la sesión hecha. Si sales ahora no se registrará.","Salir sin guardar",()=>{ pClear(); P.running=P.resting=false; soltarPantalla(); closeOverlay(); },"Seguir",()=>pRender(),true);
}


function pFeedback(){
  pClear(); soltarPantalla();
  const mins=Math.max(1,Math.round((Date.now()-P.startTime)/60000));
  const paced=P.results.filter(r=>r.avgPace);
  const avg=paced.length?Math.round(paced.reduce((a,b)=>a+b.avgPace,0)/paced.length):0;
  st._fb={results:P.results,durationMin:mins,mode:"wod",isZ2:P.isZ2,
    metric:avg?{v:avg,label:"pace "+avg,hi:true}:null};
  showFeedback();
}

/* ═══════════════════ FEEDBACK Y GUARDADO ═══════════════════ */
const FEELINGS=["💪 Bien","😓 Duro","🦵 Piernas cargadas","😴 Fatiga","🤕 Molestia","🔥 En zona","❄️ Sin energía"];
const SESSTYPES=Object.keys(DTYPE).filter(t=>t!=="Descanso");
/* deduce el tipo por el contenido real de la sesión; solo usa el plan si no hay pistas */
function guessType(fb){
  const names=(fb.results||[]).map(r=>r.name.toUpperCase());
  fb.typeAuto=true;
  if(fb.mode==="mob") return "Movilidad";
  /* B9 · si lo que registras encaja con el tipo de hoy en el plan, se propone ese */
  const pos=planPos(), day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  const modo={wod:"wod",pacer:"pacer",manual:null}[fb.mode];
  if(day&&DTYPE[day.t]&&day.t!=="Descanso"&&(fb.mode==="manual"||DTYPE[day.t].mode===modo)) return day.t;
  if(names.length){
    const cats=[...new Set(names.map(n=>{const e=baseEjercicios().find(x=>x.name===n);return e?e.cat:null;}).filter(Boolean))];
    const hasRun=names.some(n=>/CARRERA/.test(n)), hasErg=names.some(n=>/REMO|SKIERG|BIKE/.test(n));
    if(hasRun&&(hasErg||cats.some(c=>c!=="running"))) return "Umbral Híbrido";
    if(hasRun) return "Carrera";
    if(names.some(n=>/BIKE/.test(n))&&fb.isZ2) return "Bici Z2";
    if(hasErg) return "Ergómetro";
    if(cats.length===1&&cats[0]==="fuerza") return "Fuerza";
    if(cats.includes("hyrox")) return "Cluster HYROX";
    return "Metabólico";
  }
  return fb.mode==="pacer"?"Carrera":"Fuerza";
}
/* A3 · el borrador del feedback se guarda en disco: si la app se cierra antes de
   pulsar GUARDAR, al volver a Hoy se ofrece recuperarlo */
function guardarBorradorFb(){ try{ if(st._fb){ st._fb._t=Date.now(); save(); } }catch(e){} }
function descartarFb(){ confirmar("¿Descartar la sesión?","No se registrará ni sumará puntos.","Descartar",()=>{ st._fb=null; save(); closeOverlay(); render(); },"Mantenerla",()=>{ closeOverlay(); render(); },true); }
function ahoraNoFb(){ guardarBorradorFb(); closeOverlay(); render(); toast("La sesión queda pendiente en Hoy"); }
function showFeedback(){

    html+='<button class="btn3'+(fb.saveFav?' sel':'')+'" style="width:100%;margin-bottom:12px" onclick="fbFav()">'+(fb.saveFav?'⭐ Se guardará como favorito':'☆ Guardar como favorito para repetir y mejorar')+'</button>';

function fbRpe(v){ st._fb.rpe=v; keepFbInputs(); showFeedback(); }
function fbFav(){ st._fb.saveFav=!st._fb.saveFav; keepFbInputs(); showFeedback(); }
function fbType(t){ st._fb.type=t; st._fb.typeAuto=false; keepFbInputs(); showFeedback(); }
function fbFeel(f){ const a=st._fb.feelings; a.includes(f)?a.splice(a.indexOf(f),1):a.push(f); keepFbInputs(); showFeedback(); }
function keepFbInputs(){ const fc=$("fbFc"),n=$("fbNotes"); if(fc) st._fb.fcAvg=fc.value?parseInt(fc.value):null; if(n) st._fb.notes=n.value; }
function saveSession(){
  keepFbInputs();
  const fb=st._fb, pos=planPos(), t=todayISO();
  const day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  const isPlanned=!!day&&day.t!=="Descanso";
  const type=fb.type||guessType(fb);
  // la sesión cuenta como "del plan" solo si coincide con lo previsto
  const matchesPlan=isPlanned&&day&&(type===day.t||DTYPE[type]&&DTYPE[day.t]&&DTYPE[type].mode===DTYPE[day.t].mode);
  const z2Expected=fb.isZ2||(day&&DTYPE[day.t]&&DTYPE[day.t].z2&&matchesPlan);
  const z2ok=z2Expected? z2Check(fb.fcAvg) : undefined;
  const exercises=(fb.results||[]).map(r=>{ const o={name:r.name,avgPace:r.avgPace||null,totalReps:r.totalReps,sets:r.sets}; if(r.minutes) o.minutes=r.minutes; return o; });
  let muscleLoad=sessionMuscleLoad(exercises);
  if(!Object.keys(muscleLoad).length) muscleLoad=estimarCargaTipo(type,fb.durationMin,fb.rpe);
  const srpe=computeSRPE(fb.rpe,fb.durationMin);
  /* C5 · la movilidad puntúa una vez al día */
  const mobHoy=st.sessions.some(s=>s.date===t&&s.type==="Movilidad"&&s.points>0);
  const pts=fb.mode==="mob"?(mobHoy?0:PTS.mobilidad):matchesPlan?PTS.plan:fb.mode==="wod"?PTS.generado:PTS.libre;
  const sess={id:Date.now(),date:t,week:pos.week>0?pos.week:null,dayIdx:pos.dayIdx,type,mode:fb.mode,
    exercises,durationMin:fb.durationMin,rpe:fb.rpe,srpe,fcAvg:fb.fcAvg||null,
    z2ok:z2Expected?(fb.fcAvg?!!z2ok:null):undefined,feelings:fb.feelings,notes:fb.notes||"",muscleLoad,points:pts,format:fb.formatName||null};
  st.sessions.push(sess);
  // actualizar paces
  exercises.forEach(e=>{ const fx=baseEjercicios().find(x=>x.name===e.name)||{};
    if(e.avgPace&&(!fx.paceMax||e.avgPace<=fx.paceMax)){ st.savedPaces[e.name]=e.avgPace;
    st.paceHistory.push({exercise:e.name,pace:e.avgPace,date:new Date().toLocaleDateString(locale(),{day:"2-digit",month:"short"}),iso:t,cat:fx.cat}); } });
  addPoints(pts,(matchesPlan?"Sesión del plan":"Sesión libre")+" — "+type);
  if(z2Expected&&!z2ok&&fb.fcAvg) toast("⚠ FC "+fb.fcAvg+" — fuera de Z2. La próxima, más suave.");
  // semana perfecta
  revisarSemanaPerfecta();
  // favoritos: alta y registro de marca
  const entry=fb.metric?{date:t,v:fb.metric.v,label:fb.metric.label}:{date:t,v:null,label:"hecho"};
  if(fb.saveFav&&st._lastCfg&&st._runningFav==null){
    const nm=((fb.formatName||type).split(" — ")[0])+" · "+(exercises.slice(0,2).map(e=>e.name).join("+")||"WOD");
    st.favorites.push({id:Date.now(),name:nm,cfg:st._lastCfg,hi:fb.metric?fb.metric.hi:true,history:[entry]});
    toast("⭐ Favorito guardado: "+nm);
  }
  if(st._runningFav!=null){
    const fav=st.favorites.find(f=>f.id===st._runningFav);
    if(fav&&entry.v!=null){
      const prev=fav.history.filter(x=>x.v!=null).map(x=>x.v);
      const isPB=prev.length&&(fav.hi?entry.v>Math.max(...prev):entry.v<Math.min(...prev));
      fav.history.push(entry);
      if(isPB){ addPoints(5,"🏆 PB en "+fav.name); setTimeout(()=>toast("🏆 ¡PB! "+entry.label+" en "+fav.name),400); }
    } else if(fav) fav.history.push(entry);
  }
  st._runningFav=null; st._lastCfg=null;
  st._fb=null; save(); closeOverlay(); render(); toast("Sesión guardada · +"+pts+" pts ⚡");
}

  if(isInt&&!PC.running&&PC.elapsed===0){
    html+='<div style="font-size:0.75rem;font-weight:600;margin-bottom:4px">Trabajo</div><div class="chips" style="margin-bottom:8px">';
    [30,45,60,90,120,180,240].forEach(v=>{ html+='<button class="btn3'+(PC.work===v?' sel':'')+'" onclick="pcSet(\'work\','+v+')">'+(v<60?v+'s':(v/60)+"'")+'</button>'; });
    html+='</div><div style="font-size:0.75rem;font-weight:600;margin-bottom:4px">Descanso</div><div class="chips" style="margin-bottom:8px">';
    [30,45,60,90,120].forEach(v=>{ html+='<button class="btn3'+(PC.restS===v?' sel':'')+'" onclick="pcSet(\'restS\','+v+')">'+(v<60?v+'s':(v/60)+"'")+'</button>'; });
    html+='</div><div style="font-size:0.75rem;font-weight:600;margin-bottom:4px">Series</div><div class="chips" style="margin-bottom:8px">';
    [4,5,6,8,10,12].forEach(v=>{ html+='<button class="btn3'+(PC.series===v?' sel':'')+'" onclick="pcSet(\'series\','+v+')">'+v+'</button>'; });
    html+='</div><input type="text" id="pcTarget" value="'+esc(PC.target||"")+'" placeholder="Objetivo por serie (ej: 250m ski · 62 splits)" onchange="PC.target=this.value" style="margin-bottom:8px">';
    html+='<button class="btn3'+(PC.voice?' sel':'')+'" style="width:100%;margin-bottom:10px" onclick="PC.voice=!PC.voice;pcRender()">'+(PC.voice?'🔊 Voz activada (es-ES)':'🔇 Solo beeps')+'</button>';
  }
  // cadencia
  html+='<div style="background:#0D0F12;border:1px solid #2A313B;border-radius:12px;padding:12px;margin-bottom:10px"><div class="row"><div><div class="mono dim" style="font-size:0.75rem;letter-spacing:2px">'+(PC.machine==="CARRERA"?"CADENCIA (pasos/min)":"RITMO (strokes/min)")+'</div><div class="big" style="font-size:2.5rem;color:#A8E63E">'+PC.bpm+'</div></div><div class="mono dim" style="font-size:0.75rem;text-align:right">beep cada<br>'+(60/PC.bpm).toFixed(2)+'s</div></div>';
  html+='<div style="display:flex;gap:6px;margin-top:8px;align-items:center"><button class="btn3" onclick="pcBpm(-1)">−</button><input type="range" min="'+mx.spm[0]+'" max="'+mx.spm[1]+'" value="'+PC.bpm+'" oninput="pcBpmSet(this.value)"><button class="btn3" onclick="pcBpm(1)">+</button></div></div>';
  html+='<div style="display:flex;justify-content:center;gap:6px;padding:6px 0">'+Array.from({length:8},(_,i)=>'<div class="beatdot" id="pbd'+i+'"></div>').join("")+'</div>';

  if(isInt){
    const workPhase=PC.phase==="work";
    html+='<div style="text-align:center;margin-bottom:4px"><span class="tagz" id="pcphase" style="background:'+(workPhase?'#FF6B5A22;color:#FF6B5A':'#7BC96F22;color:#7BC96F')+';font-size:0.75rem;padding:4px 12px">'+(workPhase?'🔥 TRABAJO':'💨 DESCANSO')+'</span> <span class="mono" id="pcserie" style="font-size:0.75rem;color:#A8E63E">SERIE '+PC.curSerie+'/'+PC.series+'</span></div>';

function pcMode(m2){ PC.mode=m2; pcRender(); }
function pcSet(k,v){ const t=$("pcTarget"); if(t) PC.target=t.value; PC[k]=v; pcRender(); }
function pcMachine(n){ PC.machine=n; PC._userBpm=false; pcRender(); }
function pcBpm(d){ PC.bpm+=d; PC._userBpm=true; if(PC.running) pcMetro(); pcRender(); }
function pcBpmSet(v){ PC.bpm=parseInt(v); PC._userBpm=true; if(PC.running) pcMetro(); pcRender(); }
function pcMetro(){
  clearInterval(PC.metro);
  const ms=60000/PC.bpm; let b=0;
  PC.metro=setInterval(()=>{ const bi=b%8; beep(PC.z2?660:880,0.05); b++;
    for(let i=0;i<8;i++){ const el=$("pbd"+i); if(el) el.classList.toggle("on",i===bi); }
  },ms);
  PC.timers.push(PC.metro);
}
function pcClock(v){ const el=$("pcclock"); if(el) el.textContent=String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0"); }
function pcToggle(){
  if(!PC.running){
    PC.running=true; pedirPantalla();
    const t=$("pcTarget"); if(t) PC.target=t.value;
    PC.base=PC.elapsed||0; PC.t0=Date.now();
    if(PC.mode==="int"&&PC.elapsed===0){ PC.phase="work"; PC.phaseLeft=PC.work; PC.curSerie=1; PC._lastL=PC.work;
      say("Serie 1. ¡Vamos!"); beep(990,0.15); }
    PC.tick=()=>{
      if(!PC.running) return;
      PC.elapsed=Math.floor(PC.base+(Date.now()-PC.t0)/1000);
      if(PC.mode!=="int"){ pcClock(PC.elapsed); return; }
      /* la fase se deduce del tiempo total: si el móvil ha estado bloqueado,
         al volver se coloca directamente en la serie que toca */
      const cyc=PC.work+PC.restS, e=PC.elapsed, total=PC.series*cyc-PC.restS;
      if(e>=total){
        beep(660,0.4); say("Última serie completada. ¡Hecho!");
        PC.curSerie=PC.series; PC.phase="work"; PC.phaseLeft=0;
        PC.running=false; PC.timers.forEach(clearInterval); PC.timers=[]; soltarPantalla(); pcRender(); return;
      }
      const serie=Math.floor(e/cyc)+1, pos=e%cyc, fase=pos<PC.work?"work":"rest";
      const L=fase==="work"?PC.work-pos:cyc-pos;
      const cambio=(fase!==PC.phase||serie!==PC.curSerie);
      const prevL=cambio?L+1:PC._lastL;
      PC.phase=fase; PC.curSerie=serie; PC.phaseLeft=L; PC._lastL=L;
      pcClock(L);
      if(cambio){
        if(fase==="rest"){ beep(660,0.3); say("¡Descanso!"); }
        else { beep(990,0.2); say("Serie "+serie+". ¡Vamos!"); }
        pcRender(); return;
      }
      const cruza=x=>prevL>x&&L<=x;
      if(fase==="work"){
        if(PC.work>=60&&cruza(Math.floor(PC.work/2))) say("Mitad.");
        if(PC.work>45&&cruza(30)) say("Treinta segundos.");
        if(cruza(15)) say("Quince. Si no llegas, aprieta ya.");
        if(L<=5&&L>0&&L<prevL) beep(1200,0.1);
      } else {
        if(cruza(10)) say("Diez segundos. Prepárate.");
        if(L<=3&&L>0&&L<prevL) beep(440,0.1);
      }
    };
    PC.chron=setInterval(()=>PC.tick(),250);
    PC.timers.push(PC.chron); pcMetro(); pcRender();
  } else {
    PC.elapsed=Math.floor(PC.base+(Date.now()-PC.t0)/1000);
    PC.running=false; PC.timers.forEach(clearInterval); PC.timers=[]; soltarPantalla(); try{speechSynthesis.cancel();}catch(e){} pcRender();
  }
}
function pcToggleResume(){ /* re-render mata el interval visual pero los timers siguen */ }
function pcQuit(){
  if(!(PC.elapsed>0)){ PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false; closeOverlay(); return; }
  confirmar("¿Salir sin guardar?","Llevas "+mmss(PC.elapsed)+" en marcha. Si sales ahora no se registrará.","Salir sin guardar",()=>{ PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false; soltarPantalla(); closeOverlay(); },"Seguir",()=>pcRender(),true);
}
function pcFinish(){
  if(PC.running) PC.elapsed=Math.floor(PC.base+(Date.now()-PC.t0)/1000);
  PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false; soltarPantalla();
  const mins=Math.max(1,Math.round(PC.elapsed/60));
  st._fb={results:[{name:PC.machine,avgPace:null,totalReps:0,minutes:mins,unit:"min"}],durationMin:mins,mode:"pacer",isZ2:PC.z2,type:null};
  showFeedback();
}

const MOBCARDS = [{"id":"c1","cat":"manana","title":"Despertar articular","time":"8 min","why":"Revierte el patrón de sedentarismo: activa glúteos inhibidos, abre psoas acortado y despierta la rotación torácica que el escritorio mata.","steps":[{"t":"90-90 con rotación activa","d":"Siéntate en 90-90. Rota el torso despacio hacia la pierna delantera llevando el brazo al suelo. Vuelve. Sin forzar el rango.","time":"5 rep/lado · 2 series"},{"t":"Hip flexor stretch con rotación","d":"Posición de caballero. Brazo del lado de la rodilla adelantada sube y rota al techo. Mantén la pelvis neutra.","time":"30s/lado · 2 series"},{"t":"Cat-Camel con pausa en extensión","d":"En cuadrupedia, ondula la columna. En extensión máxima aguanta 3 segundos antes de volver a flexión.","time":"8 rep · pausa 3s arriba"},{"t":"Dead bug contralateral","d":"Tumbado boca arriba. Extiende brazo y pierna opuestos lentamente hasta casi el suelo. Zona lumbar pegada al suelo.","time":"8 rep/lado · lento"},{"t":"Wall angel","d":"Espalda y cabeza pegadas a la pared. Brazos en W. Sube a Y manteniendo contacto de codos y muñecas.","time":"10 rep · muy controlado"}],"tip":"Si solo tienes 3 minutos: 90-90 + Dead bug. Son los dos que más compensan las horas de consulta."},{"id":"c2","cat":"preentren","title":"Activación pre-sesión","time":"6 min","why":"No es estiramiento. Es activar los patrones que el HYROX va a necesitar: cadera libre, tobillo móvil, torácica rotada.","steps":[{"t":"Hip CARs","d":"De pie o apoyado. Dibuja el círculo más grande posible con la rodilla, controlando cada grado. Sin compensar con la columna lumbar.","time":"5 círculos/lado"},{"t":"Movilidad de tobillo en pared","d":"Pie a 10cm de la pared. Rodilla hacia la pared manteniendo el talón en el suelo. Avanza el pie si no hay problema.","time":"10 rep/lado"},{"t":"Rotación torácica en cuadrupedia","d":"Mano detrás de la cabeza. Lleva el codo al suelo y luego al techo, rotando solo desde el torso. Pelvis quieta.","time":"8 rep/lado"},{"t":"Squat to reach","d":"Sentadilla profunda con talones en el suelo. Desde abajo, lleva brazos arriba y rota alternando lados. Sube lento.","time":"10 rep · lento"},{"t":"Shoulder CARs","d":"Brazo pegado al cuerpo. Dibuja el círculo más grande posible con el hombro controlando escápula. Sin elevar el trapecio.","time":"5 círculos/lado"}],"tip":"Obligatorio antes de cualquier sesión con SkiErg o Sled. El tobillo y la torácica son los dos grandes limitadores."},{"id":"c3","cat":"noche","title":"Restauración nocturna","time":"10 min","why":"Lo que el HYROX nunca entrena: rotación, extensión real de columna, plano frontal. Y lo que el sillón más destruye: extensión torácica y glúteo medio.","steps":[{"t":"Extensión torácica sobre respaldo o rodillo","d":"Apoya el segmento torácico (no lumbar) sobre el borde de una silla o rodillo. Brazos cruzados en el pecho. Deja caer suavemente. Avanza segmento a segmento.","time":"30s · 8-10 segmentos"},{"t":"Pigeon pose activo","d":"Posición de paloma. Cada 15s contrae activamente el glúteo del lado de la pierna posterior 5 segundos.","time":"60s/lado · 2 series"},{"t":"Rotación torácica en decúbito","d":"Tumbado de lado, rodillas dobladas al 90°. El brazo superior gira lentamente hacia el techo y al suelo del otro lado. Rodillas no se separan.","time":"10 rep lentas/lado"},{"t":"Estiramiento de pectoral en marco","d":"Antebrazo apoyado en el marco de una puerta. Gira el cuerpo hasta notar el pectoral. A tres alturas: baja, media y alta.","time":"45s · 3 alturas/lado"},{"t":"Puente unilateral lento","d":"Tumbado, un pie en el suelo, el otro extendido. Sube la cadera apretando el glúteo. Pausa 2s arriba. Baja muy lento.","time":"10 rep/lado · pausa arriba"},{"t":"Neck CARs","d":"Sentado. Dibuja el círculo más pequeño posible con la cabeza, muy despacio. Sin dolor.","time":"3 círculos/dirección"}],"tip":"La extensión torácica sobre respaldo de silla es el ejercicio más importante. 2 minutos ahí equivalen a 20 minutos de lo demás."},{"id":"c4","cat":"emergencia","title":"Cervicales y trapecios","time":"4 min","why":"Para cuando llevas horas sobre un informe o el cuello empieza a protestar. No requiere suelo ni ropa de deporte.","steps":[{"t":"Chin tuck","d":"Sentado. Empuja suavemente la barbilla hacia atrás (doble papada). Mantén 5s. Corrige la proyección anterior de cabeza.","time":"10 rep · 5s cada una"},{"t":"Rotación cervical asistida","d":"Lleva la oreja hacia el hombro. Con la mano del mismo lado añade presión suave. Respira. Sin tirar con fuerza.","time":"30s/lado"},{"t":"Trapecio superior stretch","d":"Oreja hacia el hombro opuesto. Mano en la sien añade peso del brazo. El hombro del lado estirado hacia abajo.","time":"40s/lado"},{"t":"Shoulder rolls + retracción escapular","d":"Círculos de hombros lentos hacia atrás. Después: lleva los omóplatos juntos y abajo. Mantén 3s.","time":"10 círculos + 8 retracciones"}],"tip":"Puedes hacerlo en la silla entre pacientes o informes. Nadie notará que estiras el cuello en tu propia consulta."},{"id":"c5","cat":"emergencia","title":"Cadera y lumbar urgente","time":"5 min","why":"Cuando el psoas tira después de muchas horas sentado o tras una sesión con mucho Sled y Lunges.","steps":[{"t":"Knee to chest + rotación","d":"Tumbado boca arriba. Abraza una rodilla al pecho. Después llévala al lado opuesto cruzando la línea media. Hombros pegados al suelo.","time":"60s/lado"},{"t":"Hip flexor en caballero","d":"Rodilla en el suelo, pie delantero adelantado. Activa el glúteo del lado de la rodilla en el suelo. Empuja la cadera hacia delante sin inclinar el tronco.","time":"45s/lado · 2 series"},{"t":"Figure 4 stretch","d":"Tumbado boca arriba. Cruza el tobillo sobre la rodilla opuesta. Empuja suavemente la rodilla cruzada hacia fuera. Respira profundo.","time":"60s/lado"},{"t":"Child's pose con apertura lateral","d":"Postura del niño. Desde ahí camina las manos hacia un lado y mantén. Cambia al otro lado.","time":"30s centro + 30s/lado"}],"tip":"Si tienes molestia lumbar después de una sesión con peso, empieza siempre por Knee to chest y luego Figure 4. En ese orden."},{"id":"c6","cat":"emergencia","title":"Hombros y tren superior","time":"4 min","why":"Post-SkiErg, post-Sled Pull o cuando sientes los trapecios cargados. Para soltar la tensión acumulada en el tren superior.","steps":[{"t":"Doorway pec stretch","d":"Antebrazo en el marco. Rota el cuerpo. Hazlo en tres posiciones del brazo: 45°, 90° y 120° para cubrir todo el pectoral.","time":"30s · 3 posiciones/lado"},{"t":"Lat stretch en barra o marco","d":"Agarra un punto fijo a la altura de la cadera. Inclínate hacia atrás dejando que el dorsal se alargue. Rodillas ligeramente flexionadas.","time":"45s · 2 series"},{"t":"Cross-body shoulder stretch","d":"Lleva el brazo al pecho con el codo estirado. El otro brazo empuja suavemente por encima del codo. Hombro hacia abajo.","time":"40s/lado"},{"t":"Thoracic rotation de pie","d":"De pie, manos en los hombros, codos hacia fuera. Rota solo desde el torso. Las caderas quietas. Busca el máximo rango.","time":"10 rep lentas/lado"}],"tip":"El Lat stretch es el más ignorado y el más importante tras el SkiErg. El dorsal acortado limita la extensión torácica que necesitas para el tirón potente."},{"id":"c7","cat":"rehab","title":"Cuádriceps — Vasto lateral + Recto femoral","time":"8 min","urgente":true,"why":"Vasto lateral hipertónico (tensión lateral del muslo) que tracciona la rótula y sobrecarga el recto femoral y vasto medial en su zona distal. La causa está en el vasto lateral — libéralo primero, después trabaja la zona de dolor.","steps":[{"t":"Rodillo en vasto lateral","d":"Tumbado de lado, rodillo en la cara externa del muslo. Desde la cadera hasta 3 dedos por encima de la rótula. Pausas largas (40s) donde duela. No rodar rápido — presión sostenida.","time":"3-4 min · pausas largas"},{"t":"Pelota en zona de dolor (vasto medial / recto distal)","d":"Pelota de lacrosse o tenis en la zona interna del muslo distal (donde duele). Rodilla ligeramente flexionada. Presión sostenida 30-40s. No masajear — comprimir.","time":"2-3 puntos · 30-40s cada uno"},{"t":"Couch stretch","d":"Posición de caballero con el pie trasero elevado en una silla o sofá. Pelvis en retroversión (meter el abdomen y bascular pelvis hacia atrás ANTES de inclinar). Mantener sin dolor agudo.","time":"60-90s/lado · 2 series"},{"t":"Estiramiento IT band / vasto lateral de pie","d":"De pie, cruza la pierna afectada detrás de la sana. Inclínate lateralmente hacia el lado contrario con el brazo del lado afectado arriba. Nota el estiramiento en la cara externa del muslo.","time":"45-60s/lado · 3 series"},{"t":"Clamshell con banda","d":"Tumbado de lado, banda por encima de las rodillas. Abre la rodilla superior como una almeja sin mover la pelvis. Aprieta el glúteo medio en la cima. El glúteo medio débil es la causa raíz del vasto lateral hipertónico.","time":"15 rep/lado · 3 series"},{"t":"Wall sit excéntrico","d":"Espalda en la pared, rodillas a 90°. Mantén 20s. Después sube MUY LENTO (5-6 segundos). Reconstruye tolerancia del cuádriceps sin sobrecargar la zona dolorosa.","time":"3×10 · 5-6s subiendo"}],"tip":"Orden obligatorio: primero liberar el vasto lateral con el rodillo (la causa), después trabajar la zona de dolor (el efecto). Hacer esto en orden inverso es menos efectivo. Frecuencia mínima: rodillo diario, el resto 3×/semana."},{"id":"c8","cat":"rehab","title":"Aquiles bilateral — Protocolo isométricos + excéntricos","time":"7 min","why":"Tendinopatía de cuerpo medio bilateral. Los isométricos calman el dolor y estimulan la síntesis de colágeno. Los excéntricos reconstruyen la capacidad de carga del tendón. Protocolo de 8-12 semanas mínimo.","steps":[{"t":"Isométricos en escalón (DIARIO)","d":"De pie en un escalón, talón en el borde, rodilla ligeramente flexionada. Sube a puntas y mantén 45 segundos a una intensidad donde el dolor sea 3-4/10. Bajar lento. Hacer ANTES de cualquier actividad que cargue el tendón — el alivio post-isométrico dura 20-40 min.","time":"5×45s · ambos pies · diario"},{"t":"Heel drops excéntricos — rodilla recta","d":"En el borde de un escalón, sube con ambos pies. Baja SOLO con el pie a trabajar, muy lento (4-5 segundos bajando). El gastrocnemio es el protagonista.","time":"3×12/pie · 3×/semana"},{"t":"Heel drops excéntricos — rodilla flexionada","d":"Igual que el anterior pero con la rodilla ligeramente doblada. Ahora el sóleo trabaja más. Imprescindible para tendinopatía de cuerpo medio.","time":"3×12/pie · 3×/semana"},{"t":"Calf raise bilateral con carga progresiva","d":"Con peso adicional (mochila, chaleco) cuando los excéntricos sin carga ya no duelen. Progresión semanal.","time":"3×15 · cuando tolere"}],"tip":"SEÑAL DE ALARMA: si al día siguiente de entrenar tienes rigidez matutina >20 min, el volumen de ese día fue excesivo — reducir. Si el dolor en el tendón es >5/10 durante el ejercicio, parar. El dolor 3-4/10 durante los isométricos es normal y esperado."},{"id":"c9","cat":"rehab","title":"Cuello — Movilidad + Arnés progresivo","time":"6 min","why":"Rigidez cervical, contracturas y pérdida de extensión por sedentarismo + desequilibrio con el resto del cuerpo. Objetivo: cuello fuerte y móvil. Progresión muy conservadora — el cuello responde mal a cargas excesivas iniciales.","steps":[{"t":"Neck CARs (diario)","d":"Sentado con la espalda recta. Dibuja el círculo más pequeño y controlado posible con la cabeza. Muy despacio. Sin dolor agudo.","time":"3 círculos/dirección · diario"},{"t":"Extensión cervical asistida","d":"Con la mano en la nuca (no tirando, solo guiando), lleva suavemente la cabeza hacia atrás hasta el límite sin dolor. Mantén 20-30s. El movimiento más limitado — trabajarlo con más frecuencia.","time":"3×20-30s · diario"},{"t":"Isométrico manual — 4 direcciones","d":"Mano contra frente: empuja y resiste. Mano contra sien derecha: empuja y resiste. Mano contra sien izquierda. Mano contra nuca. Sin movimiento — solo tensión isométrica.","time":"5×10s cada dirección · diario"},{"t":"Arnés — Flexión y lateral (S3+)","d":"Con arnés, solo FLEXIÓN y movimiento LATERAL. Carga inicial 2kg. Progresión: +1kg cada 2 semanas si sin molestia al día siguiente. Hacer al final de sesión de fuerza, nunca de primero.","time":"3×12 flex + 3×10 lateral · 2-3×/semana"},{"t":"Arnés — Extensión (S4+, comenzar con 1kg)","d":"Solo cuando flexión y lateral estén asentadas y sin molestia posterior. Empezar con 1kg (menos que flexión). NUNCA empezar con 6kg — causa contractura en espalda alta.","time":"3×12 · 2-3×/semana · +1kg/2 semanas"}],"tip":"La contractura de espalda alta post-arnés significa que la carga fue excesiva. Volver a la mitad del peso y quedarte ahí 2 semanas. 6kg es el objetivo de diciembre, no de ahora."}];
function fichas(){ return (PROFILE.mobility&&PROFILE.mobility.length)?PROFILE.mobility:MOBCARDS; }
/* Un perfil que trae sus propias fichas normalmente también quiere sus propias
   categorías y su propio nombre: las de Miguel son de movilidad, las de Elena
   son de cabeza. Si no declara nada, hereda las de siempre. */
function mobCats(){ return (PROFILE.mobCats&&PROFILE.mobCats.length)?PROFILE.mobCats:MOBCATS; }
function mobTitle(){ return PROFILE.mobTitle||"🧘 Fichas de movilidad"; }
function mobBtn(){ return PROFILE.mobBtn||"🧘 FICHAS DE MOVILIDAD"; }
var mobCat="todas";
function abrirFichas(cat){
  if(cat) mobCat=cat;
  const cards=fichas().filter(c=>mobCat==="todas"||c.cat===mobCat);
  let html='<div class="ctitle">'+esc(mobTitle())+'</div>';
  html+='<div class="chips" style="margin-bottom:14px">';
  html+='<button class="btn3'+(mobCat==="todas"?' sel':'')+'" onclick="abrirFichas(\'todas\')">Todas</button>';
  mobCats().forEach(c=>{ const n=fichas().filter(x=>x.cat===c.id).length; if(!n) return;
    html+='<button class="btn3'+(mobCat===c.id?' sel':'')+'" style="'+(mobCat===c.id?'border-color:'+c.color+';color:'+c.color+';background:'+c.color+'18':'')+'" data-c="'+esc(c.id)+'" onclick="abrirFichas(this.dataset.c)">'+esc(c.label)+'</button>'; });
  html+='</div>';
  cards.forEach(c=>{
    const col=(mobCats().find(x=>x.id===c.cat)||{color:"#A3A9B3"}).color;
    html+='<div class="daybox" style="border-left:3px solid '+col+';cursor:pointer" data-id="'+esc(c.id)+'" onclick="verFicha(this.dataset.id)">'+
      '<div class="row"><span style="font-size:0.8125rem;font-weight:600">'+esc(c.title)+'</span>'+
      '<span class="mono dim" style="font-size:0.75rem">'+esc(c.time||'')+'</span></div>'+
      '<div class="dim" style="font-size:0.75rem;margin-top:3px">'+esc((c.why||'').slice(0,90))+(((c.why||'').length>90)?'…':'')+'</div></div>';
  });
  if(!cards.length) html+='<p class="dim" style="font-size:0.75rem">No hay fichas en esta categoría.</p>';
  html+='<button class="btn2" style="margin-top:10px" onclick="closeOverlay()">Cerrar</button>';
  overlay(html);
}
function verFicha(id){
  const c=fichas().find(x=>x.id===id); if(!c) return;
  const col=(mobCats().find(x=>x.id===c.cat)||{color:"#A3A9B3"}).color;
  let html='<div class="row" style="align-items:flex-start"><div><div class="ctitle mini" style="color:'+col+'">'+esc((mobCats().find(x=>x.id===c.cat)||{label:''}).label)+' · '+esc(c.time||'')+'</div>'+
    '<div class="ctitle" style="margin:4px 0 0">'+esc(c.title)+'</div></div>'+
    '<button class="btn3" onclick="abrirFichas()">← Volver</button></div>';
  if(c.why) html+='<div style="background:'+col+'14;border-left:3px solid '+col+';padding:10px 12px;border-radius:0 8px 8px 0;font-size:0.75rem;line-height:1.6;margin:12px 0">'+esc(c.why)+'</div>';
  html+='<div data-notr>';
  (c.steps||[]).forEach((p,i)=>{
    html+='<div class="daybox"><div class="row" style="margin-bottom:4px"><span style="font-size:0.8125rem;font-weight:600">'+(i+1)+'. '+esc(p.t)+'</span>'+
      (p.time?'<span class="mono" style="font-size:0.75rem;color:'+col+'">'+esc(p.time)+'</span>':'')+'</div>'+
      '<div style="font-size:0.75rem;line-height:1.6;color:#D9DCE3">'+esc(p.d||'')+'</div></div>';
  });
  html+='</div>';
  if(c.tip) html+='<div style="background:#FBF1DE14;border:1px solid #ffb34755;border-radius:10px;padding:10px 12px;font-size:0.75rem;line-height:1.6;color:#ffb347;margin-top:12px">'+esc(c.tip)+'</div>';
  html+='<button class="btn" style="margin-top:14px;background:#7BC96F;color:#fff" onclick="fichaHecha(\''+c.id+'\')">✓ COMPLETADA</button>';
  html+='<button class="btn2" style="margin:0" onclick="abrirFichas()">← Volver a las fichas</button>';
  overlay(html);
}
function fichaHecha(id){
  const c=fichas().find(x=>x.id===id);
  /* Una ficha marcada `sinRegistro` no pasa por el feedback: preguntarle el RPE
     y la duración a una niña de 10 años por hacer una rutina de respiración no
     tiene sentido, y ensuciaría su historial de sesiones. */
  if(c.sinRegistro){
    const t=todayISO(); st.fichasHechas=st.fichasHechas||{};
    st.fichasHechas[t]=st.fichasHechas[t]||[];
    if(!st.fichasHechas[t].includes(id)){ st.fichasHechas[t].push(id);
      /* C5 · máximo 3 fichas con puntos al día; las marcadas sinPuntos no dan */
      st.fichasPts=st.fichasPts||{}; const n=st.fichasPts[t]||0;
      if(!c.sinPuntos&&n<3){ st.fichasPts[t]=n+1; addPoints(PTS.rehab,"ficha: "+c.title); } }
    save(); closeOverlay(); toast("✓ "+c.title);
    return;
  }
  const min=parseInt((c.time||"10").replace(/[^0-9]/g,""))||10;
  st._fb={results:[],durationMin:min,mode:"mob",type:"Movilidad",feelings:[],notes:c.title};
  showFeedback();
}

function startMobilitySession(){
  const last=st.mobHistory[st.mobHistory.length-1];
  const worst=last?MOB_TESTS.filter(t=>last.scores[t.id]<=2):[];
  const blocks=[
    "Respiración + movilidad torácica (foam/rodillo) — 3 min",
    "Cadera: 90/90 + couch stretch — 4 min",
    "Tobillos: dorsiflexión con carga — 3 min",
    "Hombros: pass-throughs + cuelgue en barra — 3 min",
    "Isquios: jefferson curl suave — 3 min",
    "Cuello + antebrazos — 2 min",
  ];
  let html='<div class="ctitle">🧘 Sesión de movilidad — 20 min</div>';
  if(worst.length) html+='<div style="font-size:0.75rem;color:#ffb347;margin-bottom:8px">Dobla tiempo en: '+worst.map(t=>t.name).join(", ")+'</div>';
  blocks.forEach((b,i)=>{ html+='<div class="daybox" style="border-left:3px solid #7BC96F"><div style="font-size:0.75rem">'+(i+1)+'. '+b+'</div></div>'; });
  html+='<button class="btn" style="background:#7BC96F" onclick="finishMob()">✓ COMPLETADA (+'+PTS.mobilidad+' pts)</button>';
  overlay(html);
}
function finishMob(){
  st._fb={results:[],durationMin:20,mode:"mob",type:"Movilidad"};
  showFeedback();
}


/* pide un numero al usuario: cualquier selector puede tener opcion "Otro" */
function pedirNumero(titulo,ayuda,valor,min,max,cb){
  window._numCb=cb;
  overlay('<div class="ctitle">'+esc(titulo)+'</div>'+
   (ayuda?'<div class="dim" style="font-size:0.75rem;margin-bottom:10px">'+esc(ayuda)+'</div>':'')+
   '<input type="number" id="numLibre" value="'+valor+'" min="'+min+'" max="'+max+'" inputmode="numeric">'+
   '<button class="btn" style="margin-top:14px" onclick="aplicarNumero('+min+','+max+')">APLICAR</button>');
  setTimeout(()=>{const e=$("numLibre"); if(e){e.focus();e.select();}},60);
}
function aplicarNumero(min,max){
  const v=parseInt($("numLibre").value);
  if(isNaN(v)||v<min||v>max){ toast("Pon un número entre "+min+" y "+max); return; }
  const cb=window._numCb; window._numCb=null; cb(v);
}
function chipsNum(lista,actual,fn,titulo,ayuda,min,max,suf){
  let h2='';
  lista.forEach(v=>{ h2+='<button class="btn3'+(actual===v?' sel':'')+'" onclick="'+fn+'('+v+')">'+v+(suf||'')+'</button>'; });
  const libre=!lista.includes(actual);
  h2+='<button class="btn3'+(libre?' sel':'')+'" onclick="pedirNumero(\''+titulo+'\',\''+(ayuda||'')+'\','+actual+','+min+','+max+',v=>'+fn+'(v))">'+(libre?actual+(suf||''):'Otro…')+'</button>';
  return h2;
}

function fpResults(fmt,roundsDone,mins){

    return B.ex.map(x=>({name:x.name,avgPace:null,totalReps:tot})); }
  if(fmt==="emom"){ const perEx=Math.floor((mins/((B.every||1)))/B.ex.length);
    return B.ex.map(x=>({name:x.name,avgPace:null,totalReps:x.reps*perEx})); }
  if(fmt==="classic") return B.ex.map(x=>({name:x.name,avgPace:null,totalReps:x.reps*B.sets}));
  return B.ex.map(x=>({name:x.name,avgPace:null,totalReps:x.reps*roundsDone})); // amrap/fortime/circuit
}

/* ── PLAYER DE FORMATOS ── */
var FP={timers:[]};
function fpClear(){ (FP.timers||[]).forEach(clearInterval); FP.timers=[]; }
function fpRender(){
  if(window._cfOpen) return;
  const f=FP.fmt, meta=FORMATS[f];
  const countdown=(f==="amrap"||f==="emom");
  const totalSec=countdown?FP.mins*60:null;
  const remain=countdown?Math.max(0,totalSec-FP.elapsed):null;
  const shown=countdown?remain:FP.elapsed;
  const mm=String(Math.floor(shown/60)).padStart(2,"0"), ss=String(shown%60).padStart(2,"0");
  let html='<div class="row" style="margin-bottom:10px"><span class="mono dim" style="font-size:0.75rem">'+meta.icon+' '+meta.name+'</span><button class="btn3" onclick="fpQuit()">✕ Salir</button></div>';

    html+='<div class="chips" style="margin-bottom:10px">'+sch.map((r,i)=>'<span class="tagz" style="background:'+(i<FP.rung?'#A8E63E22;color:#A8E63E':i===FP.rung?'#7BC96F22;color:#7BC96F':'#1F252D;color:#A3A9B3')+'">'+r+'</span>').join("")+'</div>';
    html+='<div style="text-align:center;margin-bottom:8px"><span class="big" style="font-size:2.75rem;color:#7BC96F">'+(sch[FP.rung]!=null?sch[FP.rung]:"✓")+'</span> <span class="mono dim" style="font-size:0.75rem">reps de cada uno</span></div>';
  }
  if(f==="emom"){ const ev=FP.every||60; const blq=Math.floor(FP.elapsed/ev); const cur=FP.ex[blq%FP.ex.length]; const nxt=FP.ex[(blq+1)%FP.ex.length];
    const inMin=ev-(FP.elapsed%ev), cu=cur.unit&&cur.unit!=="reps"?" "+cur.unit:"";
    const totBlq=Math.floor(FP.mins*60/ev);
    html+='<div style="text-align:center;margin-bottom:8px"><div class="mono dim" style="font-size:0.75rem;letter-spacing:2px">'+(ev===60?'MINUTO ':'BLOQUE ')+(blq+1)+'/'+totBlq+' · quedan <span id="fpinmin">'+inMin+'</span>s</div><div class="big" style="font-size:1.875rem;color:#A8E63E">'+(cur.erg?"🚣 ":"")+esc(cur.name)+' '+(cu?cur.reps+cu:"×"+cur.reps)+'</div><div class="dim" style="font-size:0.75rem">siguiente: '+esc(nxt.name)+'</div></div>';
  }
  // lista de ejercicios (una ronda)
  if(f!=="emom") FP.ex.forEach(e=>{ const u=e.unit&&e.unit!=="reps"?e.unit:null;
    html+='<div class="daybox" style="padding:7px 11px"><div class="row"><span style="font-size:0.8125rem;font-weight:600">'+(e.erg?"🚣 ":"")+esc(e.name)+'</span><span class="mono" style="font-size:0.75rem;color:#7BC96F">'+(f==="ladder"&&!e.erg?"↕":(u?e.reps+" "+u:"×"+e.reps))+'</span></div></div>'; });
  // reloj
  html+='<div style="text-align:center;margin:10px 0"><div class="big" id="fpclock" style="font-size:3.75rem;letter-spacing:4px;color:'+(FP.running?(countdown&&remain<60?'#FF6B5A':'#7BC96F'):'#ECEEF2')+'">'+mm+':'+ss+'</div><div class="mono dim" style="font-size:0.75rem;letter-spacing:2px">'+(countdown?"CUENTA ATRÁS":"TIEMPO")+(FP.cap&&f==="fortime"?' · CAP '+FP.cap+"'":'')+'</div></div>';
  if(f==="circuit"&&FP.restEnd){ const r=Math.max(0,Math.ceil((FP.restEnd-Date.now())/1000));
    html+='<div style="text-align:center;border:1px solid var(--warn);border-radius:14px;padding:10px;margin-bottom:10px"><div class="mono" style="font-size:0.75rem;letter-spacing:3px;color:var(--warn)">DESCANSO</div><div class="big" id="fprest" style="font-size:3rem;color:var(--warn)">'+r+'</div><button class="btn3" onclick="FP.restEnd=0;fpRender()">Saltar descanso</button></div>'; }
  // rondas
  if(f==="amrap") html+='<div style="text-align:center;margin-bottom:10px"><span class="big" style="font-size:2.5rem;color:#A8E63E">'+FP.done+'</span> <span class="mono dim" style="font-size:0.75rem">RONDAS</span></div>';
  if(f==="fortime"||f==="circuit") html+='<div style="text-align:center;margin-bottom:10px"><span class="big" style="font-size:2.5rem;color:#A8E63E">'+FP.done+'</span><span class="mono dim" style="font-size:0.75rem">/'+FP.rounds+' RONDAS</span></div>';
  if(!FP.running&&FP.elapsed===0) html+='<button class="btn xl" onclick="fpToggle()">▶ EMPEZAR</button>';
  else{
    if(f==="amrap") html+='<button class="btn xl" onclick="fpRound()">+1 RONDA</button>';
    if(f==="fortime"||f==="circuit") html+='<button class="btn xl" onclick="fpRound()">✓ RONDA HECHA</button>';
    if(f==="ladder") html+='<button class="btn xl" onclick="fpRung()">✓ PELDAÑO HECHO</button>';
    html+='<div style="display:flex;gap:8px"><button class="btn2" style="margin:0;flex:1" onclick="fpToggle()">'+(FP.running?'⏸ Pausa':'▶ Seguir')+'</button><button class="btn2" style="margin:0;flex:1" onclick="fpFinish()">🏁 Terminar</button></div>';
  }
  overlay(html,{modal:true});

function fpToggle(){
  if(FP.running){ FP.elapsed=Math.floor(FP.base+(Date.now()-FP.t0)/1000); FP.running=false; fpClear(); soltarPantalla(); fpRender(); return; }
  FP.running=true; pedirPantalla();
  FP.base=FP.elapsed||0; FP.t0=Date.now(); FP._lastBlk=Math.floor(FP.base/(FP.every||60)); FP._lastSec=FP.base;
  FP.tick=()=>{
    if(!FP.running) return;
    FP.elapsed=Math.floor(FP.base+(Date.now()-FP.t0)/1000);
    if(FP.elapsed===FP._lastSec) return;
    const prev=FP._lastSec; FP._lastSec=FP.elapsed;
    const f=FP.fmt, countdown=(f==="amrap"||f==="emom");
    const totalSec=FP.mins*60;
    if(f==="emom"){
      const ev=FP.every||60, blk=Math.floor(FP.elapsed/ev);
      const inMin=ev-(FP.elapsed%ev);
      const im=$("fpinmin"); if(im) im.textContent=inMin;
      if(blk!==FP._lastBlk&&FP.elapsed<totalSec){ FP._lastBlk=blk; beep(990,0.12); setTimeout(()=>beep(990,0.12),160); say(trTxt("Siguiente")); fpRender(); return; }
      if(inMin<=3&&FP.elapsed-prev<3) beep(440,0.08);
    }
    if(FP.fmt==="circuit"&&FP.restEnd){
      const r=Math.ceil((FP.restEnd-Date.now())/1000), el=$("fprest");
      if(el) el.textContent=Math.max(0,r);
      if(r<=3&&r>0) beep(440,0.08);
      if(r<=0){ FP.restEnd=0; beep(660,0.2); say(trTxt("Siguiente ronda")); fpRender(); }
    }
    if(countdown){
      const remain=totalSec-FP.elapsed;
      if(remain<=0){ fpFinish(); return; }
      if(remain<=3) beep(440,0.1);
      const c=$("fpclock"); if(c) c.textContent=mmss(remain);
    } else {
      if(FP.cap&&FP.fmt==="fortime"&&FP.elapsed>=FP.cap*60){ toast("⏱ Time cap"); fpFinish(); return; }
      const c=$("fpclock"); if(c) c.textContent=mmss(FP.elapsed);
    }
  };
  FP.t=setInterval(()=>FP.tick(),250);
  FP.timers.push(FP.t);
  beep(660,0.15); fpRender();
}
function fpResume(){ /* tras re-render el interval sigue vivo */ }
function fpRound(){
  FP.done++; beep(880,0.1);
  if((FP.fmt==="fortime"||FP.fmt==="circuit")&&FP.done>=FP.rounds){ fpFinish(); return; }
  /* C8 · el circuito cronometra de verdad el descanso entre rondas */
  if(FP.fmt==="circuit"&&FP.rest){ FP.restEnd=Date.now()+FP.rest*1000; }
  fpRender();
}
function fpRung(){
  FP.rung++; beep(880,0.1);
  if(FP.rung>=FP.scheme.length){ fpFinish(); return; }
  fpRender();
}
function fpFinish(){
  if(FP.finished) return; FP.finished=true;
  if(FP.running) FP.elapsed=Math.floor(FP.base+(Date.now()-FP.t0)/1000);
  fpClear(); FP.running=false; soltarPantalla();
  const mins=Math.max(1,Math.round(FP.elapsed/60));
  const rd=FP.fmt==="ladder"?FP.rung:(FP.done||1);
  const tlabel=String(Math.floor(FP.elapsed/60)).padStart(2,"0")+":"+String(FP.elapsed%60).padStart(2,"0");
  const metric=FP.fmt==="amrap"?{v:FP.done,label:FP.done+" rondas",hi:true}:
    FP.fmt==="emom"?{v:mins,label:mins+" min",hi:true}:
    {v:FP.elapsed,label:tlabel,hi:false};
  st._fb={results:fpResults(FP.fmt,rd,mins),durationMin:mins,mode:"wod",metric,formatName:FORMATS[FP.fmt].name+
    (FP.fmt==="amrap"?" — "+FP.done+" rondas":FP.fmt==="fortime"?" — "+tlabel:"")};
  showFeedback();
}
function fpQuit(){
  if(!(FP.elapsed>0)){ fpClear(); FP.finished=true; closeOverlay(); return; }
  confirmar("¿Salir sin guardar?","Llevas "+mmss(FP.elapsed)+" de WOD. Si sales ahora no se registrará.","Salir sin guardar",()=>{ fpClear(); FP.running=false; FP.finished=true; soltarPantalla(); closeOverlay(); },"Seguir",()=>fpRender(),true);
}

/* ═══════════════════ INIT ═══════════════════ */
const _origClose=closeOverlay;
closeOverlay=function(){ pClear(); fpClear(); FP.running=false; PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false; st._ckDate=null; st._ckDraft=null; window._cfOpen=false; soltarPantalla(); _origClose(); };

function applyProfile(p){
  PROFILE=Object.assign({},PROFILE,p||{});
  /* Las plantillas NO se heredan. Object.assign le daba las de Miguel a
     cualquier perfil que no declarase `presets`, y eso le puso a Iker —
     operado del dedo, sin material — un botón de "Burpee Broad Jump bajo
     fatiga". Quien quiera plantillas, que las declare en su JSON. */
  const tiene=k=>p&&Object.prototype.hasOwnProperty.call(p,k);
  if(p && !tiene("presets")) PROFILE.presets=[];
  /* C14 · lo mismo con hábitos, carreras y referencias */
  if(p && !tiene("habits")) PROFILE.habits=null;
  if(p && !tiene("races")) PROFILE.races=[];
  if(p && !tiene("refs")) PROFILE.refs={tests:[],run:[],erg:[],goals:[]};
  if(PROFILE.zones) ZONES=PROFILE.zones;
  if(PROFILE.refs) REFS=PROFILE.refs;
  if(PROFILE.plan&&PROFILE.plan.length) PLAN=PROFILE.plan;
  if(PROFILE.id&&PROFILE.id!=="miguel") KEY="deka-trainer-v4-"+PROFILE.id;
  trBuild();
  st=loadState();
  if(PROFILE.planStart&&!st._startSet){ st.planStart=PROFILE.planStart; st._startSet=true; save(); }
  try{ document.title=PROFILE.appName||"Hybrid Train"; }catch(e){}
}
const VERSION="v22 · 15 nov 2026";
/* El manifest se construye en caliente para que start_url conserve el ?plan=.
   Si iOS lo ignora y usa la URL actual, también es la correcta: por los dos caminos funciona. */
function manifestDinamico(id){
  try{
    // manifest real por persona: Chrome en Android necesita un archivo de verdad
    // (mismo origen) para considerar la app instalable y respetar start_url.
    const href = id ? ("manifest-"+id+".webmanifest") : "manifest.webmanifest";
    const l=document.createElement("link"); l.rel="manifest"; l.href=href;
    document.head.appendChild(l);
    // el nombre que se ve bajo el icono
    const t=document.querySelector('meta[name=apple-mobile-web-app-title]');
    if(t&&PROFILE.appName) t.content=PROFILE.appName;
  }catch(e){}
}
function esStandalone(){
  return window.navigator.standalone===true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}
/* recuerda qué plan usa este dispositivo: al instalar como app, iOS puede
   perder el ?plan= de la URL, así que no podemos depender solo del parámetro */
const KEYPLAN="deka-plan-id";
function planGuardado(){ try{ return localStorage.getItem(KEYPLAN)||""; }catch(e){ return ""; } }
function recordarPlan(id){ try{ id?localStorage.setItem(KEYPLAN,id):localStorage.removeItem(KEYPLAN); }catch(e){} }
/* C11 · un plan mal formado no deja la pantalla en blanco: dice qué falla */
function validarPlan(plan){
  const errs=[];
  if(!Array.isArray(plan)||!plan.length) return ["El plan no tiene semanas."];
  const ms=mesos().map(m=>m.id);
  plan.forEach((w,i)=>{
    const n="Semana "+(w.w||i+1);
    if(!Array.isArray(w.days)||w.days.length!==7) errs.push(n+": tiene "+((w.days||[]).length)+" días en vez de 7.");
    if(PROFILE.mesos&&w.m!=null&&!ms.includes(w.m)) errs.push(n+": el bloque m="+w.m+" no existe en «mesos».");
    (w.days||[]).forEach((d,j)=>{ if(!d||!d.t) errs.push(n+", día "+(j+1)+": falta el tipo (t).");
      else if(!DTYPE[d.t]) errs.push(n+", "+(d.d||"día "+(j+1))+": el tipo «"+d.t+"» no existe en la app."); });
  });
  return errs;
}
function pantallaPlanRoto(errs){
  $("app").innerHTML='<div class="card" style="margin:48px 14px"><div class="ctitle">Este plan tiene un error</div><div style="font-size:0.9375rem;line-height:1.6;color:var(--text-2);margin-bottom:12px">No puedo abrirlo hasta que se corrija. Envíale esta lista a quien te preparó el plan:</div><div data-notr style="font-size:0.875rem;line-height:1.7;background:var(--bg);border-radius:10px;padding:12px">'+errs.slice(0,12).map(esc).join("<br>")+(errs.length>12?'<br>… y '+(errs.length-12)+' más':'')+'</div><button class="btn" style="margin-top:14px" onclick="location.reload()">REINTENTAR</button></div>';
}
/* ── S10 · Comprobador de planes ───────────────────────────────────────────
   Revisa el plan cargado antes de que nadie lo descubra entrenando. */
const IMPACTO=["BURPEES","BURPEE BROAD JUMP","BURPEES TO PLATE","BROAD JUMP","BOX JUMP","SQUAT JUMPS","JUMPING JACKS","DOUBLE UNDERS","POGOS","SALTO VERTICAL","MOUNTAIN CLIMBERS","SPRAWLS","DEVIL PRESS","LUNGES TO BOX","STEP-UP CHALECO"];
function revisarPlan(){
  const out={err:[],aviso:[],ok:[]};
  validarPlan(PLAN).forEach(x=>out.err.push(x));
  // tipos sin familia (sin color propio)
  const tipos=[...new Set(PLAN.flatMap(w=>(w.days||[]).map(d=>d.t)))].filter(Boolean);
  tipos.filter(t=>DTYPE[t]&&famTipo(t).k==="gray"&&!["Descanso","Otra actividad"].includes(t)).forEach(t=>out.aviso.push("El tipo «"+t+"» no tiene color de familia."));
  // ejercicios que el lector no reconoce
  const noLeidos=[];
  PLAN.forEach(w=>(w.days||[]).forEach(d=>{ const dt=DTYPE[d.t]; if(!dt||dt.mode!=="wod") return;
    const r=leerSesionDelPlan(d.main); (r.extra||[]).forEach(x=>noLeidos.push("S"+w.w+" "+(d.d||"").slice(0,3)+": "+x)); }));
  if(noLeidos.length) out.aviso.push("El lector no reconoce "+noLeidos.length+" ejercicio"+(noLeidos.length>1?"s":"")+" (se mostrarán como texto):<br>· "+noLeidos.slice(0,15).map(esc).join("<br>· ")+(noLeidos.length>15?"<br>… y "+(noLeidos.length-15)+" más":""));
  // plantillas con ejercicios sin ficha
  (PROFILE.presets||[]).forEach(p=>(p.ex||[]).forEach(x=>{ if(!baseEjercicios().some(e=>e.name===x.name)) out.err.push("La plantilla «"+p.name+"» usa «"+x.name+"», que no existe en la base de ejercicios."); }));
  // inicio en lunes
  const dIni=dateFromISO(st.planStart); if((dIni.getDay()+6)%7!==0) out.err.push("El inicio del plan en este móvil ("+st.planStart+") no es lunes.");
  if(PROFILE.planStart){ const d=dateFromISO(PROFILE.planStart); if((d.getDay()+6)%7!==0) out.err.push("El planStart del archivo ("+PROFILE.planStart+") no es lunes."); }
  // impacto sin vetar en perfiles de solo peso corporal
  if(PROFILE.soloCuerpo){
    const sinVeto=IMPACTO.filter(n=>{ const e=baseEjercicios().find(x=>x.name===n); return e&&exEquip(e)==="ninguno"&&!(PROFILE.exclude||[]).includes(n); });
    if(sinVeto.length) out.aviso.push("Perfil de solo peso corporal con ejercicios de impacto sin vetar (el generador puede proponerlos): "+sinVeto.join(", ")+". Si es a propósito, ignóralo.");
  }
  if(!out.err.length) out.ok.push(PLAN.length+" semanas, "+PLAN.reduce((a,w)=>a+(w.days||[]).length,0)+" días, todos con tipo válido.");
  return out;
}
function abrirComprobador(){
  const r=revisarPlan();
  const blq=(t,c,l)=>l.length?'<div class="ctitle mini" style="color:'+c+';margin-top:12px">'+t+'</div>'+l.map(x=>'<div data-notr style="font-size:.875rem;line-height:1.55;padding:8px 0;border-bottom:1px solid var(--line)">'+x+'</div>').join(""):"";
  overlay('<div class="ctitle">🔍 Comprobar plan</div><div class="dim" style="font-size:.875rem">Plan: <b data-notr>'+esc(planLabel())+'</b> · archivo <span data-notr>'+esc(planGuardado()||"por defecto")+'</span></div>'+
    blq("✗ Errores","var(--danger)",r.err)+blq("⚠ Revisar","var(--warn)",r.aviso)+blq("✓ Bien","var(--ok)",r.ok)+
    (!r.err.length&&!r.aviso.length?'<div class="aviso w" style="margin-top:12px;border-color:var(--ok)">Todo en orden.</div>':'')+
    '<button class="btn2" style="margin-top:14px" onclick="closeOverlay()">Cerrar</button>');
}

/* C13 · aviso de versión nueva */
function avisoVersionNueva(){
  if($("upd")) return;
  const b=document.createElement("button"); b.id="upd"; b.className="upd";
  b.textContent=trTxt("Hay una versión nueva · toca para actualizar");
  b.onclick=()=>{ window._swRecargar=true; try{ navigator.serviceWorker.getRegistration().then(r=>{ if(r&&r.waiting) r.waiting.postMessage("skip"); else location.reload(); setTimeout(()=>location.reload(),1500); }); }catch(e){ location.reload(); } };
  document.body.appendChild(b);
}
async function boot(){
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  const enURL=(new URLSearchParams(location.search).get("plan")||"").trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
  if(enURL) recordarPlan(enURL==="miguel"?"":enURL);   // el parámetro manda y se memoriza
  const id = enURL || planGuardado();
  if(id&&id!=="miguel"){
    $("app").innerHTML='<div class="cargando">Cargando tu plan…</div>';
    try{
      const r=await fetch("planes/"+id+".json",{cache:"no-cache"});
      if(!r.ok) throw new Error(r.status);
      applyProfile(await r.json());
    }catch(e){
      /* sin cobertura el plan puede estar simplemente sin descargar todavía:
         decir "no encontrado" ahí sería mentir y mandarte a buscar un enlace
         que está bien */
      document.getElementById("app").innerHTML = navigator.onLine===false
        ? '<div class="card" style="margin:60px 14px"><div class="ctitle">Sin conexión</div><div style="font-size:0.8125rem;line-height:1.6">Este plan todavía no está guardado en el móvil. Ábrelo una vez con datos o wifi y a partir de ahí funcionará también sin cobertura.</div><button class="btn" style="margin-top:12px" onclick="location.reload()">REINTENTAR</button></div>'
        : '<div class="card" style="margin:60px 14px"><div class="ctitle">Plan no encontrado</div><div style="font-size:0.8125rem;line-height:1.6">No he podido cargar <b>planes/'+esc(id)+'.json</b>.<br><br>Lo más habitual es que el plan todavía no esté subido. Si es tuyo, vuelve a intentarlo dentro de un rato.</div><button class="btn" style="margin-top:12px" onclick="location.reload()">REINTENTAR</button><div class="dim" style="font-size:0.75rem;margin:14px 0 6px;line-height:1.5">Si este dispositivo es el de Miguel, puedes cargar su plan. Ojo: el aparato se quedará con ese plan hasta que lo cambies en Más → Cambiar de plan.</div><button class="btn3" style="width:100%" onclick="recordarPlan(\'\');location.search=\'\'">Usar el plan de Miguel en este dispositivo</button></div>';
      return;
    }
  } else {
    // primera vez en la app instalada, sin parámetro ni memoria: preguntar en vez de asumir
    if(!enURL && !planGuardado() && esStandalone() && !localStorage.getItem("deka-trainer-v4")){
      manifestDinamico("");
      return elegirPlanInicial();
    }
    applyProfile(null);
  }
  manifestDinamico(PROFILE.id==="miguel"?"":PROFILE.id);
  const errsPlan=validarPlan(PLAN); if(errsPlan.length){ pantallaPlanRoto(errsPlan); return; }
  try{ revisarSemanaPerfecta(); }catch(e){}
  checkBadges();
  render();
}
function elegirPlanInicial(){
  document.getElementById("app").innerHTML=
   '<div class="card" style="margin:48px 14px"><div class="ctitle">¿De quién es este plan?</div>'+
   '<div style="font-size:0.8125rem;line-height:1.6;color:#A3A9B3;margin-bottom:14px">Al instalar la app se ha perdido el identificador del enlace. Escribe el tuyo una sola vez y ya queda guardado en este móvil.</div>'+
   '<input type="text" id="planIni" placeholder="marchena, iker, lydia…" autocapitalize="off" autocorrect="off">'+
   '<button class="btn" style="margin-top:12px" onclick="fijarPlanInicial()">CONTINUAR</button>'+
   '<button class="btn2" style="margin:0" onclick="fijarPlanInicial(true)">Usar el plan por defecto</button></div>';
  setTimeout(()=>{const e=document.getElementById("planIni"); if(e) e.focus();},80);
}
function fijarPlanInicial(defecto){
  const v=defecto?"":((document.getElementById("planIni").value||"").trim().toLowerCase().replace(/[^a-z0-9_-]/g,""));
  recordarPlan(v==="miguel"?"":v);
  location.href=location.pathname+(v&&v!=="miguel"?"?plan="+v:"?plan=miguel");
}
boot();

/* Service worker: guarda la app en el móvil para que abra al instante y
   funcione sin cobertura. Solo en https, que es lo que sirve GitHub Pages;
   abriendo el archivo en local no se registra y no pasa nada. */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").then(reg=>{
    const vigilar=w=>{ if(!w) return; w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) avisoVersionNueva(); }); };
    if(reg.waiting&&navigator.serviceWorker.controller) avisoVersionNueva();
    vigilar(reg.installing); reg.addEventListener("updatefound",()=>vigilar(reg.installing));
  }).catch(()=>{});
    let recargado=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!recargado&&window._swRecargar){ recargado=true; location.reload(); } });
  });
}
