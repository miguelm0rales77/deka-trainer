/* ═══════════════════ CORE: estado, fechas, carga, puntos ═══════════════════ */
const KEY = "deka-trainer-v4";
const defaultState = {
  planStart: "2026-07-20",           // lunes de la S1
  sessions: [],                       // {id,date,week,dayIdx,type,mode,exercises,durationMin,rpe,srpe,fcAvg,z2ok,feelings,notes,muscleLoad,points}
  savedPaces: {}, paceHistory: [],
  mobHistory: [],
  checkins: {},                       // "YYYY-MM-DD": {soreness:{}, sleep:1-5, habits:{}}
  points: 0, pointsLog: [],
  rewards: [], badges: [], perfectWeeks: 0,
};
var st = loadState();
function loadState(){ try{ const r=localStorage.getItem(KEY); if(r) return Object.assign({},defaultState,JSON.parse(r)); }catch(e){} return JSON.parse(JSON.stringify(defaultState)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

/* ── fechas ── */
function todayISO(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function dateFromISO(s){ const a=s.split("-"); return new Date(+a[0],+a[1]-1,+a[2]); }
function daysBetween(a,b){ return Math.round((dateFromISO(b)-dateFromISO(a))/864e5); }
function planPos(dISO){ // {week (1-13 | 0 pre | -1 post), dayIdx 0-6}
  const diff = daysBetween(st.planStart, dISO||todayISO());
  if(diff<0) return {week:0, dayIdx:0, pre:-diff};
  const w = Math.floor(diff/7)+1;
  if(w>PLAN.length) return {week:-1, dayIdx:0};
  return {week:w, dayIdx:diff%7};
}
function planDay(week,dayIdx){ const wk=PLAN[week-1]; return wk ? wk.days[dayIdx] : null; }
const DAYNAMES=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

/* ── carga muscular ── */
function sessionMuscleLoad(exercises){ // exercises: [{name, totalReps, weightNum?}]
  const load={};
  exercises.forEach(e=>{
    const ex=EXDB.find(x=>x.name===e.name); if(!ex) return;
    const vol=(e.totalReps||0)*(ex.unit==="m"?0.05:ex.unit==="cal"?0.8:ex.unit==="seg"?0.3:1);
    Object.entries(ex.m).forEach(([mus,c])=>{ load[mus]=(load[mus]||0)+c*vol*ex.wf; });
  });
  return load;
}
function dailyLoads(){ // {date: {muscle: load}}
  const by={};
  st.sessions.forEach(s=>{ if(!s.muscleLoad) return; const d=by[s.date]=by[s.date]||{};
    Object.entries(s.muscleLoad).forEach(([m,v])=>d[m]=(d[m]||0)+v); });
  return by;
}
function windowLoad(days){ // media diaria por músculo en últimos N días
  const by=dailyLoads(), out={}, today=todayISO();
  MUSCLES.forEach(mu=>out[mu.id]=0);
  Object.entries(by).forEach(([d,ml])=>{ const age=daysBetween(d,today);
    if(age>=0&&age<days) Object.entries(ml).forEach(([m,v])=>out[m]+=v); });
  MUSCLES.forEach(mu=>out[mu.id]/=days);
  return out;
}
function acwr(){ // ratio agudo(7d):crónico(28d) por músculo
  const a=windowLoad(7), c=windowLoad(28), out={};
  MUSCLES.forEach(mu=>{ out[mu.id] = c[mu.id]>0.01 ? a[mu.id]/c[mu.id] : (a[mu.id]>0?1:0); });
  return out;
}
function sorenessToday(){ const c=st.checkins[todayISO()]; return c?c.soreness||{}:{}; }
function muscleStatus(){ // por músculo: {load7, ratio, sore, flag: ok|alto|sobrecarga}
  const a=windowLoad(7), r=acwr(), sore=sorenessToday(), out={};
  const max7=Math.max(0.01,...Object.values(a));
  MUSCLES.forEach(mu=>{
    const rel=a[mu.id]/max7, ratio=r[mu.id], s=sore[mu.id]||0;
    let flag="ok";
    if(ratio>1.5&&rel>0.4) flag="sobrecarga"; else if(s>=2||rel>0.75) flag="alto";
    out[mu.id]={rel,ratio,sore:s,flag};
  });
  return out;
}

/* ── sRPE y Z2 ── */
function computeSRPE(rpe,min){ return (rpe||0)*(min||0); }
function z2Check(fcAvg){ return fcAvg!=null && fcAvg>0 && fcAvg<=ZONES.Z2[1]; }

/* ── disciplina (semana actual) ── */
function weekDates(week){ const start=dateFromISO(st.planStart); start.setDate(start.getDate()+(week-1)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return todayISO(d);}); }
function disciplineWeek(week){
  const wk=PLAN[week-1]; if(!wk) return null;
  const dates=weekDates(week), today=todayISO();
  let plannedDue=0, done=0, mobDue=0, mobDone=0, habitPts=0, habitMax=0, checks=0, checksDue=0;
  dates.forEach((d,i)=>{
    const day=wk.days[i], past=daysBetween(d,today)>=0;
    if(!past) return;
    checksDue++; if(st.checkins[d]&&st.checkins[d]._saved) checks++;
    const c=st.checkins[d];
    if(c){ habits().forEach(hb=>{ const w=hb.w||1; habitMax+=w; if((c.habits||{})[hb.id]) habitPts+=w; }); }
    if(day.t!=="Descanso"&&day.t!=="COMPETICIÓN"){ plannedDue++;
      const s=st.sessions.find(x=>x.date===d&&x.mode!=="checkin");
      if(s) done++;
      if(day.t==="Movilidad"){ mobDue++; if(s&&s.type==="Movilidad") mobDone++; }
    }
  });
  const adh = plannedDue? done/plannedDue : 1;
  const hab = habitMax? habitPts/habitMax : 0;
  const chk = checksDue? checks/checksDue : 0;
  const score = Math.round((adh*0.5 + hab*0.3 + chk*0.2)*100);
  return {score, adh, hab, chk, done, plannedDue, mobDue, mobDone};
}
function checkinStreak(s){ s=s||st;
  const ok=k=>s.checkins[k]&&s.checkins[k]._saved;
  let n=0; const d=new Date();
  if(!ok(todayISO(d))) d.setDate(d.getDate()-1); // hoy aún sin hacer no rompe la racha
  while(ok(todayISO(d))){ n++; d.setDate(d.getDate()-1); }
  return n; }

/* ── DEKA score y categorías ── */
const CATS=[
  {id:"metabólico",label:"METAB",icon:"🔥",color:"#ff4f3a"},
  {id:"fuerza",label:"FUERZA",icon:"💪",color:"#a78bfa"},
  {id:"movilidad",label:"MOVIL",icon:"🧘",color:"#3affb8"},
  {id:"disciplina",label:"DISCIP",icon:"🎯",color:"#ffb347"},
  {id:"running",label:"RUN",icon:"🏃",color:"#3ab4ff"},
  {id:"ergómetros",label:"ERGO",icon:"🚣",color:"#e8ff3a"},
];
function catScore(catId){
  if(catId==="movilidad"){ if(!st.mobHistory.length) return null;
    const last=st.mobHistory[st.mobHistory.length-1]; const v=Object.values(last.scores);
    return v.length?(v.reduce((a,b)=>a+b,0)/v.length)*20:null; }
  if(catId==="disciplina"){ const pos=planPos(); if(pos.week<1) return null;
    const d=disciplineWeek(pos.week); return d?d.score:null; }
  const paces=st.paceHistory.filter(h=>{const e=EXDB.find(x=>x.name===h.exercise);return e&&(e.cat===catId||(catId==="metabólico"&&e.cat==="hyrox"));}).map(h=>h.pace);
  if(catId==="running"||catId==="ergómetros"){
    const n=st.sessions.filter(s=>s.mode==="pacer"&&((catId==="running"&&/Carrera|Comp/.test(s.type))||(catId==="ergómetros"&&/Erg|Bici|Umbral|Test/.test(s.type)))).length;
    if(!n&&!paces.length) return null; return Math.min(99,30+n*4+(paces.length?paces.reduce((a,b)=>a+b,0)/paces.length*0.1:0));
  }
  if(!paces.length) return null;
  return Math.min(99,40+(paces.reduce((a,b)=>a+b,0)/paces.length)*0.18);
}
function dekaScore(){ const s=CATS.map(c=>catScore(c.id)).filter(x=>x!==null); return s.length?s.reduce((a,b)=>a+b,0)/s.length:0; }

/* ── audio ── */
let audioCtx=null;
function beep(freq,dur){ freq=freq||880; dur=dur||0.06;
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.frequency.value=freq; o.type="sine";
    g.gain.setValueAtTime(0.25,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime+dur);
  }catch(e){} }

/* ── check-in (editable cualquier día de la semana en curso) ── */
function ckWeekDates(){ // lun–dom de la semana natural actual
  const now=new Date(); const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return todayISO(d); });
}
function openCheckin(dateISO){
  const t=dateISO||st._ckDate||todayISO(); st._ckDate=t;
  const c=st.checkins[t]||{soreness:{},sleep:null,habits:{}};
  const today=todayISO(), dias=["L","M","X","J","V","S","D"];
  let html='<div class="ctitle">☀️ Check-in — '+(t===today?"hoy":DAYNAMES[(dateFromISO(t).getDay()+6)%7])+' '+t.slice(8,10)+'/'+t.slice(5,7)+'</div>';
  // tira de días de la semana
  html+='<div style="display:flex;gap:5px;margin-bottom:14px">';
  ckWeekDates().forEach((d,i)=>{
    const fut=daysBetween(today,d)>0, done=!!(st.checkins[d]&&st.checkins[d]._saved), cur=d===t;
    html+='<button class="btn3" style="flex:1;padding:6px 2px;text-align:center;'+(cur?'border-color:#e8ff3a;color:#e8ff3a;':'')+(done?'background:rgba(58,255,184,.12);':'')+(fut?'opacity:.25;':'')+'" '+(fut?'disabled':'onclick="openCheckin(\''+d+'\')"')+'>'+dias[i]+'<br><span style="font-size:10px">'+d.slice(8,10)+'</span>'+(done?'<br><span style="color:#3affb8">✓</span>':'')+'</button>';
  });
  html+='</div>';
  html+='<div style="font-size:12px;font-weight:600;margin-bottom:6px">💢 Agujetas (0 nada · 3 fuertes)</div>';
  MUSCLES.forEach(mu=>{
    html+='<div class="row" style="padding:4px 0"><span style="font-size:12px">'+mu.name+'</span><span class="chips">';
    for(let i=0;i<=3;i++) html+='<button class="btn3'+((c.soreness[mu.id]||0)===i?' sel':'')+'" style="min-width:30px" onclick="ckSore(\''+mu.id+'\','+i+')">'+i+'</button>';
    html+='</span></div>';
  });
  html+='<div style="font-size:12px;font-weight:600;margin:12px 0 6px">😴 Horas de sueño</div><div class="chips">';
  SLEEPOPTS.forEach((lb,i)=>{ html+='<button class="btn3'+(c.sleep===i+1?' sel':'')+'" style="font-size:10px" onclick="ckSleep('+(i+1)+')">'+lb+'</button>'; });
  html+='</div><div style="font-size:12px;font-weight:600;margin:12px 0 6px">✅ Hábitos del día</div>';
  habits().forEach(hb=>{
    html+='<button class="btn3'+(c.habits[hb.id]?' sel':'')+'" style="width:100%;text-align:left;margin-bottom:5px" onclick="ckHabit(\''+hb.id+'\')"><span class="row"><span>'+(hb.icon||"✅")+' '+esc(hb.name)+'</span><span style="color:#3affb8;font-family:monospace">+'+(hb.w||1)+'</span></span>'+(hb.desc?'<span class="dim" style="font-size:10px;display:block;margin-top:2px">'+esc(hb.desc)+'</span>':'')+'</button>';
  });
  html+='<button class="btn" style="margin-top:12px" onclick="saveCheckin()">GUARDAR CHECK-IN</button>';
  st._ckDraft=c;
  overlay(html);
}
function ckSore(m,v){ st._ckDraft.soreness[m]=v; ckPersist(); }
function ckSleep(v){ st._ckDraft.sleep=v; ckPersist(); }
function ckHabit(id){ st._ckDraft.habits[id]=!st._ckDraft.habits[id]; ckPersist(); }
function ckPersist(){ const d=st._ckDraft; st.checkins[st._ckDate]=d; openCheckin(st._ckDate); st._ckDraft=d; }
function saveCheckin(){
  const t=st._ckDate||todayISO(), first=!st.checkins[t]||!st.checkins[t]._saved;
  const d=st._ckDraft; d._saved=true; st.checkins[t]=d;
  if(first&&t===todayISO()){ const hw=habits().reduce((a,hb)=>a+((d.habits||{})[hb.id]?(hb.w||1):0),0);
    addPoints(PTS.checkin+hw,"Check-in + hábitos (+"+hw+")"); }
  save(); closeOverlay(); toast("Check-in guardado ✓"); render();
}

/* ── tests de movilidad ── */
function openMobTests(){
  const draft=st._mobDraft||{};
  let html='<div class="ctitle">📏 Tests de movilidad — '+Object.keys(draft).length+'/'+MOB_TESTS.length+'</div>';
  MOB_TESTS.forEach(tst=>{
    html+='<div style="margin-bottom:12px"><div style="font-size:13px;font-weight:600;color:#3affb8">'+tst.name+'</div><div class="dim" style="font-size:11px;margin-bottom:6px">'+tst.desc+'</div><div style="display:flex;gap:4px">';
    tst.levels.forEach((lv,i)=>{ html+='<button class="btn3'+(draft[tst.id]===i+1?' sel':'')+'" style="flex:1;font-size:9px;padding:6px 2px;line-height:1.3" onclick="mobSet(\''+tst.id+'\','+(i+1)+')">'+(i+1)+'<br>'+esc(lv)+'</button>'; });
    html+='</div></div>';
  });
  html+='<button class="btn" '+(Object.keys(draft).length<MOB_TESTS.length?'disabled':'')+' onclick="saveMobTests()">GUARDAR TESTS</button>';
  overlay(html);
}
function mobSet(id,v){ st._mobDraft=st._mobDraft||{}; st._mobDraft[id]=v; openMobTests(); }
function saveMobTests(){
  st.mobHistory.push({date:new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"short"}),scores:Object.assign({},st._mobDraft)});
  st._mobDraft={}; save(); closeOverlay(); toast("Tests guardados ✓"); render();
}

  const score=dekaScore();

  const mon=ckWeekDates()[0];
  st.scoreSnaps=st.scoreSnaps||{};

  const prevMon=(()=>{const d=dateFromISO(mon);d.setDate(d.getDate()-7);return todayISO(d);})();
  const prev=st.scoreSnaps[prevMon];
  const delta=prev!=null?score-prev:null;
  const dTxt=delta==null?'':' · <span style="color:'+(delta>=0?'#3affb8':'#ff4f3a')+'">'+(delta>=0?'▲':'▼')+Math.abs(delta).toFixed(1)+' vs sem. anterior</span>';

  });

  const sr=h('<div class="card"><div class="ctitle">Carga interna (sRPE) — últimas 4 semanas</div><div style="display:flex;align-items:flex-end;gap:8px;height:80px" id="srpebars"></div></div>');
  const weeks=[3,2,1,0].map(off=>{
    const end=new Date(); end.setDate(end.getDate()-off*7);

  const ph=h('<div class="card"><div class="ctitle">Historial de paces</div></div>');
  if(!st.paceHistory.length) ph.appendChild(h('<div class="dim mono" style="font-size:11px;text-align:center;padding:12px">Sin datos aún.</div>'));

    el.appendChild(mh);
  }
  return el;
}
function drawRadar(){
  const canvas=$("radar"); if(!canvas) return;
  const ctx=canvas.getContext("2d"), W=240,H=240,cx=W/2,cy=H/2,r=88;
  ctx.clearRect(0,0,W,H);
  const angles=CATS.map((c,i)=>-Math.PI/2+Math.PI*2*i/CATS.length);
  for(let ring=1;ring<=5;ring++){ const rr=r*ring/5; ctx.beginPath();
    angles.forEach((a,i)=>{const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.closePath(); ctx.strokeStyle="rgba(255,255,255,0.06)"; ctx.stroke(); }
  angles.forEach(a=>{ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*1.08*Math.cos(a),cy+r*1.08*Math.sin(a));ctx.strokeStyle="rgba(255,255,255,0.08)";ctx.stroke();});
  const vals=CATS.map(c=>{const s=catScore(c.id);return s!=null?Math.min(1,s/100):0.06;});
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,"rgba(232,255,58,0.15)");grad.addColorStop(1,"rgba(232,255,58,0.02)");
  ctx.beginPath();
  angles.forEach((a,i)=>{const rr=r*vals[i],x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle="rgba(232,255,58,0.5)";ctx.lineWidth=2;ctx.stroke();
  angles.forEach((a,i)=>{ const rr=r*vals[i];
    ctx.beginPath();ctx.arc(cx+rr*Math.cos(a),cy+rr*Math.sin(a),4,0,Math.PI*2);ctx.fillStyle=CATS[i].color;ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.6)";ctx.font="bold 7px monospace";ctx.textAlign="center";
    ctx.fillText(CATS[i].label,cx+(r+18)*Math.cos(a),cy+(r+18)*Math.sin(a)); });
}

/* ═══════════════════ GENERADOR DE WOD ═══════════════════ */
var genOpts={focus:"auto",mins:30};
function openGenerator(source){
  const foci=[["auto","⚖️ Equilibrar"],["metabólico","🔥 Metabólico"],["fuerza","💪 Fuerza"],["hyrox","🏁 HYROX"],["core","🎯 Core"],["z2","💚 Z2 suave"]];
  let html='<div class="ctitle">⚙ Generador de WOD</div>';
  html+='<div style="font-size:12px;font-weight:600;margin-bottom:6px">Enfoque</div><div class="chips" style="margin-bottom:12px">';
  foci.forEach(([id,lb])=>{ html+='<button class="btn3'+(genOpts.focus===id?' sel':'')+'" onclick="genSet(\'focus\',\''+id+'\')">'+lb+'</button>'; });
  html+='</div><div style="font-size:12px;font-weight:600;margin-bottom:6px">Duración</div><div class="chips" style="margin-bottom:12px">';
  [20,30,40].forEach(m=>{ html+='<button class="btn3'+(genOpts.mins===m?' sel':'')+'" onclick="genSet(\'mins\','+m+')">'+m+' min</button>'; });
  html+='</div>';
  const ms=muscleStatus();
  const avoid=MUSCLES.filter(m=>ms[m.id].flag==="sobrecarga"||ms[m.id].sore>=2);
  if(avoid.length) html+='<div style="font-size:11px;color:#ffb347;margin-bottom:10px">Se evitarán: '+avoid.map(m=>m.name).join(", ")+'</div>';
  const low=MUSCLES.map(m=>({m,rel:ms[m.id].rel})).sort((a,b)=>a.rel-b.rel).slice(0,3);
  html+='<div class="dim" style="font-size:11px;margin-bottom:12px">Zonas menos trabajadas (7d): '+low.map(x=>x.m.name).join(", ")+'</div>';
  html+='<button class="btn" onclick="generateWod()">GENERAR WOD</button>';
  html+='<button class="btn2" style="margin:0" onclick="openBuilder()">✏️ Prefiero diseñarlo yo (AMRAP, EMOM…)</button>';
  overlay(html);
}
function genSet(k,v){ genOpts[k]=v; openGenerator(); }
function generateWod(){
  const ms=muscleStatus();
  const focus=genOpts.focus, mins=genOpts.mins;
  const nEx=mins<=20?3:mins<=30?4:5, nSets=mins>=40?4:3;
  // base: sin ergómetros y respetando sobrecarga/agujetas SIEMPRE
  const safe=EXDB.filter(e=>!e.erg&&!Object.entries(e.m).some(([mu,c])=>c>=0.5&&(ms[mu].flag==="sobrecarga"||ms[mu].sore>=2)));
  let pool=safe.slice();
  if(focus==="metabólico") pool=pool.filter(e=>e.cat==="metabólico"||e.cat==="hyrox");
  else if(focus==="fuerza") pool=pool.filter(e=>e.cat==="fuerza");
  else if(focus==="hyrox") pool=pool.filter(e=>e.cat==="hyrox");
  else if(focus==="core") pool=pool.filter(e=>e.cat==="core"||Object.keys(e.m).includes("core"));
  else if(focus==="z2") pool=pool.filter(e=>e.cat!=="fuerza"); // bodyweight continuo
  // si el enfoque deja pocos, rellenar con el resto de ejercicios seguros (nunca los excluidos)
  if(pool.length<nEx) safe.forEach(e=>{ if(!pool.includes(e)) pool.push(e); });
  // puntuar: prioriza músculos poco trabajados; diversifica en greedy
  const temp={}; MUSCLES.forEach(m=>temp[m.id]=ms[m.id].rel);
  const chosen=[];
  for(let i=0;i<nEx&&pool.length;i++){
    pool.forEach(e=>{ e._score=Object.entries(e.m).reduce((a,[mu,c])=>a+c*(1-Math.min(1,temp[mu])),0)+Math.random()*0.3; });
    pool.sort((a,b)=>b._score-a._score);
    const pick=pool.shift(); chosen.push(pick);
    Object.entries(pick.m).forEach(([mu,c])=>temp[mu]=Math.min(1.5,temp[mu]+c*0.5));
  }
  const wod=chosen.map(e=>({name:e.name,cat:e.cat,sets:nSets,reps:e.reps,rest:focus==="z2"?45:e.rest,weight:e.weight,note:e.note,paceMin:e.paceMin,paceMax:e.paceMax,unit:e.unit}));
  previewWod(wod, focus==="z2");
}
function previewWod(wod,isZ2){
  st._wodDraft={wod,isZ2};
  let html='<div class="ctitle">'+(isZ2?'💚 WOD Z2 — continuo, FC <130':'⚡ WOD generado')+'</div>';
  wod.forEach((e,i)=>{
    const saved=st.savedPaces[e.name];
    html+='<div class="daybox"><div class="row"><div><div style="font-size:14px;font-weight:600">'+esc(e.name)+'</div><div class="dim" style="font-size:11px">'+e.sets+'×'+e.reps+(e.unit==="seg"?'s':'')+' · '+esc(e.weight)+' · '+e.rest+'s desc</div></div><div class="mono" style="font-size:10px;color:'+(saved?'#e8ff3a':'#ff4f3a')+'">'+(saved?'pace '+(saved+2):'1ª vez')+'</div></div></div>';
  });
  if(isZ2) html+='<div style="font-size:11px;color:#3affb8;margin:8px 0">Modo Z2: ritmo cómodo constante, sin buscar PB. Registra FC media al final — cuenta como sesión Z2 si ≤130.</div>';
  html+='<button class="btn" onclick="startWod()">▶ EMPEZAR</button><button class="btn2" onclick="generateWod()">↻ Regenerar</button>';
  overlay(html);
}

/* ═══════════════════ PLAYER WOD (metrónomo) ═══════════════════ */
var P={timers:[]};
function pClear(){ P.timers.forEach(clearInterval); P.timers=[]; }
function stopAllTimers(){ pClear(); }
function startWod(){
  const d=st._wodDraft; if(!d) return;
  Object.assign(P,{wod:d.wod,isZ2:d.isZ2,idx:0,set:1,results:[],setResults:[],running:false,resting:false,elapsed:0,restSec:0,startTime:Date.now(),pace:0,beat:-1});
  pInitEx(); pRender();
}
function pInitEx(){
  const ex=P.wod[P.idx], saved=st.savedPaces[ex.name];
  P.pace = P.isZ2 ? (saved?Math.max(ex.paceMin,saved-10):0) : (saved?saved+2:0);
  P.set=1; P.setResults=[]; P.elapsed=0; P.running=false; P.resting=false;
}
function pRender(){
  const ex=P.wod[P.idx];
  const m=String(Math.floor(P.elapsed/60)).padStart(2,"0"), s=String(P.elapsed%60).padStart(2,"0");
  const first=!P.pace;
  let html='<div class="row" style="margin-bottom:8px"><span class="mono dim" style="font-size:10px">'+(P.idx+1)+'/'+P.wod.length+' · SERIE '+P.set+'/'+ex.sets+'</span><button class="btn3" onclick="pQuit()">✕ Salir</button></div>';
  html+='<div style="display:flex;gap:4px;margin-bottom:12px">'+P.wod.map((_,i)=>'<div style="height:3px;flex:1;border-radius:2px;background:'+(i<P.idx?'#e8ff3a':i===P.idx?'rgba(232,255,58,.4)':'#2a2a40')+'"></div>').join("")+'</div>';
  if(first) html+='<div style="background:rgba(255,79,58,.08);border:1px solid rgba(255,79,58,.3);border-radius:10px;padding:10px;margin-bottom:10px;font-size:11px;color:#ff4f3a;text-align:center" class="mono">⏱ PRIMERA VEZ — cronómetro puro. Hoy marcas la referencia.</div>';
  if(P.isZ2) html+='<div style="font-size:11px;color:#3affb8;text-align:center;margin-bottom:8px">💚 Z2 — continuo y cómodo, la FC manda</div>';
  html+='<div class="big" style="font-size:32px;letter-spacing:2px;color:#e8ff3a">'+esc(ex.name)+'</div>';
  html+='<div class="dim" style="font-size:11px;margin-bottom:8px">'+esc(ex.note||"")+'</div>';
  html+='<div style="display:flex;gap:16px;margin-bottom:10px" class="mono">'+[[ex.sets+'×','series'],[ex.reps+(ex.unit==="seg"?'s':''),'reps'],[ex.rest+'s','descanso'],[esc(ex.weight),'peso']].map(([v,l])=>'<div><div class="dim" style="font-size:8px;text-transform:uppercase">'+l+'</div><div style="font-size:15px">'+v+'</div></div>').join("")+'</div>';
  html+='<div style="display:flex;gap:7;justify-content:center;gap:7px;margin-bottom:10px">'+Array.from({length:ex.sets},(_,i)=>'<div style="width:11px;height:11px;border-radius:50%;background:'+(i<P.set-1?'#e8ff3a':'transparent')+';border:2px solid '+(i===P.set-1?'#3affb8':'#2a2a40')+'"></div>').join("")+'</div>';
  // pace
  html+='<div style="background:#12121a;border:1px solid #2a2a40;border-radius:12px;padding:12px;margin-bottom:10px">';
  html+='<div class="row"><div><div class="mono dim" style="font-size:9px;letter-spacing:2px">PACE</div><div class="big" style="font-size:'+(P.pace?'42':'22')+'px;color:'+(P.pace?'#e8ff3a':'#6a6a8a')+'">'+(P.pace||"—")+'</div></div><div class="mono dim" style="font-size:10px;text-align:right">'+(P.pace?(P.pace/5).toFixed(1)+' reps/min<br>beat cada '+(60/(P.pace/5)).toFixed(2)+'s':'Cronómetro puro')+'</div></div>';
  if(ex.paceMax>0) html+='<div style="display:flex;gap:6px;margin-top:8px;align-items:center">'+[[-5,'-5'],[-1,'−'],[1,'+'],[5,'+5']].map(([d,l])=>'<button class="btn3" style="min-width:34px" '+(P.pace?'':'disabled')+' onclick="pPace('+d+')">'+l+'</button>').join("")+'<input type="range" min="'+ex.paceMin+'" max="'+ex.paceMax+'" value="'+(P.pace||ex.paceMin)+'" oninput="pPaceSet(this.value)"></div>';
  html+='</div>';
  // beats
  html+='<div style="display:flex;justify-content:center;gap:6px;padding:6px 0">'+Array.from({length:8},(_,i)=>'<div class="beatdot'+(P.beat===i?' on':'')+'" id="bd'+i+'"></div>').join("")+'</div>';
  // timer
  html+='<div style="text-align:center;margin:4px 0 12px"><div class="big" style="font-size:56px;letter-spacing:4px;color:'+(P.running?'#3affb8':first?'#ff4f3a':'#e8e8f0')+'">'+m+':'+s+'</div><div class="mono dim" style="font-size:9px;letter-spacing:2px;text-transform:uppercase">'+(P.running?(first?'CRONOMETRANDO — '+ex.reps+' reps':'SERIE EN CURSO'):'LISTO')+'</div></div>';
  if(P.resting){
    html+='<div style="text-align:center;border:1px solid rgba(255,79,58,.3);border-radius:12px;padding:12px;margin-bottom:8px"><div class="mono dim" style="font-size:11px;letter-spacing:3px">DESCANSO</div><div class="big" style="font-size:60px;color:#ff4f3a" id="restnum">'+P.restSec+'</div><button class="btn2" style="margin:0" onclick="pSkipRest()">Saltar descanso</button></div>';
  } else {
    html+='<button class="btn" onclick="pMain()">'+(P.running?'COMPLETAR SERIE':'INICIAR')+'</button>';
    html+='<div style="display:flex;gap:8px"><button class="btn2" style="margin:0" onclick="pReset()">↺ Reset</button><button class="btn2" style="margin:0" onclick="pSkipEx()">Saltar ejercicio →</button></div>';
  }
  overlay(html);
}
function pPace(d){ const ex=P.wod[P.idx]; P.pace=Math.max(ex.paceMin,Math.min(ex.paceMax,(P.pace||ex.paceMin)+d)); if(P.running) pStartMetro(); pRender(); }
function pPaceSet(v){ P.pace=parseInt(v); if(P.running) pStartMetro(); pRender(); }
function pStartMetro(){
  P.timers=P.timers.filter(t=>t!==P.metro); clearInterval(P.metro);
  if(!P.pace) return;
  const ms=60000/(P.pace/5); let b=0;
  P.metro=setInterval(()=>{ P.beat=b%8; beep(880,0.05); b++;
    for(let i=0;i<8;i++){ const el=$("bd"+i); if(el) el.classList.toggle("on",i===P.beat); }
    setTimeout(()=>{const el=$("bd"+P.beat); if(el) el.classList.remove("on");},170);
  },ms);
  P.timers.push(P.metro);
}
function pMain(){
  const ex=P.wod[P.idx];
  if(P.resting) return;
  if(!P.running){
    P.running=true; P.elapsed=0;
    P.chron=setInterval(()=>{ P.elapsed++; const el=$("overlay").querySelector(".big[style*='56px']"); if(el){const m=String(Math.floor(P.elapsed/60)).padStart(2,"0"),s2=String(P.elapsed%60).padStart(2,"0"); el.textContent=m+":"+s2;} },1000);
    P.timers.push(P.chron);
    if(P.pace) pStartMetro();
    pRender(); // re-render resets chron display refs
  } else {
    pClear(); P.running=false; P.beat=-1;
    const t=Math.max(1,P.elapsed);
    const rpm=(ex.reps/t)*60, ap=Math.round(rpm*5);
    P.setResults.push({set:P.set,time:t,pace:ex.paceMax>0?ap:0,reps:ex.reps});
    if(P.set<ex.sets){ P.set++; pStartRest(ex.rest,false); }
    else {
      const paced=P.setResults.filter(r=>r.pace>0);
      const avg=paced.length?Math.round(paced.reduce((a,b)=>a+b.pace,0)/paced.length):0;
      P.results.push({name:ex.name,sets:P.setResults.slice(),avgPace:avg,totalReps:ex.reps*ex.sets,unit:ex.unit});
      if(P.idx<P.wod.length-1){ pStartRest(ex.rest*2,true); }
      else { pFeedback(); }
    }
  }
}
function pStartRest(sec,nextEx){
  P.resting=true; P.restSec=sec; P.nextEx=nextEx; P.elapsed=0; pRender();
  P.rest=setInterval(()=>{
    P.restSec--;
    if(P.restSec<=3&&P.restSec>0) beep(440,0.1);
    const el=$("restnum"); if(el) el.textContent=P.restSec;
    if(P.restSec<=0){ clearInterval(P.rest); P.resting=false; beep(660,0.15);
      if(P.nextEx){ P.idx++; pInitEx(); } else { P.elapsed=0; }
      pRender(); }
  },1000);
  P.timers.push(P.rest);
}
function pSkipRest(){ clearInterval(P.rest); P.resting=false; beep(660,0.15); if(P.nextEx){ P.idx++; pInitEx(); } else P.elapsed=0; pRender(); }
function pReset(){ pClear(); P.running=false; P.beat=-1; P.elapsed=0; pRender(); }
function pSkipEx(){ pClear(); P.running=false; if(P.idx<P.wod.length-1){ P.idx++; pInitEx(); pRender(); } else pFeedback(); }
function pQuit(){ pClear(); closeOverlay(); }
function pFeedback(){
  pClear();
  const mins=Math.max(1,Math.round((Date.now()-P.startTime)/60000));
  st._fb={results:P.results,durationMin:mins,mode:"wod",isZ2:P.isZ2};
  showFeedback();
}

function fbRpe(v){ st._fb.rpe=v; keepFbInputs(); showFeedback(); }
function fbFeel(f){ const a=st._fb.feelings; a.includes(f)?a.splice(a.indexOf(f),1):a.push(f); keepFbInputs(); showFeedback(); }
function keepFbInputs(){ const fc=$("fbFc"),n=$("fbNotes"); if(fc) st._fb.fcAvg=fc.value?parseInt(fc.value):null; if(n) st._fb.notes=n.value; }
function saveSession(){
  keepFbInputs();
  const fb=st._fb, pos=planPos(), t=todayISO();
  const day=pos.week>=1?planDay(pos.week,pos.dayIdx):null;
  const isPlanned=!!day&&day.t!=="Descanso";
  const type=fb.type||(day&&day.t!=="Descanso"?day.t:(fb.mode==="pacer"&&fb.results&&fb.results[0]?fb.results[0].name:(fb.mode==="wod"?"Metabólico":"Libre")));
  const z2Expected=fb.isZ2||(day&&DTYPE[day.t]&&DTYPE[day.t].z2);
  const z2ok=z2Expected? z2Check(fb.fcAvg) : undefined;
  const exercises=(fb.results||[]).map(r=>({name:r.name,avgPace:r.avgPace||null,totalReps:r.totalReps,sets:r.sets}));
  const muscleLoad=sessionMuscleLoad(exercises);
  const srpe=computeSRPE(fb.rpe,fb.durationMin);
  const pts=fb.mode==="mob"?PTS.mobilidad:isPlanned?PTS.plan:fb.mode==="wod"?PTS.generado:PTS.libre;
  const sess={id:Date.now(),date:t,week:pos.week>0?pos.week:null,dayIdx:pos.dayIdx,type,mode:fb.mode,
    exercises,durationMin:fb.durationMin,rpe:fb.rpe,srpe,fcAvg:fb.fcAvg||null,
    z2ok:z2Expected?!!z2ok:undefined,feelings:fb.feelings,notes:fb.notes||"",muscleLoad,points:pts,format:fb.formatName||null};
  st.sessions.push(sess);
  // actualizar paces
  exercises.forEach(e=>{ if(e.avgPace){ st.savedPaces[e.name]=e.avgPace;
    st.paceHistory.push({exercise:e.name,pace:e.avgPace,date:new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"short"}),cat:(EXDB.find(x=>x.name===e.name)||{}).cat}); } });
  addPoints(pts,(isPlanned?"Sesión del plan":"Sesión "+fb.mode)+" — "+type);
  if(z2Expected&&!z2ok&&fb.fcAvg) toast("⚠ FC "+fb.fcAvg+" — fuera de Z2. La próxima, más suave.");
  // semana perfecta
  if(pos.week>=1){ const d=disciplineWeek(pos.week); if(d&&d.plannedDue>0&&d.done>=d.plannedDue&&pos.dayIdx===6){ st.perfectWeeks++; addPoints(PTS.weekPerfect,"Semana perfecta S"+pos.week); } }
  st._fb=null; save(); closeOverlay(); render(); toast("Sesión guardada · +"+pts+" pts ⚡");
}

function pcRender(){

  html+='<div style="display:flex;gap:6px;margin-top:8px;align-items:center"><button class="btn3" onclick="pcBpm(-1)">−</button><input type="range" min="'+mx.spm[0]+'" max="'+mx.spm[1]+'" value="'+PC.bpm+'" oninput="pcBpmSet(this.value)"><button class="btn3" onclick="pcBpm(1)">+</button></div></div>';

  overlay(html);
}
function pcMachine(n){ PC.machine=n; PC._userBpm=false; pcRender(); }
function pcBpm(d){ PC.bpm+=d; PC._userBpm=true; if(PC.running) pcMetro(); pcRender(); }
function pcBpmSet(v){ PC.bpm=parseInt(v); PC._userBpm=true; if(PC.running) pcMetro(); pcRender(); }
function pcMetro(){
  clearInterval(PC.metro);
  const ms=60000/PC.bpm; let b=0;
  PC.metro=setInterval(()=>{ const bi=b%8; beep(PC.z2?660:880,0.05); b++;
    for(let i=0;i<8;i++){ const el=$("pbd"+i); if(el) el.classList.toggle("on",i===bi); }
  },ms);
  PC.timers.push(PC.metro);
}
function pcToggle(){
  if(!PC.running){ PC.running=true;
    PC.chron=setInterval(()=>{ PC.elapsed++; const el=$("pcclock"); if(el){const m=String(Math.floor(PC.elapsed/60)).padStart(2,"0"),s=String(PC.elapsed%60).padStart(2,"0"); el.textContent=m+":"+s;} },1000);
    PC.timers.push(PC.chron); pcMetro(); pcRender(); pcToggleResume();
  } else { PC.running=false; PC.timers.forEach(clearInterval); PC.timers=[]; pcRender(); }
}
function pcToggleResume(){ /* re-render mata el interval visual pero los timers siguen */ }
function pcQuit(){ PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false; closeOverlay(); }
function pcFinish(){
  PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false;
  const mins=Math.max(1,Math.round(PC.elapsed/60));
  st._fb={results:[{name:PC.machine,avgPace:null,totalReps:mins*10,unit:"min"}],durationMin:mins,mode:"pacer",isZ2:PC.z2,type:null};
  showFeedback();
}

/* ── PLAYER DE FORMATOS ── */
var FP={timers:[]};
function fpClear(){ (FP.timers||[]).forEach(clearInterval); FP.timers=[]; }
function fpRender(){
  const f=FP.fmt, meta=FORMATS[f];
  const countdown=(f==="amrap"||f==="emom");
  const totalSec=countdown?FP.mins*60:null;
  const remain=countdown?Math.max(0,totalSec-FP.elapsed):null;
  const shown=countdown?remain:FP.elapsed;
  const mm=String(Math.floor(shown/60)).padStart(2,"0"), ss=String(shown%60).padStart(2,"0");
  let html='<div class="row" style="margin-bottom:10px"><span class="mono dim" style="font-size:10px">'+meta.icon+' '+meta.name+'</span><button class="btn3" onclick="fpQuit()">✕ Salir</button></div>';
  if(f==="ladder"){ const sch=FP.scheme;
    html+='<div class="chips" style="margin-bottom:10px">'+sch.map((r,i)=>'<span class="tagz" style="background:'+(i<FP.rung?'#e8ff3a22;color:#e8ff3a':i===FP.rung?'#3affb822;color:#3affb8':'#23233f;color:#6a6a8a')+'">'+r+'</span>').join("")+'</div>';
    html+='<div style="text-align:center;margin-bottom:8px"><span class="big" style="font-size:44px;color:#3affb8">'+(sch[FP.rung]!=null?sch[FP.rung]:"✓")+'</span> <span class="mono dim" style="font-size:10px">reps de cada uno</span></div>';
  }
  if(f==="emom"){ const min=Math.floor(FP.elapsed/60); const cur=FP.ex[min%FP.ex.length]; const nxt=FP.ex[(min+1)%FP.ex.length];
    const inMin=60-(FP.elapsed%60);
    html+='<div style="text-align:center;margin-bottom:8px"><div class="mono dim" style="font-size:9px;letter-spacing:2px">MINUTO '+(min+1)+'/'+FP.mins+' · quedan <span id="fpinmin">'+inMin+'</span>s</div><div class="big" style="font-size:30px;color:#e8ff3a">'+esc(cur.name)+' ×'+cur.reps+'</div><div class="dim" style="font-size:11px">siguiente: '+esc(nxt.name)+'</div></div>';
  }
  // lista de ejercicios (una ronda)
  if(f!=="emom") FP.ex.forEach(e=>{ html+='<div class="daybox" style="padding:7px 11px"><div class="row"><span style="font-size:13px;font-weight:600">'+esc(e.name)+'</span><span class="mono" style="font-size:12px;color:#3affb8">'+(f==="ladder"?"↕":"×"+e.reps)+'</span></div></div>'; });
  // reloj
  html+='<div style="text-align:center;margin:10px 0"><div class="big" id="fpclock" style="font-size:60px;letter-spacing:4px;color:'+(FP.running?(countdown&&remain<60?'#ff4f3a':'#3affb8'):'#e8e8f0')+'">'+mm+':'+ss+'</div><div class="mono dim" style="font-size:9px;letter-spacing:2px">'+(countdown?"CUENTA ATRÁS":"TIEMPO")+(FP.cap&&f==="fortime"?' · CAP '+FP.cap+"'":'')+'</div></div>';
  // rondas
  if(f==="amrap") html+='<div style="text-align:center;margin-bottom:10px"><span class="big" style="font-size:40px;color:#e8ff3a">'+FP.done+'</span> <span class="mono dim" style="font-size:10px">RONDAS</span></div>';
  if(f==="fortime"||f==="circuit") html+='<div style="text-align:center;margin-bottom:10px"><span class="big" style="font-size:40px;color:#e8ff3a">'+FP.done+'</span><span class="mono dim" style="font-size:12px">/'+FP.rounds+' RONDAS</span></div>';
  if(!FP.running&&FP.elapsed===0) html+='<button class="btn" onclick="fpToggle()">▶ EMPEZAR</button>';
  else{
    if(f==="amrap") html+='<button class="btn" onclick="fpRound()">+1 RONDA</button>';
    if(f==="fortime"||f==="circuit") html+='<button class="btn" onclick="fpRound()">✓ RONDA HECHA</button>';
    if(f==="ladder") html+='<button class="btn" onclick="fpRung()">✓ PELDAÑO HECHO</button>';
    html+='<div style="display:flex;gap:8px"><button class="btn2" style="margin:0;flex:1" onclick="fpToggle()">'+(FP.running?'⏸ Pausa':'▶ Seguir')+'</button><button class="btn2" style="margin:0;flex:1" onclick="fpFinish()">🏁 Terminar</button></div>';
  }
  overlay(html);
}
function fpToggle(){
  if(FP.running){ FP.running=false; fpClear(); fpRender(); return; }
  FP.running=true;
  FP.t=setInterval(()=>{
    FP.elapsed++;
    const f=FP.fmt, countdown=(f==="amrap"||f==="emom");
    const totalSec=FP.mins*60;
    if(f==="emom"){
      const inMin=60-(FP.elapsed%60);
      const im=$("fpinmin"); if(im) im.textContent=inMin;
      if(FP.elapsed%60===0&&FP.elapsed<totalSec){ beep(990,0.12); setTimeout(()=>beep(990,0.12),160); fpRender(); fpResume(); return; }
      if(inMin<=3) beep(440,0.08);
    }
    if(countdown){
      const remain=totalSec-FP.elapsed;
      if(remain<=0){ fpFinish(); return; }
      if(remain<=3) beep(440,0.1);
      const c=$("fpclock"); if(c) c.textContent=String(Math.floor(remain/60)).padStart(2,"0")+":"+String(remain%60).padStart(2,"0");
    } else {
      if(FP.cap&&FP.fmt==="fortime"&&FP.elapsed>=FP.cap*60){ toast("⏱ Time cap"); fpFinish(); return; }
      const c=$("fpclock"); if(c) c.textContent=String(Math.floor(FP.elapsed/60)).padStart(2,"0")+":"+String(FP.elapsed%60).padStart(2,"0");
    }
  },1000);
  FP.timers.push(FP.t);
  beep(660,0.15); fpRender(); fpResume();
}
function fpResume(){ /* tras re-render el interval sigue vivo */ }
function fpRound(){
  FP.done++; beep(880,0.1);
  if((FP.fmt==="fortime"||FP.fmt==="circuit")&&FP.done>=FP.rounds){ fpFinish(); return; }
  if(FP.fmt==="circuit"&&FP.rest){ toast("Descanso "+FP.rest+"s"); }
  fpRender();
}
function fpRung(){
  FP.rung++; beep(880,0.1);
  if(FP.rung>=FP.scheme.length){ fpFinish(); return; }
  fpRender();
}
function fpFinish(){
  if(FP.finished) return; FP.finished=true;
  fpClear(); FP.running=false;
  const mins=Math.max(1,Math.round(FP.elapsed/60));
  const rd=FP.fmt==="ladder"?FP.rung:(FP.done||1);
  st._fb={results:fpResults(FP.fmt,rd,mins),durationMin:mins,mode:"wod",formatName:FORMATS[FP.fmt].name+
    (FP.fmt==="amrap"?" — "+FP.done+" rondas":FP.fmt==="fortime"?" — "+String(Math.floor(FP.elapsed/60)).padStart(2,"0")+":"+String(FP.elapsed%60).padStart(2,"0"):"")};
  showFeedback();
}
function fpQuit(){ fpClear(); FP.finished=true; closeOverlay(); }

/* ═══════════════════ INIT ═══════════════════ */
const _origClose=closeOverlay;
closeOverlay=function(){ pClear(); fpClear(); FP.running=false; PC.timers.forEach(clearInterval); PC.timers=[]; PC.running=false; st._ckDate=null; _origClose(); };
checkBadges();
render();
</script>
